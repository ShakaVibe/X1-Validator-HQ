                <span className="text-xs mt-1">Approve</span>
              </div>
              <div className="flex-1 h-px bg-gray-700 mx-2" />
              <div className={`flex flex-col items-center ${step === 'execute' || step === 'done' ? theme.text : 'text-gray-500'}`}>
                <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${step === 'done' ? 'bg-green-500/20 text-green-400' : step === 'execute' ? theme.card + ' ' + theme.border + ' border' : 'bg-gray-800'}`}>
                  {step === 'done' ? '✓' : '3'}
                </div>
                <span className="text-xs mt-1">Trigger</span>
              </div>
            </div>
            
            {/* Status Messages */}
            {status.error && (
              <div className="mb-4 p-3 bg-red-500/20 border border-red-500/30 rounded-lg text-red-400 text-sm">
                {status.error}
              </div>
            )}
            
            {/* Action Buttons */}
            {step === 'connect' && !wallet.isConnected && (
              <button
                onClick={connectWallet}
                disabled={status.loading}
                className={`w-full py-3 rounded-lg font-semibold transition-all ${theme.card} border ${theme.border} ${theme.text} hover:bg-white/10 disabled:opacity-50`}
              >
                {status.loading ? 'Connecting...' : '🔗 Connect Wallet'}
              </button>
            )}
            
            {(step === 'approve' || step === 'execute') && wallet.isConnected && !status.success && (
              <div className="space-y-3">
                <div className="text-sm text-gray-400 text-center">
                  Connected: {wallet.address?.slice(0,6)}...{wallet.address?.slice(-4)}
                </div>
                <button
                  onClick={executeTrigger}
                  disabled={status.loading}
                  className={`w-full py-3 rounded-lg font-semibold transition-all ${theme.card} border ${theme.border} ${theme.text} hover:bg-white/10 disabled:opacity-50`}
                >
                  {status.loading ? (
                    step === 'approve' ? '⏳ Approving...' : '⏳ Buying & Selling...'
                  ) : (
                    `⚡ Buy + Sell to Trigger`
                  )}
                </button>
              </div>
            )}
            
            {(step === 'done' || status.success) && (
              <div className="space-y-3">
                <div className="p-4 bg-green-500/20 border border-green-500/30 rounded-lg text-center">
                  <div className="text-green-400 text-2xl mb-2">✅</div>
                  <div className="text-green-400 font-semibold">Distribution Triggered!</div>
                  <div className="text-green-400/70 text-sm mt-1">Rewards paid & UFO burned</div>
                </div>
                <button
                  onClick={onClose}
                  className={`w-full py-3 rounded-lg font-semibold transition-all bg-green-500/20 border border-green-500/30 text-green-400 hover:bg-green-500/30`}
                >
                  Close
                </button>
              </div>
            )}
          </div>
        </div>
      );
    };

    // ============================================
    // PTGC DAO PAGE COMPONENT
    // ============================================
    const PTGCDAOPage = ({ onBack, plsPrice }) => {
      const theme = TOKENS.PTGC.theme;
      const [availablePLS, setAvailablePLS] = useState(null);
      const [pendingPLS, setPendingPLS] = useState(null);
      const [managementBalance, setManagementBalance] = useState(null);
      const [managementTokens, setManagementTokens] = useState([]); // Array of {symbol, balance, usdValue}
      const [managementTotalUSD, setManagementTotalUSD] = useState(0);
      const [showManagementTokens, setShowManagementTokens] = useState(false);
      const [proposals, setProposals] = useState([]);
      const [loading, setLoading] = useState(true);
      const [creating, setCreating] = useState(false);
      const [voting, setVoting] = useState({});
      const [error, setError] = useState(null);
      const [wallet, setWallet] = useState({ isConnected: false, address: null, signer: null });
      
      // Proposal form state
      const [selectedDescription, setSelectedDescription] = useState(1);
      const [customDescription, setCustomDescription] = useState('');
      const [proposalAmount, setProposalAmount] = useState(PTGC_DAO_CONFIG.defaultProposalAmount);
      const [showDropdown, setShowDropdown] = useState(false);
      
      // Multi-proposal creation state
      const [proposalRows, setProposalRows] = useState([]);
      const [publishingRow, setPublishingRow] = useState(null); // Index of row being published
      const [publishingAll, setPublishingAll] = useState(false);
      
      // Generate proposal rows based on available PLS (100M increments)
      const generateProposalRows = () => {
        if (!availablePLS) return [];
        const available = Number(ethers.formatEther(availablePLS));
        const increment = 100000000; // 100M PLS
        const rows = [];
        let remaining = available;
        let index = 0;
        
        while (remaining >= increment) {
          rows.push({
            id: index++,
            amount: increment.toString(),
            description: selectedDescription,
            customDesc: '',
            published: false
          });
          remaining -= increment;
        }
        
        // Add remaining if > 1M PLS
        if (remaining >= 1000000) {
          rows.push({
            id: index,
            amount: Math.floor(remaining).toString(),
            description: selectedDescription,
            customDesc: '',
            published: false
          });
        }
        
        return rows;
      };
      
      // Update proposal rows when available PLS changes
      useEffect(() => {
        if (availablePLS && !loading) {
          setProposalRows(generateProposalRows());
        }
      }, [availablePLS, loading, selectedDescription]);
      
      // Update a specific row
      const updateProposalRow = (index, field, value) => {
        setProposalRows(prev => prev.map((row, i) => 
          i === index ? { ...row, [field]: value } : row
        ));
      };
      
      // Check if wallet has an active proposal already
      const checkWalletCanPropose = async () => {
        if (!wallet.isConnected || !wallet.signer) return { canPropose: false, reason: 'Wallet not connected' };
        
        try {
          const provider = wallet.signer.provider || new ethers.JsonRpcProvider('https://rpc.pulsechain.com');
          const daoContract = new ethers.Contract(
            PTGC_DAO_CONFIG.contractAddress,
            PTGC_DAO_ABI,
            provider
          );
          
          const latestProposalId = await daoContract.latestProposalIds(wallet.address);
          
          if (latestProposalId && Number(latestProposalId) > 0) {
            const proposalState = await daoContract.state(latestProposalId);
            const stateNum = Number(proposalState);
            
            // States 0 (Pending) and 1 (Active) block new proposals
            if (stateNum === 0 || stateNum === 1) {
              return { 
                canPropose: false, 
                reason: `You already have an active proposal (#${latestProposalId}). Wait for it to complete before creating another.`,
                activeProposalId: Number(latestProposalId)
              };
            }
          }
          
          return { canPropose: true };
        } catch (e) {
          console.error('Error checking proposal eligibility:', e);
          return { canPropose: true }; // Allow attempt if check fails
        }
      };
      
      // Publish a single proposal row
      const publishSingleProposal = async (rowIndex) => {
        const row = proposalRows[rowIndex];
        if (!row || row.published) return;
        
        if (!wallet.isConnected) {
          setError('Please connect your wallet first');
          return;
        }
        
        // Check if wallet can propose (doesn't already have active proposal)
        const eligibility = await checkWalletCanPropose();
        if (!eligibility.canPropose) {
          setError(eligibility.reason);
          return;
        }
        
        setPublishingRow(rowIndex);
        setError(null);
        
        try {
          const fundRequestWei = ethers.parseEther(row.amount);
          
          let description;
          if (row.description === 4) {
            description = row.customDesc || 'Custom Proposal';
          } else {
            const descObj = PTGC_DAO_CONFIG.proposalDescriptions.find(d => d.id === row.description);
            description = descObj ? descObj.text : 'DAO Proposal';
          }
          
          const daoContract = new ethers.Contract(
            PTGC_DAO_CONFIG.contractAddress,
            PTGC_DAO_ABI,
            wallet.signer
          );
          
          console.log(`Publishing proposal ${rowIndex + 1}: ${row.amount} PLS`);
          const tx = await daoContract.propose(fundRequestWei, description);
          const receipt = await tx.wait();
          
          // Extract proposal ID from event
          let newProposalId = null;
          for (const log of receipt.logs) {
            try {
              const parsed = daoContract.interface.parseLog(log);
              if (parsed && parsed.name === 'ProposalCreated') {
                newProposalId = Number(parsed.args.proposalId || parsed.args[0]);
                break;
              }
            } catch (e) {}
          }
          
          // Auto-vote on the new proposal
          if (newProposalId) {
            console.log(`Auto-voting on proposal #${newProposalId}`);
            const voteTx = await daoContract.castVote(newProposalId, 1);
            await voteTx.wait();
          }
          
          // Mark row as published
          updateProposalRow(rowIndex, 'published', true);
          console.log(`✓ Proposal ${rowIndex + 1} published successfully`);
          
        } catch (e) {
          console.error('Publish failed:', e);
          setError('Failed to publish proposal: ' + (e.reason || e.message));
        }
        
        setPublishingRow(null);
      };
      
      // Publish all unpublished proposals
      const publishAllProposals = async () => {
        if (!wallet.isConnected) {
          setError('Please connect your wallet first');
          return;
        }
        
        setPublishingAll(true);
        setError(null);
        
        for (let i = 0; i < proposalRows.length; i++) {
          if (!proposalRows[i].published) {
            await publishSingleProposal(i);
            // Small delay between proposals
            await new Promise(r => setTimeout(r, 2000));
          }
        }
        
        setPublishingAll(false);
        
        // Refresh DAO data
        await fetchDAOData();
      };
      
      // Multi-proposal selection for batch voting
      const [selectedProposals, setSelectedProposals] = useState(new Set());
      
      // Toggle proposal selection
      const toggleProposalSelection = (proposalId) => {
        setSelectedProposals(prev => {
          const newSet = new Set(prev);
          if (newSet.has(proposalId)) {
            newSet.delete(proposalId);
          } else {
            newSet.add(proposalId);
          }
          return newSet;
        });
      };
      
      // ============================================
      // VOTING WALLET MANAGEMENT (Encrypted Vault)
      // ============================================
      const [votingWallets, setVotingWallets] = useState([]);
      const [vaultUnlocked, setVaultUnlocked] = useState(false);
      const [vaultPassword, setVaultPassword] = useState('');
      const [decryptedKeys, setDecryptedKeys] = useState({}); // address -> privateKey (only in memory)
      const [walletBalances, setWalletBalances] = useState({}); // address -> PLS balance
      const [vaultSha, setVaultSha] = useState(null);
      const [vaultLoading, setVaultLoading] = useState(true);
      const [newWalletAddress, setNewWalletAddress] = useState('');
      const [newWalletLabel, setNewWalletLabel] = useState('');
      const [newWalletKey, setNewWalletKey] = useState('');
      const [showWalletManager, setShowWalletManager] = useState(false);
      const [showBatchVoting, setShowBatchVoting] = useState(false);
      const [batchVotingProposal, setBatchVotingProposal] = useState(null);
      const [batchVotingInProgress, setBatchVotingInProgress] = useState(false);
      const [batchVotingStatus, setBatchVotingStatus] = useState({}); // address -> 'pending' | 'voting' | 'done' | 'error'
      const [showUnlockModal, setShowUnlockModal] = useState(false);
      const [unlockPassword, setUnlockPassword] = useState('');
      const [unlockError, setUnlockError] = useState('');
      const [pendingVoteAfterUnlock, setPendingVoteAfterUnlock] = useState(null); // { ids: [...], support: true }
      const [setupPassword, setSetupPassword] = useState('');
      const [setupPasswordConfirm, setSetupPasswordConfirm] = useState('');
      const [isSettingUp, setIsSettingUp] = useState(false);
      const [walletVoteStatus, setWalletVoteStatus] = useState(() => {
        try {
          const saved = localStorage.getItem('ptgc_dao_vote_status');
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });
      
      // Load voting vault from GitHub on mount
      useEffect(() => {
        const loadVault = async () => {
          setVaultLoading(true);
          try {
            const { data, sha } = await VotingVaultStorage.read();
            if (data && data.wallets) {
              // Load wallet addresses (but not decrypted keys yet)
              setVotingWallets(data.wallets.map(w => ({
                address: w.address,
                label: w.label,
                hasKey: true
              })));
              setVaultSha(sha);
              console.log('Loaded', data.wallets.length, 'voting wallets from vault');
              
              // Fetch PLS balances for all wallets
              fetchWalletBalances(data.wallets.map(w => w.address));
            }
          } catch (e) {
            console.error('Failed to load voting vault:', e);
          }
          setVaultLoading(false);
        };
        loadVault();
      }, []);
      
      // Fetch PLS balances for vault wallets
      const fetchWalletBalances = async (addresses) => {
        try {
          const provider = new ethers.JsonRpcProvider('https://rpc.pulsechain.com');
          const balances = {};
          for (const addr of addresses) {
            try {
              const balance = await provider.getBalance(addr);
              balances[addr.toLowerCase()] = balance;
            } catch (e) {
              console.warn('Failed to fetch balance for', addr);
              balances[addr.toLowerCase()] = 0n;
            }
          }
          setWalletBalances(balances);
        } catch (e) {
          console.error('Failed to fetch wallet balances:', e);
        }
      };
      
      // Refresh balances when wallet manager opens
      useEffect(() => {
        if (showWalletManager && votingWallets.length > 0) {
          fetchWalletBalances(votingWallets.map(w => w.address));
        }
      }, [showWalletManager]);
      
      // Save vote status to localStorage
      useEffect(() => {
        localStorage.setItem('ptgc_dao_vote_status', JSON.stringify(walletVoteStatus));
      }, [walletVoteStatus]);
      
      // Unlock vault with password
      const unlockVault = async (password) => {
        setUnlockError('');
        try {
          const { data } = await VotingVaultStorage.read();
          if (!data || !data.encryptedKeys) {
            setUnlockError('No vault found. Please add wallets first.');
            return false;
          }
          
          const decrypted = await VotingVaultCrypto.decrypt(data.encryptedKeys, password);
          if (!decrypted) {
            setUnlockError('Incorrect password');
            return false;
          }
          
          setDecryptedKeys(decrypted);
          setVaultUnlocked(true);
          setVaultPassword(password); // Keep in memory for saving
          setShowUnlockModal(false);
          setUnlockPassword('');
          console.log('Vault unlocked successfully');
          
          // If there was a pending vote action, execute it now
          if (pendingVoteAfterUnlock) {
            const { ids, support } = pendingVoteAfterUnlock;
            setPendingVoteAfterUnlock(null);
            // Open status modal and start voting
            setBatchVotingProposal({ ids, fundRequest: 0n });
            setShowBatchVoting(true);
            // Small delay to let state update
            setTimeout(() => voteAllWallets(ids, support), 100);
          }
          
          return true;
        } catch (e) {
          console.error('Unlock failed:', e);
          setUnlockError('Failed to unlock vault');
          return false;
        }
      };
      
      // Lock vault (clear decrypted keys from memory)
      const lockVault = () => {
        setDecryptedKeys({});
        setVaultUnlocked(false);
        setVaultPassword('');
        setPendingVoteAfterUnlock(null);
      };
      
      // Save vault to GitHub (encrypted)
      const saveVault = async (wallets, keys, password) => {
        try {
          const encryptedKeys = await VotingVaultCrypto.encrypt(keys, password);
          const vaultData = {
            wallets: wallets.map(w => ({ address: w.address, label: w.label })),
            encryptedKeys,
            updatedAt: new Date().toISOString()
          };
          
          const result = await VotingVaultStorage.write(vaultData, vaultSha);
          if (result.success) {
            setVaultSha(result.sha);
            console.log('Vault saved to GitHub');
            return true;
          }
          return false;
        } catch (e) {
          console.error('Failed to save vault:', e);
          return false;
        }
      };
      
      // Add a voting wallet with private key
      const addVotingWallet = async () => {
        if (!newWalletAddress || !ethers.isAddress(newWalletAddress)) {
          setError('Please enter a valid wallet address');
          return;
        }
        if (!newWalletKey || newWalletKey.length < 64) {
          setError('Please enter a valid private key (64 hex characters)');
          return;
        }
        
        // Validate that private key matches the address
        try {
          const keyToUse = newWalletKey.startsWith('0x') ? newWalletKey : '0x' + newWalletKey;
          const wallet = new ethers.Wallet(keyToUse);
          if (wallet.address.toLowerCase() !== newWalletAddress.toLowerCase()) {
            setError(`Private key does not match address. Key is for ${wallet.address.slice(0,10)}...`);
            return;
          }
        } catch (e) {
          setError('Invalid private key format');
          return;
        }
        
        // Verify the private key matches the address
        try {
          const wallet = new ethers.Wallet(newWalletKey);
          if (wallet.address.toLowerCase() !== newWalletAddress.toLowerCase()) {
            setError('Private key does not match the wallet address');
            return;
          }
        } catch (e) {
          setError('Invalid private key format');
          return;
        }
        
        const normalizedAddress = ethers.getAddress(newWalletAddress);
        if (votingWallets.some(w => w.address.toLowerCase() === normalizedAddress.toLowerCase())) {
          setError('This wallet is already added');
          return;
        }
        
        // For first wallet or if vault not set up, need to create password
        if (votingWallets.length === 0 && !vaultPassword) {
          setIsSettingUp(true);
          return;
        }
        
        // Add to wallets and keys
        const newWallets = [...votingWallets, {
          address: normalizedAddress,
          label: newWalletLabel || `Wallet ${votingWallets.length + 1}`,
          hasKey: true
        }];
        const newKeys = { ...decryptedKeys, [normalizedAddress.toLowerCase()]: newWalletKey };
        
        // Save to GitHub
        const saved = await saveVault(newWallets, newKeys, vaultPassword);
        if (saved) {
          setVotingWallets(newWallets);
          setDecryptedKeys(newKeys);
          setNewWalletAddress('');
          setNewWalletLabel('');
          setNewWalletKey('');
          setError(null);
        } else {
          setError('Failed to save wallet to vault');
        }
      };
      
      // Complete first-time setup with password
      const completeSetup = async () => {
        if (setupPassword.length < 8) {
          setError('Password must be at least 8 characters');
          return;
        }
        if (setupPassword !== setupPasswordConfirm) {
          setError('Passwords do not match');
          return;
        }
        
        const normalizedAddress = ethers.getAddress(newWalletAddress);
        const newWallets = [{
          address: normalizedAddress,
          label: newWalletLabel || 'Wallet 1',
          hasKey: true
        }];
        const newKeys = { [normalizedAddress.toLowerCase()]: newWalletKey };
        
        // Save to GitHub with new password
        const saved = await saveVault(newWallets, newKeys, setupPassword);
        if (saved) {
          setVotingWallets(newWallets);
          setDecryptedKeys(newKeys);
          setVaultPassword(setupPassword);
          setVaultUnlocked(true);
          setNewWalletAddress('');
          setNewWalletLabel('');
          setNewWalletKey('');
          setSetupPassword('');
          setSetupPasswordConfirm('');
          setIsSettingUp(false);
          setError(null);
        } else {
          setError('Failed to create vault');
        }
      };
      
      // Remove a voting wallet
      const removeVotingWallet = async (address) => {
        if (!vaultUnlocked) {
          setError('Please unlock vault first');
          return;
        }
        
        const newWallets = votingWallets.filter(w => w.address.toLowerCase() !== address.toLowerCase());
        const newKeys = { ...decryptedKeys };
        delete newKeys[address.toLowerCase()];
        
        const saved = await saveVault(newWallets, newKeys, vaultPassword);
        if (saved) {
          setVotingWallets(newWallets);
          setDecryptedKeys(newKeys);
        }
      };
      
      // Vote with all wallets at once (supports single or multiple proposals)
      const voteAllWallets = async (proposalIds, support = true) => {
        // Guard against double-execution
        if (batchVotingInProgress) {
          console.warn('Voting already in progress, ignoring duplicate call');
          return;
        }
        
        if (!vaultUnlocked) {
          setShowUnlockModal(true);
          return;
        }
        
        if (votingWallets.length === 0) {
          console.warn('No wallets in vault');
          setShowWalletManager(true);
          return;
        }
        
        // Handle both single proposal ID and array of IDs
        const ids = Array.isArray(proposalIds) ? proposalIds : [proposalIds];
        
        setBatchVotingInProgress(true);
        const provider = new ethers.JsonRpcProvider('https://rpc.pulsechain.com');
        
        const daoContractRead = new ethers.Contract(
          PTGC_DAO_CONFIG.contractAddress,
          PTGC_DAO_ABI,
          provider
        );
        
        // Initialize status - check on-chain first
        const initialStatus = {};
        for (const w of votingWallets) {
          const addrLower = w.address.toLowerCase();
          let allVoted = true;
          for (const proposalId of ids) {
            try {
              const receipt = await daoContractRead.getReceipt(proposalId, w.address);
              if (receipt.hasVoted) {
                markWalletVoted(proposalId, w.address);
              } else {
                allVoted = false;
              }
            } catch (e) {
              if (!hasWalletVoted(proposalId, w.address)) {
                allVoted = false;
              }
            }
          }
          initialStatus[addrLower] = allVoted ? 'done' : 'pending';
        }
        setBatchVotingStatus(initialStatus);
        
        // Vote with each wallet on each proposal
        for (const w of votingWallets) {
          const addrLower = w.address.toLowerCase();
          
          const privateKey = decryptedKeys[addrLower];
          if (!privateKey) {
            console.error(`No private key found for ${w.label}`);
            setBatchVotingStatus(prev => ({ ...prev, [addrLower]: 'error' }));
            continue;
          }
          
          // Check if wallet has enough PLS for gas
          try {
            const balance = await provider.getBalance(w.address);
            const minRequired = ethers.parseEther('1'); // Need at least 1 PLS for gas
            if (balance < minRequired) {
              console.error(`${w.label} has insufficient PLS for gas (${ethers.formatEther(balance)} PLS)`);
              setBatchVotingStatus(prev => ({ ...prev, [addrLower]: 'error' }));
              continue;
            }
          } catch (e) {
            console.warn(`Could not check balance for ${w.label}, proceeding anyway`);
          }
          
          let walletVotedAny = false;
          let walletHadError = false;
          
          for (const proposalId of ids) {
            // Skip if already voted on this proposal
            if (hasWalletVoted(proposalId, w.address)) {
              continue;
            }
            
            setBatchVotingStatus(prev => ({ ...prev, [addrLower]: 'voting' }));
            
            try {
              const signer = new ethers.Wallet(privateKey, provider);
              const daoContract = new ethers.Contract(
                PTGC_DAO_CONFIG.contractAddress,
                PTGC_DAO_ABI,
                signer
              );
              
              // Get aggressive gas price (2x current for fast confirmation)
              const feeData = await provider.getFeeData();
              const aggressiveGasPrice = (feeData.gasPrice || 0n) * 2n;
              
              const supportValue = support ? 1 : 0;
              console.log(`Voting with ${w.label} (${w.address.slice(0,8)}...) on proposal ${proposalId} [gas: ${ethers.formatUnits(aggressiveGasPrice, 'gwei')} gwei]`);
              
              const tx = await daoContract.castVote(proposalId, supportValue, {
                gasLimit: 200000,
                gasPrice: aggressiveGasPrice
              });
              
              // Wait for confirmation with 60 second timeout
              const receipt = await Promise.race([
                tx.wait(),
                new Promise((_, reject) => setTimeout(() => reject(new Error('Transaction timeout after 60s')), 60000))
              ]);
              
              markWalletVoted(proposalId, w.address);
              walletVotedAny = true;
              console.log(`✓ ${w.label} voted on proposal #${proposalId} (block ${receipt.blockNumber})`);
              
              // Small delay between votes
              await new Promise(r => setTimeout(r, 300));
              
            } catch (e) {
              const errMsg = e.message?.toLowerCase() || '';
              
              // Check for various "already voted" error patterns
              if (errMsg.includes('already voted') || errMsg.includes('has already voted') || errMsg.includes('voter has already voted') || errMsg.includes('already cast')) {
                console.log(`${w.label} already voted on proposal #${proposalId} - marking as done`);
                markWalletVoted(proposalId, w.address);
              } 
              // Proposal not active anymore
              else if (errMsg.includes('voting is closed') || errMsg.includes('proposal not active') || errMsg.includes('voting ended') || errMsg.includes('invalid proposal state') || errMsg.includes('proposal state')) {
                console.warn(`Proposal #${proposalId} is no longer active - skipping`);
                // Don't mark as error, just skip this proposal
              }
              // Insufficient funds for gas
              else if (errMsg.includes('insufficient funds') || errMsg.includes('insufficient balance') || errMsg.includes('gas required exceeds')) {
                console.error(`${w.label} has insufficient PLS for gas`);
                walletHadError = true;
              }
              // Transaction timeout
              else if (errMsg.includes('timeout')) {
                console.error(`Transaction timeout for ${w.label} on proposal ${proposalId} - tx may still confirm`);
                walletHadError = true;
              }
              // Unknown error
              else {
                console.error(`Vote failed for ${w.label} on proposal ${proposalId}:`, e.message);
                walletHadError = true;
              }
            }
          }
          
          setBatchVotingStatus(prev => ({ 
            ...prev, 
            [addrLower]: walletHadError ? 'error' : 'done' 
          }));
          
          // Delay between wallets
          await new Promise(r => setTimeout(r, 500));
        }
        
        setBatchVotingInProgress(false);
        setSelectedProposals(new Set()); // Clear selection
        
        // Refresh wallet balances (gas was spent)
        fetchWalletBalances(votingWallets.map(w => w.address));
        
        // Refresh proposal data
        await fetchDAOData();
      };
      
      // Check if a wallet has voted on a proposal
      const hasWalletVoted = (proposalId, walletAddress) => {
        const key = `${proposalId}_${walletAddress.toLowerCase()}`;
        return walletVoteStatus[key] === true;
      };
      
      // Mark a wallet as having voted
      const markWalletVoted = (proposalId, walletAddress) => {
        const key = `${proposalId}_${walletAddress.toLowerCase()}`;
        setWalletVoteStatus(prev => ({ ...prev, [key]: true }));
      };
      
      // Get voting progress for a proposal
      const getVotingProgress = (proposalId) => {
        if (votingWallets.length === 0) return { voted: 0, total: 0 };
        const voted = votingWallets.filter(w => hasWalletVoted(proposalId, w.address)).length;
        return { voted, total: votingWallets.length };
      };
      
      // Start batch voting for a proposal
      const startBatchVoting = (proposal) => {
        setBatchVotingProposal(proposal);
        setShowBatchVoting(true);
      };
      
      // Check on-chain if wallet has voted (and update local status)
      const checkOnChainVoteStatus = async (proposalId, walletAddress) => {
        try {
          const provider = new ethers.JsonRpcProvider(PULSECHAIN_RPC);
          const daoContract = new ethers.Contract(
            PTGC_DAO_CONFIG.contractAddress,
            PTGC_DAO_ABI,
            provider
          );
          const receipt = await daoContract.getReceipt(proposalId, walletAddress);
          if (receipt.hasVoted) {
            markWalletVoted(proposalId, walletAddress);
            return true;
          }
          return false;
        } catch (e) {
          console.error('Error checking vote status:', e);
          return false;
        }
      };
      
      // Check all wallets' vote status for a proposal
      const refreshVoteStatus = async (proposalId) => {
        for (const wallet of votingWallets) {
          await checkOnChainVoteStatus(proposalId, wallet.address);
        }
      };
      
      // Format large PLS numbers - full numbers with commas, no decimals
      const formatPLS = (wei) => {
        if (!wei) return '0';
        const pls = Number(wei) / 1e18;
        return Math.floor(pls).toLocaleString('en-US');
      };
      
      const formatPLSFull = (wei) => {
        if (!wei) return '0';
        const pls = Number(wei) / 1e18;
        return Math.floor(pls).toLocaleString('en-US');
      };
      
      // Calculate USD value - full numbers with commas, no decimals
      const toUSD = (wei) => {
        if (!wei || !plsPrice) return '$0';
        const pls = Number(wei) / 1e18;
        const usd = pls * plsPrice;
        return '$' + Math.floor(usd).toLocaleString('en-US');
      };
      
      // Connect wallet
      const connectWallet = async () => {
        try {
          if (typeof window.ethereum === 'undefined') {
            setError('Please install MetaMask or another Web3 wallet');
            return;
          }
          const provider = new ethers.BrowserProvider(window.ethereum);
          await provider.send('eth_requestAccounts', []);
          const signer = await provider.getSigner();
          const address = await signer.getAddress();
          setWallet({ isConnected: true, address, signer, provider });
          setError(null);
        } catch (e) {
          console.error('Wallet connection failed:', e);
          setError('Failed to connect wallet: ' + e.message);
        }
      };
      
      // Listen for account changes in MetaMask
      useEffect(() => {
        if (typeof window.ethereum === 'undefined') return;
        
        const handleAccountsChanged = async (accounts) => {
          if (accounts.length === 0) {
            setWallet({ isConnected: false, address: null, signer: null });
          } else {
            try {
              const provider = new ethers.BrowserProvider(window.ethereum);
              const signer = await provider.getSigner();
              const address = await signer.getAddress();
              setWallet({ isConnected: true, address, signer, provider });
              console.log('Account changed to:', address);
            } catch (e) {
              console.error('Error handling account change:', e);
            }
          }
        };
        
        window.ethereum.on('accountsChanged', handleAccountsChanged);
        
        // Check if already connected
        window.ethereum.request({ method: 'eth_accounts' }).then(accounts => {
          if (accounts.length > 0) {
            handleAccountsChanged(accounts);
          }
        });
        
        return () => {
          window.ethereum.removeListener('accountsChanged', handleAccountsChanged);
        };
      }, []);
      
      // Fetch DAO data
      const fetchDAOData = async () => {
        setLoading(true);
        setError(null);
        
        // Multiple RPC endpoints for fallback
        const RPC_ENDPOINTS = [
          'https://rpc.pulsechain.com',
          'https://pulsechain.publicnode.com',
          'https://rpc-pulsechain.g4mm4.io'
        ];
        
        // Try to get a working provider
        let provider = null;
        for (const rpc of RPC_ENDPOINTS) {
          try {
            const testProvider = new ethers.JsonRpcProvider(rpc);
            // Quick test - get block number
            await Promise.race([
              testProvider.getBlockNumber(),
              new Promise((_, reject) => setTimeout(() => reject(new Error('RPC timeout')), 5000))
            ]);
            provider = testProvider;
            console.log('Using RPC:', rpc);
            break;
          } catch (e) {
            console.warn('RPC failed:', rpc, e.message);
          }
        }
        
        if (!provider) {
          setError('All RPC endpoints failed. Please try again later.');
          setLoading(false);
          return;
        }
        
        try {
          // Fetch balances
          console.log('Fetching management wallet:', PTGC_DAO_CONFIG.managementWallet);
          console.log('Fetching DAO contract:', PTGC_DAO_CONFIG.contractAddress);
          
          const [mgmtBalance, daoBalance] = await Promise.all([
            provider.getBalance(PTGC_DAO_CONFIG.managementWallet).catch(e => {
              console.error('Management balance error:', e);
              return 0n;
            }),
            provider.getBalance(PTGC_DAO_CONFIG.contractAddress).catch(e => {
              console.error('DAO balance error:', e);
              return 0n;
            })
          ]);
          
          setManagementBalance(mgmtBalance);
          console.log('Management wallet:', ethers.formatEther(mgmtBalance), 'PLS');
          console.log('DAO contract total:', ethers.formatEther(daoBalance), 'PLS');
          
          // Store total DAO balance temporarily - we'll calculate available after getting locked amount
          const totalDaoBalance = daoBalance;
          
          // Fetch management wallet tokens (PLS + common tokens)
          const MANAGEMENT_TOKENS = [
            { symbol: 'USDC', address: '0x15D38573d2feeb82e7ad5187aB8c1D52810B1f07', decimals: 6 },
            { symbol: 'USDT', address: '0x0Cb6F5a34ad42ec934882A05265A7d5F59b51A2f', decimals: 6 },
            { symbol: 'DAI', address: '0xefD766cCb38EaF1dfd701853BFCe31359239F305', decimals: 18 },
            { symbol: 'pDAI', address: '0x6B175474E89094C44Da98b954EesEdeAC495271d0F', decimals: 18 },
            { symbol: 'PLSX', address: '0x95B303987A60C71504D99Aa1b13B4DA07b0790ab', decimals: 18 },
            { symbol: 'HEX', address: '0x2b591e99afE9f32eAA6214f7B7629768c40Eeb39', decimals: 8 },
            { symbol: 'INC', address: '0x2fa878Ab3F87CC1C9737Fc071108F904c0B0C95d', decimals: 18 },
            { symbol: 'WBTC', address: '0xb17D901469B9208B17d916112988A3FeD19b5cA1', decimals: 8 },
          ];
          
          // Simple ERC20 ABI for balanceOf
          const ERC20_ABI = ['function balanceOf(address) view returns (uint256)'];
          
          const tokenBalances = [];
          let totalUSD = 0;
          
          // Add PLS first
          const plsAmount = Number(ethers.formatEther(mgmtBalance));
          const plsUSD = plsAmount * (plsPrice || 0);
          tokenBalances.push({
            symbol: 'PLS',
            balance: plsAmount,
            usdValue: plsUSD,
            address: null
          });
          totalUSD += plsUSD;
          
          // Fetch each token balance
          for (const token of MANAGEMENT_TOKENS) {
            try {
              const contract = new ethers.Contract(token.address, ERC20_ABI, provider);
              const balance = await contract.balanceOf(PTGC_DAO_CONFIG.managementWallet);
              const amount = Number(balance) / Math.pow(10, token.decimals);
              
              if (amount > 0.01) { // Only show if meaningful balance
                // Get price - for stablecoins assume $1, otherwise estimate
                let price = 0;
                if (['USDC', 'USDT', 'DAI', 'pDAI'].includes(token.symbol)) {
                  price = 1;
                } else if (token.symbol === 'PLSX' && plsPrice) {
                  price = plsPrice * 0.00008; // Rough estimate PLSX/PLS ratio
                } else if (token.symbol === 'HEX') {
                  price = 0.001; // Rough HEX price
                } else if (token.symbol === 'INC') {
                  price = 0.20; // Rough INC price
                } else if (token.symbol === 'WBTC') {
                  price = 97000; // Rough BTC price
                }
                
                const usdValue = amount * price;
                tokenBalances.push({
                  symbol: token.symbol,
                  balance: amount,
                  usdValue: usdValue,
                  address: token.address
                });
                totalUSD += usdValue;
                console.log(`Management ${token.symbol}: ${amount.toLocaleString()} ($${usdValue.toLocaleString()})`);
              }
            } catch (e) {
              // Token might not exist or wallet has 0 balance - skip silently
            }
          }
          
          setManagementTokens(tokenBalances);
          setManagementTotalUSD(totalUSD);
          console.log('Management wallet total USD:', totalUSD);
          
          // Create contract instance
          const daoContract = new ethers.Contract(
            PTGC_DAO_CONFIG.contractAddress,
            PTGC_DAO_ABI,
            provider
          );
          
          // Fetch locked amount (PLS in active proposals)
          let lockedAmount = 0n;
          try {
            lockedAmount = await daoContract.lockedAmount();
            setPendingPLS(lockedAmount);
            console.log('Locked/pending amount:', ethers.formatEther(lockedAmount), 'PLS');
          } catch (e) {
            console.error('Locked amount error:', e);
            setPendingPLS(0n);
          }
          
          // Calculate available PLS = total DAO balance - locked amount
          const available = totalDaoBalance > lockedAmount ? totalDaoBalance - lockedAmount : 0n;
          setAvailablePLS(available);
          console.log('Available for new proposals:', ethers.formatEther(available), 'PLS');
          
          // Fetch proposal count
          let count = 0n;
          try {
            count = await daoContract.proposalCount();
            console.log('Proposal count:', count.toString());
          } catch (e) {
            console.error('Proposal count error:', e);
          }
          
          if (Number(count) === 0) {
            setProposals([]);
            setLoading(false);
            return;
          }
          
          // Fetch proposals (limit to last 10 to avoid timeout)
          const proposalList = [];
          const startId = Math.max(1, Number(count) - 9);
          
          // Fetch ProposalCreated events to get descriptions
          let proposalDescriptions = {};
          try {
            const filter = daoContract.filters.ProposalCreated();
            const events = await daoContract.queryFilter(filter, -100000); // Last ~100k blocks
            for (const event of events) {
              const id = Number(event.args[0] || event.args.id);
              const desc = event.args[4] || event.args.description || '';
              proposalDescriptions[id] = desc;
            }
            console.log('Fetched descriptions for', Object.keys(proposalDescriptions).length, 'proposals');
          } catch (e) {
            console.warn('Could not fetch proposal events:', e.message);
          }
          
          for (let i = Number(count); i >= startId; i--) {
            try {
              const p = await daoContract.proposals(i);
              let proposalState = 0;
              try {
                proposalState = await daoContract.state(i);
              } catch (e) {
                console.warn('Could not get state for proposal', i);
              }
              
              const stateNum = Number(proposalState);
              const isActive = stateNum === 0 || stateNum === 1;
              
              proposalList.push({
                id: Number(p.id),
                fundRequest: p.fundRequest,
                startTime: Number(p.startTime),
                endTime: Number(p.endTime),
                forVotes: p.forVotes,
                againstVotes: p.againstVotes,
                voters: Number(p.voters),
                claimed: p.claimed,
                proposer: p.proposer,
                state: stateNum,
                stateName: PROPOSAL_STATES[stateNum] || 'Unknown',
                isActive,
                description: proposalDescriptions[Number(p.id)] || ''
              });
              
              console.log(`Proposal ${i}: ${PROPOSAL_STATES[stateNum]}, forVotes=${ethers.formatEther(p.forVotes)}`);
            } catch (e) {
              console.error('Error fetching proposal', i, e.message);
            }
          }
          
          setProposals(proposalList);
          setLoading(false);
          
        } catch (e) {
          console.error('Error fetching DAO data:', e);
          setError('Failed to fetch DAO data: ' + e.message);
          setLoading(false);
        }
      };
      
      // Create proposal
      const createProposal = async () => {
        if (!wallet.isConnected) {
          await connectWallet();
          return;
        }
        
        setCreating(true);
        setError(null);
        
        // Check if wallet can propose (doesn't already have active proposal)
        const eligibility = await checkWalletCanPropose();
        if (!eligibility.canPropose) {
          setError(eligibility.reason);
          setCreating(false);
          return;
        }
        
        try {
          const description = selectedDescription === 4 
            ? customDescription 
            : PTGC_DAO_CONFIG.proposalDescriptions.find(d => d.id === selectedDescription)?.description;
          
          if (!description) {
            setError('Please enter a description');
            setCreating(false);
            return;
          }
          
          // fundRequest is in wei
          const fundRequestWei = ethers.parseEther(proposalAmount);
          
          const daoContract = new ethers.Contract(
            PTGC_DAO_CONFIG.contractAddress,
            PTGC_DAO_ABI,
            wallet.signer
          );
          
          // Create the proposal using propose(fundRequest, description)
          console.log('Creating proposal:', { fundRequest: proposalAmount, description });
          const tx = await daoContract.propose(fundRequestWei, description);
          console.log('Create proposal tx:', tx.hash);
          
          const receipt = await tx.wait();
          console.log('Proposal created:', receipt);
          
          // Try to get the proposal ID from the event and auto-vote
          let newProposalId = null;
          try {
            // Find ProposalCreated event
            const iface = new ethers.Interface(PTGC_DAO_ABI);
            for (const log of receipt.logs) {
              try {
                const parsed = iface.parseLog(log);
                if (parsed && parsed.name === 'ProposalCreated') {
                  newProposalId = parsed.args.id;
                  console.log('New proposal ID:', newProposalId.toString());
                  break;
                }
              } catch (e) {}
            }
          } catch (e) {
            console.log('Could not parse proposal ID from event:', e);
          }
          
          // Auto-vote in favor (support = 1 for "for", 0 for "against")
          if (newProposalId) {
            try {
              console.log('Auto-voting for proposal', newProposalId.toString());
              const voteTx = await daoContract.castVote(newProposalId, 1); // 1 = for
              await voteTx.wait();
              console.log('Auto-voted for proposal');
            } catch (e) {
              console.log('Auto-vote failed:', e);
              // Don't fail the whole operation if auto-vote fails
            }
          }
          
          // Refresh data
          await fetchDAOData();
          
          // Reset form
          setSelectedDescription(1);
          setCustomDescription('');
          setProposalAmount(PTGC_DAO_CONFIG.defaultProposalAmount);
          
        } catch (e) {
          console.error('Create proposal failed:', e);
          setError('Failed to create proposal: ' + (e.reason || e.message));
        }
        
        setCreating(false);
      };
      
      // Vote on proposal
      // support: true = vote FOR (1), false = vote AGAINST (0)
      const voteOnProposal = async (proposalId, support) => {
        if (!wallet.isConnected) {
          await connectWallet();
          return;
        }
        
        setVoting(prev => ({ ...prev, [proposalId]: true }));
        setError(null);
        
        try {
          const daoContract = new ethers.Contract(
            PTGC_DAO_CONFIG.contractAddress,
            PTGC_DAO_ABI,
            wallet.signer
          );
          
          // castVote(proposalId, support) where support is uint256: 1=for, 0=against
          const supportValue = support ? 1 : 0;
          console.log(`Voting on proposal ${proposalId} with support=${supportValue}`);
          
          const tx = await daoContract.castVote(proposalId, supportValue);
          await tx.wait();
          console.log('Vote cast successfully');
          
          // Refresh data
          await fetchDAOData();
          
        } catch (e) {
          console.error('Vote failed:', e);
          setError('Failed to vote: ' + (e.reason || e.message));
        }
        
        setVoting(prev => ({ ...prev, [proposalId]: false }));
      };
      
      // Load data on mount (no auto-refresh)
      useEffect(() => {
        fetchDAOData();
      }, []);
      
      // Get selected description label
      const getSelectedLabel = () => {
        const desc = PTGC_DAO_CONFIG.proposalDescriptions.find(d => d.id === selectedDescription);
        return desc?.label || 'Select...';
      };
      
      return (
        <div className="min-h-screen bg-gradient-to-br from-yellow-950/30 via-black to-black text-white">
          <div className="relative z-10">
            {/* Header */}
            <header className="border-b border-[#D9CA5D]/30 bg-black/50 backdrop-blur-sm sticky top-0 z-50">
              <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
                <div className="flex items-center gap-4">
                  <button onClick={onBack} className="p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors">
                    <Icon name="arrow-left" className="text-[#D9CA5D]" size={20}/>
                  </button>
                  <div className="flex items-center gap-4">
                    <img src={TOKENS.PTGC.logo} alt="PTGC" className="w-14 h-14 rounded-xl"/>
                    <div>
                      <h1 className="font-orbitron font-bold text-2xl text-[#D9CA5D]">PTGC DAO</h1>
                      <p className="text-gray-400 text-sm font-medium">Governance & Proposals</p>
                    </div>
                  </div>
                </div>
                
                {/* Wallet Connection */}
                <div className="flex items-center gap-3">
                  {/* Voting Vault Button */}
                  <button
                    onClick={() => setShowWalletManager(true)}
                    className={`flex items-center gap-2 px-3 py-2 rounded-lg border text-sm transition-all ${
                      vaultUnlocked 
                        ? 'bg-lime-500/10 border-lime-500/30 text-lime-400 hover:bg-lime-500/20' 
                        : 'bg-white/5 border-white/10 text-gray-300 hover:bg-white/10'
                    }`}
                  >
                    <span>💼</span>
                    <span className="hidden sm:inline">Vote Vault</span>
                    {votingWallets.length > 0 && (
                      <span className="bg-[#D9CA5D]/20 text-[#D9CA5D] px-1.5 py-0.5 rounded text-xs font-bold">{votingWallets.length}</span>
                    )}
                  </button>
                  
                  {wallet.isConnected ? (
                    <div className="flex items-center gap-2 px-4 py-2 rounded-lg bg-[#D9CA5D]/10 border border-[#D9CA5D]/30">
                      <div className="w-2 h-2 rounded-full bg-lime-500"></div>
                      <span className="text-[#D9CA5D] text-sm font-mono">
                        {wallet.address?.slice(0,6)}...{wallet.address?.slice(-4)}
                      </span>
                      {/* Show if current wallet is in voting wallets */}
                      {votingWallets.some(w => w.address.toLowerCase() === wallet.address?.toLowerCase()) && (
                        <span className="text-xs text-lime-400">✓</span>
                      )}
                    </div>
                  ) : (
                    <button
                      onClick={connectWallet}
                      className="px-4 py-2 rounded-lg bg-[#D9CA5D]/20 border border-[#D9CA5D]/40 text-[#D9CA5D] font-semibold hover:bg-[#D9CA5D]/30 transition-all"
                    >
                      Connect Wallet
                    </button>
                  )}
                </div>
              </div>
            </header>
            
            <main className="max-w-6xl mx-auto px-6 py-8">
              {/* Error Display */}
              {error && (
                <div className="mb-6 p-4 bg-red-500/20 border border-red-500/40 rounded-xl text-red-400">
                  {error}
                  <button onClick={() => setError(null)} className="ml-4 text-red-300 hover:text-red-200">✕</button>
                </div>
              )}
              
              {/* Stats Cards */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                {/* Available PLS for Proposals */}
                <div className="bg-black/40 border border-white/10 rounded-xl p-5 hover:border-white/20 transition-all">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-10 h-10 rounded-lg bg-white/5 flex items-center justify-center">
                      <span className="text-xl">💰</span>
                    </div>
                    <div className="text-gray-300 text-base font-semibold leading-tight">Available for NEW<br/>Proposals</div>
                  </div>
                  {loading ? (
                    <div className="text-gray-500">Loading...</div>
                  ) : (
                    <>
                      <div className="font-space font-bold text-2xl text-white mb-1">{formatPLS(availablePLS)} PLS</div>
                      <div className="text-lime-400 text-lg font-bold">{toUSD(availablePLS)}</div>
                    </>
                  )}
                </div>
                
                {/* PLS in Active Proposals */}
                <div className="bg-black/40 border border-white/10 rounded-xl p-5 hover:border-white/20 transition-all">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-10 h-10 rounded-lg bg-white/5 flex items-center justify-center">
                      <span className="text-xl">⏳</span>
                    </div>
                    <div className="text-gray-300 text-base font-semibold leading-tight">Pending in CURRENT<br/>Proposals</div>
                  </div>
                  {loading ? (
                    <div className="text-gray-500">Loading...</div>
                  ) : (
                    <>
                      <div className="font-space font-bold text-2xl text-white mb-1">{formatPLS(pendingPLS)} PLS</div>
                      <div className="text-lime-400 text-lg font-bold">{toUSD(pendingPLS)}</div>
                    </>
                  )}
                </div>
                
                {/* Management Wallet Balance - Collapsible */}
                <div className="bg-black/40 border border-white/10 rounded-xl p-5 hover:border-white/20 transition-all">
                  <button 
                    onClick={() => setShowManagementTokens(!showManagementTokens)}
                    className="w-full flex items-center gap-3 mb-4"
                  >
                    <div className="w-10 h-10 rounded-lg bg-white/5 flex items-center justify-center">
                      <span className="text-xl">🏦</span>
                    </div>
                    <div className="text-gray-300 text-base font-semibold text-left leading-tight">DAO Management<br/>Wallet</div>
                    <span className={`text-gray-500 ml-auto transition-transform ${showManagementTokens ? 'rotate-180' : ''}`}>▼</span>
                  </button>
                  {loading ? (
                    <div className="text-gray-500">Loading...</div>
                  ) : (
                    <>
                      <div className="font-space font-bold text-2xl text-lime-400 mb-1">
                        ${Math.floor(managementTotalUSD).toLocaleString()}
                      </div>
                      <div className="text-gray-500 text-sm">{managementTokens.length} tokens</div>
                      {showManagementTokens && (
                        <div className="mt-3 pt-3 border-t border-white/10 space-y-1.5 max-h-32 overflow-y-auto">

      // Vault wallet address - will be set when provided
      walletAddress: '', // TO BE PROVIDED
      // GitHub storage path for commission data
      storagePath: 'data/affiliate-commissions.json'
    };
    
    // Commission Storage - GitHub persistence
    const CommissionStorage = {
      sha: null,
      
      async read() {
        try {
          const response = await fetch(
            `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${COMMISSION_VAULT_CONFIG.storagePath}`,
            {
              headers: {
                'Authorization': `token ${GITHUB_CONFIG.token}`,
                'Accept': 'application/vnd.github.v3+json'
              }
            }
          );
          
          if (!response.ok) {
            console.log('Commission data not found, will create new');
            return { 
              data: { 
                referrers: {}, // referralName -> { wallet, addedDate }
                currentMonth: new Date().toISOString().slice(0, 7), // "2025-01" format
                transactions: [], // Current month's transactions
                archives: {}, // { "2025-01": [...transactions], "2024-12": [...transactions] }
                settings: { commissionRate: 3, autoPay: false, minThreshold: 250 },
                vaultWallet: ''
              }, 
              sha: null 
            };
          }
          
          const result = await response.json();
          const cleanContent = result.content.replace(/\s/g, '');
          const content = atob(cleanContent);
          const data = JSON.parse(content);
          this.sha = result.sha;
          return { data, sha: result.sha };
        } catch (e) {
          console.error('Commission data read error:', e);
          return { 
            data: { 
              referrers: {}, 
              currentMonth: new Date().toISOString().slice(0, 7),
              transactions: [], 
              archives: {},
              settings: { commissionRate: 3, autoPay: false, minThreshold: 250 },
              vaultWallet: ''
            }, 
            sha: null 
          };
        }
      },
      
      async write(data) {
        try {
          if (!this.sha) {
            try {
              const getRes = await fetch(
                `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${COMMISSION_VAULT_CONFIG.storagePath}`,
                {
                  headers: {
                    'Authorization': `token ${GITHUB_CONFIG.token}`,
                    'Accept': 'application/vnd.github.v3+json'
                  }
                }
              );
              if (getRes.ok) {
                const fileData = await getRes.json();
                this.sha = fileData.sha;
              }
            } catch (e) {
              console.log('No existing commission data file');
            }
          }
          
          const jsonStr = JSON.stringify(data, null, 2);
          const encoder = new TextEncoder();
          const bytes = encoder.encode(jsonStr);
          const content = btoa(String.fromCharCode(...bytes));
          
          const body = {
            message: 'Update affiliate commission data',
            content,
            branch: 'main'
          };
          
          if (this.sha) {
            body.sha = this.sha;
          }
          
          const response = await fetch(
            `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${COMMISSION_VAULT_CONFIG.storagePath}`,
            {
              method: 'PUT',
              headers: {
                'Authorization': `token ${GITHUB_CONFIG.token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(body)
            }
          );
          
          if (!response.ok) {
            console.error('Commission data write failed');
            return false;
          }
          
          const result = await response.json();
          this.sha = result.content.sha;
          console.log('Commission data saved');
          return true;
        } catch (e) {
          console.error('Commission data write error:', e);
          return false;
        }
      }
    };
