    // Hook to fetch price trends for pairs (extends historical data)
    const useOpportunityScores = (pairs, historicalData, tokenName) => {
      const [scores, setScores] = useState({});
      const [loading, setLoading] = useState(true);
      const [priceTrends, setPriceTrends] = useState({});
      const abortRef = React.useRef(false);
      
      useEffect(() => {
        if (!pairs || pairs.length === 0 || !historicalData) {
          setLoading(false);
          return;
        }
        
        abortRef.current = false;
        
        const fetchTrends = async () => {
          setLoading(true);
          const qualifyingPairs = pairs.filter(p => (p.liquidity || 0) >= MIN_LIQUIDITY);
          
          const newTrends = {...priceTrends};
          const newScores = {};
          
          // Fetch OHLCV for pairs we don't have trends for yet
          for (const pair of qualifyingPairs) {
            if (abortRef.current) return;
            
            if (!newTrends[pair.pairAddress]) {
              try {
                const ohlcv = await GeckoTerminalAPI.fetchPoolOHLCV(pair.pairAddress);
                if (ohlcv && ohlcv.length > 0) {
                  newTrends[pair.pairAddress] = GeckoTerminalAPI.calculatePriceTrends(ohlcv);
                }
              } catch(e) {}
              // Small delay
              await new Promise(r => setTimeout(r, 200));
            }
          }
          
          // Calculate all ratios and liquidities for percentile ranking
          const allRatios = qualifyingPairs.map(p => {
            const liq = p.liquidity || 1;
            const vol = p.volume24h || 0;
            return vol / liq;
          });
          const allLiqs = qualifyingPairs.map(p => p.liquidity || 0);
          
          // Calculate scores for all pairs with percentile-based ratio scoring
          for (const pair of qualifyingPairs) {
            const liq = pair.liquidity || 1;
            const vol = pair.volume24h || 0;
            const pairRatio = vol / liq;
            
            // Calculate percentile ranks
            const ratioPercentile = calculatePercentile(pairRatio, allRatios);
            const liqPercentile = calculatePercentile(pair.liquidity || 0, allLiqs);
            
            const extendedHistData = {
              ...historicalData[pair.pairAddress],
              priceTrends: newTrends[pair.pairAddress] || {}
            };
            
            newScores[pair.pairAddress] = calculateOpportunityScore(
              pair, 
              { [pair.pairAddress]: extendedHistData },
              ratioPercentile,
              liqPercentile,
              tokenName
            );
          }
          
          if (!abortRef.current) {
            setPriceTrends(newTrends);
            setScores(newScores);
            setLoading(false);
          }
        };
        
        fetchTrends();
        
        return () => { abortRef.current = true; };
      }, [pairs, historicalData, tokenName]);
      
      return { scores, loading };
    };

    // ============================================
    // ARB SCANNER - Detects arbitrage opportunities between pairs
    // ============================================
    
    // Hook to scan for arbitrage opportunities
    const useArbScanner = (pairs, tokenConfig, plsPrice) => {
      const [opportunities, setOpportunities] = useState([]);
      const [pairDistances, setPairDistances] = useState([]);
      const [loading, setLoading] = useState(false);
      const [bestRoute, setBestRoute] = useState(null);
      
      const scan = async () => {
        if (!pairs || pairs.length < 2 || !tokenConfig) return;
        
        setLoading(true);
        
        try {
          const fee = tokenConfig.fee || 0.025;
          const feeMultiplier = 1 - fee;
          const roundTripMultiplier = feeMultiplier * feeMultiplier;
          const minProfitableGap = (1 / roundTripMultiplier) - 1; // e.g., ~5.06% for 2.5% fee
          
          // Filter to pairs with meaningful liquidity (at least $500)
          const validPairs = pairs.filter(p => p.pairAddress && (p.liquidity || 0) >= 500);
          
          const mainTokenContract = tokenConfig.contract?.toLowerCase();
          
          // Helper to look up fee for any token
          const getTokenFee = (symbol, address) => {
            const addrLower = address?.toLowerCase();
            for (const [key, config] of Object.entries(TOKENS)) {
              if (config.contract?.toLowerCase() === addrLower || 
                  config.name?.toUpperCase() === symbol?.toUpperCase()) {
                return config.fee || 0;
              }
            }
            return 0; // No fee for tokens not in our list (WPLS, DAI, etc.)
          };
          
          // Build pair data with accurate USD prices for ALL pairs
          const pairData = [];
          
          for (const pair of validPairs) {
            const baseAddr = pair.baseToken?.address?.toLowerCase();
            const isBaseMain = baseAddr === mainTokenContract || 
              (!baseAddr && pair.baseToken?.symbol?.toUpperCase() === tokenConfig.name?.toUpperCase());
            
            // Get other token info
            const otherToken = isBaseMain ? pair.quoteToken : pair.baseToken;
            const otherSymbol = otherToken?.symbol || '?';
            const otherAddress = otherToken?.address;
            const otherDecimals = otherToken?.decimals || (otherSymbol === 'eHEX' ? 8 : 18); // eHEX has 8 decimals
            
            // Get fee for the other token (e.g., UFO has 6% fee)
            const otherTokenFee = getTokenFee(otherSymbol, otherAddress);
            
            const priceUsd = parseFloat(pair.priceUsd) || 0;
            const priceNative = parseFloat(pair.priceNative) || 0;
            const quoteTokenPriceUsd = parseFloat(pair.quoteTokenPriceUsd) || 0;
            const baseTokenPriceQuoteToken = parseFloat(pair.baseTokenPriceQuoteToken) || 0;
            const liquidity = pair.liquidity?.usd || pair.liquidity || 0;
            
            let mainTokenPriceUsd = 0;
            let priceSource = '';
            
            if (isBaseMain) {
              // FLEET is base token - priceUsd IS the FLEET price directly
              mainTokenPriceUsd = priceUsd;
              priceSource = 'base';
            } else {
              // FLEET is quote token - we need to get FLEET's price differently
              
              // Option 1: Use quoteTokenPriceUsd if available (from GeckoTerminal)
              if (quoteTokenPriceUsd > 0) {
                mainTokenPriceUsd = quoteTokenPriceUsd;
                priceSource = 'quoteTokenPriceUsd';
              }
              // Option 2: For DexScreener pairs, priceNative IS the exchange rate
              // when the quote token is NOT the chain's native currency (PLS)
              // priceNative = base token price in quote token (e.g., 0.4379 FLEET per SOLIDX)
              // So: FLEET price = base token USD / priceNative
              else if (priceNative > 0 && priceUsd > 0) {
                mainTokenPriceUsd = priceUsd / priceNative;
                priceSource = 'exchangeRate';
                
                // Sanity check: if the calculated price is way off (e.g., > $100 or < $0.01), skip it
                // This catches cases where priceNative might actually be in PLS
                if (mainTokenPriceUsd > 100 || mainTokenPriceUsd < 0.01) {
                  console.log(`Skipping ${otherSymbol} - calculated price $${mainTokenPriceUsd.toFixed(4)} seems wrong`);
                  continue;
                }
              }
              // Option 3: Calculate from baseTokenPriceQuoteToken if available
              else if (baseTokenPriceQuoteToken > 0 && priceUsd > 0) {
                mainTokenPriceUsd = priceUsd / baseTokenPriceQuoteToken;
                priceSource = 'baseTokenPriceQuoteToken';
              }
              else {
                console.log(`Cannot determine ${tokenConfig.name} price for ${otherSymbol} pair - missing data`);
                continue;
              }
            }
            
            // Skip pairs with obviously bad price data
            if (mainTokenPriceUsd <= 0) {
              console.log(`Skipping ${otherSymbol} - no valid price (${priceSource})`);
              continue;
            }
            
            pairData.push({
              pair,
              pairAddress: pair.pairAddress,
              otherSymbol,
              otherAddress,
              otherDecimals,
              otherTokenFee,
              mainTokenPriceUsd,
              // Calculate other token's USD price (for vault execution)
              // In FLEET/WETH pair: if FLEET=$0.90 and priceNative=0.0003 WETH per FLEET
              // Then WETH = $0.90 / 0.0003 = $3000
              otherTokenPriceUsd: priceNative > 0 ? mainTokenPriceUsd / priceNative : 0,
              liquidity,
              priceSource // Track how we got the price
            });
          }
          
          if (pairData.length < 2) {
            console.warn('Not enough pairs with valid prices');
            setLoading(false);
            return;
          }
          
          // Calculate liquidity-weighted average price
          const sortedByPrice = [...pairData].sort((a, b) => a.mainTokenPriceUsd - b.mainTokenPriceUsd);
          const medianPrice = sortedByPrice[Math.floor(sortedByPrice.length / 2)].mainTokenPriceUsd;
          
          // Filter outliers for average calculation
          const validForAvg = pairData.filter(p => 
            p.mainTokenPriceUsd > medianPrice * 0.5 && 
            p.mainTokenPriceUsd < medianPrice * 2
          );
          
          if (validForAvg.length < 2) {
            console.warn('Not enough valid pairs after filtering outliers');
            setLoading(false);
            return;
          }
          
          const totalLiquidity = validForAvg.reduce((sum, p) => sum + (p.liquidity || 1), 0);
          const avgPrice = totalLiquidity > 0 
            ? validForAvg.reduce((sum, p) => sum + (p.mainTokenPriceUsd * (p.liquidity || 1)), 0) / totalLiquidity
            : medianPrice;
          
          console.log(`Avg price: median=$${medianPrice.toFixed(6)}, weighted avg=$${avgPrice.toFixed(6)}, valid: ${validForAvg.length}/${pairData.length} pairs`);
          
          // Calculate distance to arb threshold for ALL pairs
          const distances = pairData.map(p => {
            const priceDiff = ((p.mainTokenPriceUsd - avgPrice) / avgPrice) * 100;
            const distanceToThreshold = (minProfitableGap * 100 / 2) - Math.abs(priceDiff);
            
            // Flag pairs with prices way off from median as bad data
            const isBadData = p.mainTokenPriceUsd < medianPrice * 0.5 || p.mainTokenPriceUsd > medianPrice * 2;
            
            // Calculate trade needed to move price to create/improve arb opportunity
            // This shows: "If you trade X on this pair, it generates Y volume"
            let triggerAction = null;
            let triggerAmount = 0;
            let triggerTokens = 0;
            let volumeGenerated = 0;
            
            if (p.liquidity >= 100 && !isBadData) {
              // Determine action based on price position
              // If above avg: selling here pushes price down toward avg
              // If below avg: buying here pushes price up toward avg
              triggerAction = p.mainTokenPriceUsd > avgPrice ? 'sell' : 'buy';
              
              // Calculate optimal trade size (5% of liquidity is reasonable to show impact)
              // But also consider the distance to threshold
              if (distanceToThreshold > 0) {
                // Not at threshold yet - show what's needed to GET to threshold
                const neededImpact = distanceToThreshold / 100;
                triggerAmount = (neededImpact * p.liquidity) / 2;
              } else {
                // Already at threshold - show a reasonable trade size (2% of liquidity)
                triggerAmount = p.liquidity * 0.02;
              }
              
              triggerTokens = triggerAmount / p.mainTokenPriceUsd;
              // Volume generated = your trade + arb bot's counter-trade
              volumeGenerated = triggerAmount * 2;
            }
            
            return {
              pairAddress: p.pairAddress,
              otherSymbol: p.otherSymbol,
              otherTokenFee: p.otherTokenFee,
              priceUsd: p.mainTokenPriceUsd,
              priceDiffPercent: priceDiff,
              distanceToThreshold: Math.max(0, distanceToThreshold),
              liquidity: p.liquidity,
              isAboveAvg: priceDiff > 0,
              isBadData,
              priceSource: p.priceSource, // 'base', 'quoteTokenPriceUsd', or 'exchangeRate'
              triggerAction,
              triggerAmount,
              triggerTokens,
              volumeGenerated
            };
          }).sort((a, b) => b.priceUsd - a.priceUsd); // Sort by price descending (HIGH at top, LOW at bottom)
          
          setPairDistances(distances);
          
          // Find arbitrage opportunities
          const opps = [];
          
          for (let i = 0; i < pairData.length; i++) {
            for (let j = 0; j < pairData.length; j++) {
              if (i === j) continue;
              
              const buyPair = pairData[i];  // Buy main token here (lower price = cheaper)
              const sellPair = pairData[j]; // Sell main token here (higher price = more expensive)
              
              // Skip pairs with insufficient liquidity
              if (buyPair.liquidity < 500 || sellPair.liquidity < 500) continue;
              
              // Skip pairs flagged as bad data (price >50% off from median)
              const buyIsBadData = buyPair.mainTokenPriceUsd < medianPrice * 0.5 || buyPair.mainTokenPriceUsd > medianPrice * 2;
              const sellIsBadData = sellPair.mainTokenPriceUsd < medianPrice * 0.5 || sellPair.mainTokenPriceUsd > medianPrice * 2;
              if (buyIsBadData || sellIsBadData) continue;
              
              // Skip if buy price is higher than sell price
              if (buyPair.mainTokenPriceUsd >= sellPair.mainTokenPriceUsd) continue;
              
              // Calculate price difference
              const priceDiff = (sellPair.mainTokenPriceUsd - buyPair.mainTokenPriceUsd) / buyPair.mainTokenPriceUsd;
              
              // Skip if price difference doesn't exceed fee threshold
              if (priceDiff <= minProfitableGap) continue;
              
              // Calculate optimal trade size and profit
              // Use iterative approach to find optimal size accounting for slippage
              const result = findOptimalTrade(buyPair, sellPair, feeMultiplier, fee);
              
              if (result.profit > 0.01) {
                // Calculate volume impact (trade creates volume in both pairs)
                // Buy side: spend optimalSize
                // Sell side: sell tokens worth slightly less (after fees)
                const buyVolume = result.optimalSize;
                const sellVolume = result.optimalSize * feeMultiplier * feeMultiplier; // After both fees
                const totalVolume = buyVolume + sellVolume;
                const feesGenerated = totalVolume * fee;
                
                // Calculate no-fee profit (for wallets exempt from token fee)
                const noFeeResult = calculateProfitNoFee(result.optimalSize, buyPair, sellPair);
                
                // Add slippage buffer: subtract 1.5% of trade size from expected profit
                // This accounts for price movement, stale data, and execution slippage
                const slippageBuffer = result.optimalSize * 0.015;
                const adjustedProfit = result.profit - slippageBuffer;
                const adjustedNoFeeProfit = noFeeResult.profit - slippageBuffer;
                
                // Minimum liquidity check - need at least 2x trade size in each pool
                const minLiquidity = Math.min(buyPair.liquidity, sellPair.liquidity);
                const liquidityRatio = minLiquidity / result.optimalSize;
                const hasGoodLiquidity = liquidityRatio > 2;
                
                // Calculate confidence level based on multiple factors
                // Higher is better: liquidity ratio, profit margin, price gap
                let confidenceScore = 0;
                let confidenceFactors = [];
                
                // Liquidity factor (0-40 points)
                if (liquidityRatio >= 10) {
                  confidenceScore += 40;
                  confidenceFactors.push('excellent liquidity');
                } else if (liquidityRatio >= 5) {
                  confidenceScore += 30;
                  confidenceFactors.push('good liquidity');
                } else if (liquidityRatio >= 2) {
                  confidenceScore += 20;
                  confidenceFactors.push('adequate liquidity');
                } else {
                  confidenceScore += 5;
                  confidenceFactors.push('thin liquidity');
                }
                
                // Profit margin factor (0-30 points)
                const profitMargin = (adjustedProfit / result.optimalSize) * 100;
                if (profitMargin >= 2) {
                  confidenceScore += 30;
                  confidenceFactors.push('strong margin');
                } else if (profitMargin >= 1) {
                  confidenceScore += 20;
                  confidenceFactors.push('decent margin');
                } else if (profitMargin >= 0.5) {
                  confidenceScore += 10;
                  confidenceFactors.push('thin margin');
                } else {
                  confidenceScore += 0;
                  confidenceFactors.push('razor thin margin');
                }
                
                // Price gap factor (0-30 points) - bigger gaps are more likely to persist
                if (priceDiff * 100 >= 8) {
                  confidenceScore += 30;
                  confidenceFactors.push('large gap');
                } else if (priceDiff * 100 >= 6) {
                  confidenceScore += 20;
                  confidenceFactors.push('moderate gap');
                } else {
                  confidenceScore += 10;
                  confidenceFactors.push('small gap');
                }
                
                // Convert score to level
                let confidenceLevel, confidenceColor;
                if (confidenceScore >= 80) {
                  confidenceLevel = 'HIGH';
                  confidenceColor = 'text-green-400';
                } else if (confidenceScore >= 60) {
                  confidenceLevel = 'MEDIUM';
                  confidenceColor = 'text-yellow-400';
                } else if (confidenceScore >= 40) {
                  confidenceLevel = 'LOW';
                  confidenceColor = 'text-orange-400';
                } else {
                  confidenceLevel = 'RISKY';
                  confidenceColor = 'text-red-400';
                }
                
                opps.push({
                  buyPair: buyPair.pairAddress,
                  buySymbol: buyPair.otherSymbol,
                  buyAddress: buyPair.otherAddress,
                  buyDecimals: buyPair.otherDecimals,
                  buyPrice: buyPair.mainTokenPriceUsd, // FLEET price in buy pair
                  buyTokenPrice: buyPair.otherTokenPriceUsd, // Buy token USD price (e.g., WETH)
                  sellPair: sellPair.pairAddress,
                  sellSymbol: sellPair.otherSymbol,
                  sellAddress: sellPair.otherAddress,
                  sellDecimals: sellPair.otherDecimals,
                  sellPrice: sellPair.mainTokenPriceUsd, // FLEET price in sell pair
                  sellTokenPrice: sellPair.otherTokenPriceUsd, // Sell token USD price (e.g., INC)
                  priceDiffPercent: priceDiff * 100,
                  optimalSizeUsd: result.optimalSize,
                  optimalTokens: result.tokens,
                  profitUsd: adjustedProfit, // Now includes slippage buffer
                  rawProfitUsd: result.profit, // Original calculation
                  profitPercent: (adjustedProfit / result.optimalSize) * 100,
                  noFeeProfitUsd: adjustedNoFeeProfit,
                  noFeeProfitPercent: (adjustedNoFeeProfit / result.optimalSize) * 100,
                  buyLiquidity: buyPair.liquidity,
                  sellLiquidity: sellPair.liquidity,
                  liquidityRatio: liquidityRatio,
                  hasGoodLiquidity: hasGoodLiquidity,
                  confidenceScore,
                  confidenceLevel,
                  confidenceColor,
                  confidenceFactors,
                  volumeGenerated: totalVolume,
                  feesGenerated: feesGenerated,
                  slippageBuffer: slippageBuffer,
                  // Estimate gas costs: 1 atomic vault transaction ≈ 400k gas at ~30000 Beats
                  // On PulseChain this is roughly 12,000 PLS (much less than 7 separate txs!)
                  estimatedGasPLS: 12000,
                  estimatedGasUsd: (plsPrice || 0.0000145) * 12000
                });
              }
            }
          }
          
          // Sort by profit descending
          opps.sort((a, b) => b.profitUsd - a.profitUsd);
          
          // Dedupe by buy token - only show best route for each token you might spend
          const seenBuyTokens = new Set();
          const dedupedOpps = opps.filter(opp => {
            if (seenBuyTokens.has(opp.buySymbol)) return false;
            seenBuyTokens.add(opp.buySymbol);
            return true;
          });
          
          setOpportunities(dedupedOpps.slice(0, 10)); // Top 10
          
          // Set best route for summary banner
          if (dedupedOpps.length > 0) {
            setBestRoute(dedupedOpps[0]);
          } else {
            setBestRoute(null);
          }
          
        } catch (e) {
          console.error('Arb scan error:', e);
        }
        
        setLoading(false);
      };
      
      // Find optimal trade size accounting for slippage, fees (including other token fees), and gas
      // Gas cost on PulseChain is very cheap but we still account for it
      const GAS_COST_USD = 0.05; // ~$0.05 for two swaps on PulseChain
      
      const findOptimalTrade = (buyPair, sellPair, mainTokenFeeMultiplier, mainTokenFee) => {
        const buyLiq = buyPair.liquidity;
        const sellLiq = sellPair.liquidity;
        
        // Safety check - need real liquidity
        if (buyLiq < 500 || sellLiq < 500) {
          return { optimalSize: 0, tokens: 0, profit: 0 };
        }
        
        const minLiq = Math.min(buyLiq, sellLiq);
        
        // Get fee multipliers for other tokens in each pair
        // BUY pair: we SPEND the other token (fee applies if that token has one)
        const buyOtherFeeMultiplier = 1 - (buyPair.otherTokenFee || 0);
        // SELL pair: we RECEIVE the other token (fee applies if that token has one)  
        const sellOtherFeeMultiplier = 1 - (sellPair.otherTokenFee || 0);
        
        let bestProfit = 0;
        let bestSize = 0;
        let bestTokens = 0;
        
        // Test different trade sizes (in USD)
        const testSizes = [10, 25, 50, 100, 200, 500, 1000, 2000, 5000];
        
        for (const tradeSize of testSizes) {
          if (tradeSize > minLiq * 0.25) continue; // Don't trade more than 25% of smaller pool
          
          // BUY LEG: Spend other token → Get main token
          // If buy pair's other token has a fee (e.g., spending UFO), apply it first
          const effectiveInputUsd = tradeSize * buyOtherFeeMultiplier;
          
          // Calculate slippage on buy side (we're buying, so price goes up)
          const buySlippage = effectiveInputUsd / buyLiq;
          const effectiveBuyPrice = buyPair.mainTokenPriceUsd * (1 + buySlippage);
          
          // Tokens we can buy (before main token fee)
          const tokensBought = effectiveInputUsd / effectiveBuyPrice;
          
          // Apply main token buy fee (fee on receiving main tokens)
          const tokensAfterBuyFee = tokensBought * mainTokenFeeMultiplier;
          
          // SELL LEG: Send main token → Get other token
          // Apply main token sell fee (fee on transfer)
          const tokensToSell = tokensAfterBuyFee * mainTokenFeeMultiplier;
          
          // Calculate slippage on sell side (we're selling, so price goes down)
          const sellValue = tokensToSell * sellPair.mainTokenPriceUsd;
          const sellSlippage = sellValue / sellLiq;
          const effectiveSellPrice = sellPair.mainTokenPriceUsd * (1 - sellSlippage);
          
          // Output before sell pair's other token fee
          const outputBeforeFee = tokensToSell * effectiveSellPrice;
          
          // Apply sell pair's other token fee (e.g., receiving UFO)
          const outputUsd = outputBeforeFee * sellOtherFeeMultiplier;
          
          // Final profit (subtract gas cost)
          const profit = outputUsd - tradeSize - GAS_COST_USD;
          
          if (profit > bestProfit) {
            bestProfit = profit;
            bestSize = tradeSize;
            bestTokens = tokensAfterBuyFee;
          }
        }
        
        // Fine-tune around the best size found
        if (bestSize > 0) {
          for (let mult = 0.5; mult <= 2.0; mult += 0.1) {
            const tradeSize = bestSize * mult;
            if (tradeSize < 10 || tradeSize > minLiq * 0.25) continue;
            
            const effectiveInputUsd = tradeSize * buyOtherFeeMultiplier;
            const buySlippage = effectiveInputUsd / buyLiq;
            const effectiveBuyPrice = buyPair.mainTokenPriceUsd * (1 + buySlippage);
            const tokensBought = effectiveInputUsd / effectiveBuyPrice;
            const tokensAfterBuyFee = tokensBought * mainTokenFeeMultiplier;
            const tokensToSell = tokensAfterBuyFee * mainTokenFeeMultiplier;
            const sellValue = tokensToSell * sellPair.mainTokenPriceUsd;
            const sellSlippage = sellValue / sellLiq;
            const effectiveSellPrice = sellPair.mainTokenPriceUsd * (1 - sellSlippage);
            const outputBeforeFee = tokensToSell * effectiveSellPrice;
            const outputUsd = outputBeforeFee * sellOtherFeeMultiplier;
            const profit = outputUsd - tradeSize - GAS_COST_USD;
            
            if (profit > bestProfit) {
              bestProfit = profit;
              bestSize = tradeSize;
              bestTokens = tokensAfterBuyFee;
            }
          }
        }
        
        return {
          optimalSize: bestSize,
          tokens: bestTokens,
          profit: bestProfit
        };
      };
      
      // Calculate profit WITHOUT main token fees (for fee-exempt wallets)
      // Note: Still pays fees on OTHER tokens (like UFO's 6% fee) and gas
      const calculateProfitNoFee = (tradeSize, buyPair, sellPair) => {
        // Get fee multipliers for other tokens
        const buyOtherFeeMultiplier = 1 - (buyPair.otherTokenFee || 0);
        const sellOtherFeeMultiplier = 1 - (sellPair.otherTokenFee || 0);
        
        // BUY LEG: Apply other token fee if exists
        const effectiveInputUsd = tradeSize * buyOtherFeeMultiplier;
        
        const buySlippage = effectiveInputUsd / buyPair.liquidity;
        const effectiveBuyPrice = buyPair.mainTokenPriceUsd * (1 + buySlippage);
        
        // Tokens we can buy (NO main token fee)
        const tokensBought = effectiveInputUsd / effectiveBuyPrice;
        
        // SELL LEG: No main token fee, but check other token fee
        const sellSlippage = (tokensBought * sellPair.mainTokenPriceUsd) / sellPair.liquidity;
        const effectiveSellPrice = sellPair.mainTokenPriceUsd * (1 - sellSlippage);
        
        // Output before sell pair's other token fee
        const outputBeforeFee = tokensBought * effectiveSellPrice;
        
        // Apply sell pair's other token fee
        const outputUsd = outputBeforeFee * sellOtherFeeMultiplier;
        
        // Subtract gas
        const netProfit = outputUsd - tradeSize - GAS_COST_USD;
        
        return {
          profit: netProfit,
          tokens: tokensBought
        };
      };
      
      return { opportunities, pairDistances, loading, scan, bestRoute };
    };
    
    // Arb Scanner Modal
    const ArbScannerModal = ({ isOpen, onClose, opportunities: propOpportunities, pairDistances, pairs, loading, onScan, theme, tokenName, fee, bestRoute: propBestRoute, tokenLogo, tokenContract }) => {

      const [showConvertOption, setShowConvertOption] = useState(false);
      const [conversionQuote, setConversionQuote] = useState(null);
      const [convertExecuting, setConvertExecuting] = useState(false);
      const [roundTrip, setRoundTrip] = useState(false); // Auto-convert back to original token

      const [lossAcknowledged, setLossAcknowledged] = useState(false);
      
      // Auto-refresh and notifications
      const [autoRefresh, setAutoRefresh] = useState(false);

      const [soundEnabled, setSoundEnabled] = useState(() => {

      const [showVaultDropdown, setShowVaultDropdown] = useState(false);

      const [isVaultOwner, setIsVaultOwner] = useState(false);
      const [walletTokens, setWalletTokens] = useState([]); // Tokens in connected wallet
      const [walletTokensLoading, setWalletTokensLoading] = useState(false); // Loading state
      const [vaultTotalUsd, setVaultTotalUsd] = useState(0); // Total USD value of vault
      const [showWalletDropdown, setShowWalletDropdown] = useState(false); // Wallet dropdown
      const [githubStatus, setGithubStatus] = useState('checking'); // 'ok', 'error', 'checking'
      const [githubError, setGithubError] = useState(null); // Error message if any
      
      // Play notification sound when new opportunities appear
      const playNotificationSound = () => {

      // Save sound preference

      // Sync propOpportunities to local state and fetch live quotes
      useEffect(() => {

        }
        
        // Start with prop data
        setOpportunities(propOpportunities);
        setBestRoute(propBestRoute);
        
        // If wallet not connected, just use prop data
        if (!wallet.provider || !wallet.isConnected) return;
        
        // Fetch live quotes
        const fetchLiveQuotes = async () => {
          setLiveQuotesLoading(true);
          
          const ROUTER_ADDRESS = '0x165C3410fC91EF562C50559f7d2289fEbed552d9';
          const WPLS_ADDRESS = '0xA1077a294dDE1B09bB078844df40758a5D0f9a27';
          const router = new ethers.Contract(ROUTER_ADDRESS, [
            'function getAmountsOut(uint amountIn, address[] path) view returns (uint[] amounts)'
          ], wallet.provider);
          
          const currentPlsPrice = plsPrice || 0.0000135;
          const mainTokenFee = TOKENS[tokenName]?.fee || 0.025;
          
          const fetchOne = async (opp) => {

              const buyDecimals = opp.buyDecimals || 18;

              // Get vault balance for buy token
              const vaultToken = vaultBalances.find(v => v.symbol === opp.buySymbol);
              const availableTokens = vaultToken ? vaultToken.formatted * 0.95 : 0;
              const optimalTokens = opp.optimalSizeUsd / (opp.buyTokenPrice || 1);
              const tradeTokens = Math.min(availableTokens, optimalTokens);
              
              if (tradeTokens <= 0) {

              const tradeAmountWei = ethers.parseUnits(tradeTokens.toFixed(Math.min(buyDecimals, 8)), buyDecimals);

              try {

              } catch (e) { /* use API price as fallback */ }
              
              // If inputUsd is very different from expected (>3x), the API price is stale

              if (inputUsd > expectedInputUsd * 3 || inputUsd < expectedInputUsd / 3) {

                const realTokenPrice = inputUsd / tradeTokens;
                actualTradeTokens = Math.min(availableTokens, expectedInputUsd / realTokenPrice);
                actualTradeAmountWei = ethers.parseUnits(actualTradeTokens.toFixed(Math.min(buyDecimals, 8)), buyDecimals);
                
                // Recalculate inputUsd with new trade size
                try {

                    inputUsd = Number(ethers.formatEther(buyQuote[1])) * currentPlsPrice;

          // Fetch all in parallel

          const finalOpps = [...results, ...propOpportunities.slice(5)];
          
          // Sort by live profit

        if (selectedOpp) {
          executeArb(selectedOpp, mode);
        }

        if (!conversionQuote || !wallet.signer) return;
        
        setConvertExecuting(true);
        const addStep = (step) => setExecutionSteps(prev => [...prev, step]);
        
        try {
          const vault = VaultUtil.getContract(wallet.signer);
          if (!vault) throw new Error('Vault contract not available');
          
          addStep({ status: 'pending', message: `Converting ${conversionQuote.fromAmount.toFixed(4)} ${conversionQuote.fromSymbol} to ${conversionQuote.toSymbol}...` });
          
          // Use 95% of available to leave room for rounding
          const sellAmount = conversionQuote.fromAmount * 0.95;
          const sellAmountWei = ethers.parseUnits(sellAmount.toFixed(Math.min(conversionQuote.sellDecimals, 8)), conversionQuote.sellDecimals);
          
          // Execute via vault's executeArb with the conversion path
          const feeData = await wallet.provider.getFeeData();
          const boostedGasPrice = (feeData.gasPrice * 150n) / 100n;
          
          const tx = await vault.executeArb(
            conversionQuote.path,
            sellAmountWei,
            0n, // minProfit
            false, // usePLSForMissing
            false, // convertEndToPLS
            { gasLimit: 500000, gasPrice: boostedGasPrice }
          );
          
          addStep({ status: 'waiting', message: `Tx submitted: ${tx.hash.slice(0, 10)}...` });
          
          const receipt = await tx.wait();
          
          if (receipt.status === 1) {
            addStep({ status: 'success', message: `✓ Converted to ${conversionQuote.toSymbol}!` });
            
            // Check new balance
            const newBuyBalance = await vault.getTokenBalance(conversionQuote.buyTokenAddr);
            const newBuyFormatted = Number(ethers.formatUnits(newBuyBalance, conversionQuote.buyDecimals));
            addStep({ status: 'info', message: `New ${conversionQuote.toSymbol} balance: ${newBuyFormatted.toFixed(4)}` });
            
            setShowConvertOption(false);
            setConversionQuote(null);
            
            // Refresh balances
            setTimeout(() => refreshAllBalances(), 2000);
          } else {
            throw new Error('Conversion transaction failed');
          }
        } catch (e) {
          addStep({ status: 'error', message: `Conversion failed: ${e.reason || e.message}` });
        } finally {
          setConvertExecuting(false);
        }
      };

                      const addStep = (step) => setBalancerSteps(prev => [...prev, step]);
                      
                      try {
                        const vault = new ethers.Contract(VAULT_CONFIG.address, VAULT_ABI, wallet.signer);
                        const plsPrice = 0.000014;
                        
                        // Build sell list
                        const toSell = [];
                        for (const [symbol, amount] of Object.entries(balancerSellAmounts)) {
                          if (amount <= 0) continue;
                          const token = vaultBalances.find(t => t.symbol === symbol);
                          if (!token) continue;
                          
                          const tokenPrice = token.usdValue / token.formatted;
                          const tokensToSell = amount / tokenPrice;
                          toSell.push({
                            symbol,
                            address: token.address,
                            amount: tokensToSell,
                            decimals: token.decimals || 18,
                            usdAmount: amount
                          });
                        }
                        
                        // Build buy list
                        const toBuy = [];
                        for (const [symbol, amount] of Object.entries(balancerBuyAmounts)) {
                          if (amount <= 0) continue;
                          const token = VAULT_SCAN_TOKENS.find(t => t.symbol === symbol);
                          if (!token) continue;
                          
                          const plsNeeded = amount / plsPrice;
                          toBuy.push({
                            symbol,
                            address: token.address,
                            needPLS: plsNeeded,
                            needUsd: amount,
                            decimals: token.decimals || 18
                          });
                        }
                        
                        addStep({ status: 'info', message: `Selling ${toSell.length} tokens, buying ${toBuy.length} tokens` });
                        
                        // Execute sells first
                        for (const token of toSell) {
                          addStep({ status: 'pending', message: `Selling ~$${token.usdAmount.toFixed(0)} ${token.symbol}...` });
                          
                          try {
                            const amountWei = ethers.parseUnits(
                              token.amount.toFixed(Math.min(token.decimals, 8)), 
                              token.decimals
                            );
                            
                            const tx = await vault.rebalance(token.address, amountWei, 0);
                            await tx.wait();
                            
                            addStep({ status: 'success', message: `Sold ${token.symbol} for PLS` });
                          } catch (e) {
                            const reason = e.reason || e.message || 'Unknown error';
                            addStep({ status: 'error', message: `Failed to sell ${token.symbol}: ${reason}` });
                          }
                        }
                        
                        // Execute buys
                        for (const token of toBuy) {
                          addStep({ status: 'pending', message: `Buying ~$${token.needUsd.toFixed(0)} ${token.symbol}...` });
                          
                          try {
                            const plsWei = ethers.parseEther(token.needPLS.toFixed(4));
                            
                            const tx = await vault.buyToken(token.address, plsWei, 0);
                            await tx.wait();
                            
                            addStep({ status: 'success', message: `Bought ${token.symbol}` });
                          } catch (e) {
                            const reason = e.reason || e.message || 'Unknown error';
                            if (reason.includes('not a function')) {
                              addStep({ status: 'warning', message: `buyToken not available - upgrade contract` });
                            } else {
                              addStep({ status: 'error', message: `Failed to buy ${token.symbol}: ${reason}` });
                            }
                          }
                        }
                        
                        addStep({ status: 'success', message: `Rebalance complete! Refreshing balances...` });
                        setRebalanceComplete(true);
                        
                        setTimeout(() => refreshAllBalances(), 2000);
                        
                      } catch (e) {
                        addStep({ status: 'error', message: `Rebalance failed: ${e.reason || e.message}` });
                        setRebalanceComplete(false);
                      }
                      
                      setBalancerExecuting(false);
                    }}
                    disabled={balancerExecuting || rebalanceComplete || (
                      Object.values(balancerSellAmounts).reduce((s, v) => s + (v || 0), 0) === 0 &&
                      Object.values(balancerBuyAmounts).reduce((s, v) => s + (v || 0), 0) === 0
                    )}
                    className={`flex-1 py-3 rounded-lg font-medium disabled:opacity-50 ${
                      rebalanceComplete 
                        ? 'bg-green-500 text-white cursor-default' 
                        : 'bg-purple-500 hover:bg-purple-600 text-white'
                    }`}
                  >
                    {balancerExecuting ? 'Rebalancing...' : rebalanceComplete ? '✓ Rebalance Complete!' : 'Execute Rebalance'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ============================================
    // KPI REPORT MODAL - Beautiful shareable graphic
    // ============================================
    const KPIReportModal = ({ 
      isOpen, 
      onClose, 
      token, 
      data, 
      plsRatio, 
      volumeByPeriod, 
      burns, 
      ufoPrice,
      plsPrice 
    }) => {
      // Selected view: current token name, other token name, or 'BOTH'
      const [selectedView, setSelectedView] = useState(null);
      
      // Data for the OTHER token (fetched when needed)
      const [otherTokenData, setOtherTokenData] = useState(null);
      const [otherTokenLoading, setOtherTokenLoading] = useState(false);
      
      // Holders data - separate for each token
      const [holdersData, setHoldersData] = useState({});
      const [totalBurnData, setTotalBurnData] = useState({});
      
      const BURN_ADDRESS = '0x0000000000000000000000000000000000000369';
      const PULSECHAIN_RPC = 'https://rpc.pulsechain.com';
      
      const TOKEN_SUPPLIES = {
        'PTGC': 333333333333,
        'UFO': 999999999051,
        'FLEET': 1000000000000,
        'XYZ': 1000000000000
      };
      
      const TOKEN_INFO = {
        'PTGC': {
          name: 'PTGC',
          contract: '0x94534EeEe131840b1c0F61847c572228bdfDDE93',
          logo: './06_PTGC_V1_transparent_bg (1).png',
          fee: 0.05,
          theme: { primary: '#D9CA5D' }
        },
        'UFO': {
          name: 'UFO',
          contract: '0x456548A9B56eFBbD89Ca0309edd17a9E20b04018',
          logo: './07_Ufo_transparent.png',
          fee: 0.06,
          theme: { primary: '#7CFC00' }
        }
      };
      
      // Reset selected view when modal opens
      useEffect(() => {
        if (isOpen && token?.name) {
          setSelectedView(token.name);
        }
      }, [isOpen, token?.name]);
      
      // Get other token name
      const otherTokenName = token?.name === 'PTGC' ? 'UFO' : 'PTGC';
      
      // Fetch other token's price data when needed
      useEffect(() => {
        if (!isOpen) return;
        if (selectedView !== otherTokenName && selectedView !== 'BOTH') return;
        if (otherTokenData) return; // Already fetched
        
        const fetchOtherToken = async () => {
          setOtherTokenLoading(true);
          try {
            const otherInfo = TOKEN_INFO[otherTokenName];
            
            // For UFO, we need to use the specific pair address to get correct data
            let mainPairData = null;
            if (otherTokenName === 'UFO') {
              const UFO_PAIR_ADDRESS = '0xbeA0e55b82Eb975280041F3b49C4D0bD937b72d5';
              try {
                const pairRes = await fetch(`https://api.dexscreener.com/latest/dex/pairs/pulsechain/${UFO_PAIR_ADDRESS}`);
                const pairData = await pairRes.json();
                if (pairData.pair) mainPairData = pairData.pair;
              } catch(e) {}
            }
            
            const response = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${otherInfo.contract}`);
            const result = await response.json();
            
            if (result.pairs?.length) {
              const pairs = result.pairs.filter(p => p.chainId === 'pulsechain');
              // Use mainPairData if available (for UFO), otherwise sort by liquidity
              const main = mainPairData || pairs.sort((a,b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0))[0];
              const totLiq = pairs.reduce((s,p) => s + (p.liquidity?.usd || 0), 0);
              const totVol = pairs.reduce((s,p) => s + (p.volume?.h24 || 0), 0);
              
              setOtherTokenData({
                price: parseFloat(main?.priceUsd || 0),
                change: main?.priceChange?.h24 || 0,
                mcap: main?.marketCap || main?.fdv || 0,
                liq: totLiq,
                volume: totVol,
                volChange: main?.volume?.h24Change || null,
                liqChange: null, // Not available from DexScreener
                mcapChange: null // Not available from DexScreener
              });
            }
          } catch (e) {
            console.error('Failed to fetch other token:', e);
          }
          setOtherTokenLoading(false);
        };
        
        fetchOtherToken();
      }, [isOpen, selectedView, otherTokenName, otherTokenData]);
      
      // Fetch holders for a specific token
      const fetchHoldersFor = async (tokenName) => {
        if (holdersData[tokenName]) return; // Already have it
        
        const info = TOKEN_INFO[tokenName];
        if (!info) return;
        
        try {
          const response = await fetch(`https://api.scan.pulsechain.com/api/v2/tokens/${info.contract}`);
          const result = await response.json();
          if (result && result.holders) {
            const holdersCount = parseInt(result.holders || 0);
            
            // Daily snapshot approach - compare to yesterday's count
            const today = new Date().toISOString().split('T')[0];
            const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
            const todayKey = `proweb_holders_${tokenName}_${today}`;
            const yesterdayKey = `proweb_holders_${tokenName}_${yesterday}`;
            
            let change24h = null;
            try {
              // Always store today's count
              localStorage.setItem(todayKey, JSON.stringify({ count: holdersCount }));
              
              // Try to get yesterday's count for comparison
              const yesterdayData = localStorage.getItem(yesterdayKey);
              if (yesterdayData) {
                const { count: yesterdayCount } = JSON.parse(yesterdayData);
                if (yesterdayCount > 0) {
                  change24h = holdersCount - yesterdayCount;
                }
              }
              
              // Clean up old keys (older than 2 days)
              const twoDaysAgo = new Date(Date.now() - 172800000).toISOString().split('T')[0];
              localStorage.removeItem(`proweb_holders_${tokenName}_${twoDaysAgo}`);
            } catch(e) {}
            
            setHoldersData(prev => ({ ...prev, [tokenName]: { count: holdersCount, change24h, loading: false } }));
          }
        } catch (e) {
          setHoldersData(prev => ({ ...prev, [tokenName]: { count: null, change24h: null, loading: false } }));
        }
      };
      
      // Fetch burn data for a specific token
      const fetchBurnFor = async (tokenName) => {
        if (totalBurnData[tokenName]) return; // Already have it
        
        const info = TOKEN_INFO[tokenName];
        if (!info) return;
        
        try {
          // Fetch total burn balance
          const response = await fetch(PULSECHAIN_RPC, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              jsonrpc: '2.0',
              method: 'eth_call',
              params: [{
                to: info.contract,
                data: '0x70a08231000000000000000000000000' + BURN_ADDRESS.slice(2).toLowerCase()
              }, 'latest'],
              id: 1
            })
          });
          const result = await response.json();
          
          // Fetch 24h burn using historical balance (FAST - just 3 RPC calls)
          let burn24h = 0;
          try {
            // Get current block number
            const blockRes = await fetch(PULSECHAIN_RPC, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ jsonrpc: '2.0', method: 'eth_blockNumber', params: [], id: 1 })
            });
            const blockData = await blockRes.json();
            const currentBlock = parseInt(blockData.result, 16);
            
            // PulseChain ~10 second blocks, so 24h ago = current - 8640 blocks
            const blocksPerDay = 8640;
            const block24hAgo = currentBlock - blocksPerDay;
            
            // Get current burn balance
            const currentBalRes = await fetch(PULSECHAIN_RPC, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                jsonrpc: '2.0',
                method: 'eth_call',
                params: [{
                  to: info.contract,
                  data: '0x70a08231000000000000000000000000' + BURN_ADDRESS.slice(2).toLowerCase()
                }, 'latest'],
                id: 1
              })
            });
            const currentBalData = await currentBalRes.json();
            const currentBurnBalance = parseInt(currentBalData.result, 16) / 1e18;
            
            // Get burn balance 24h ago
            const pastBalRes = await fetch(PULSECHAIN_RPC, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                jsonrpc: '2.0',
                method: 'eth_call',
                params: [{
                  to: info.contract,
                  data: '0x70a08231000000000000000000000000' + BURN_ADDRESS.slice(2).toLowerCase()
                }, '0x' + block24hAgo.toString(16)],
                id: 1
              })
            });
            const pastBalData = await pastBalRes.json();
            const pastBurnBalance = parseInt(pastBalData.result, 16) / 1e18;
            
            burn24h = currentBurnBalance - pastBurnBalance;
            if (burn24h < 0) burn24h = 0;
          } catch (e) {
            console.error('Failed to fetch 24h burn:', e);
          }
          
          if (result.result) {
            const burnedAmount = parseInt(result.result, 16) / 1e18;
            const totalSupply = TOKEN_SUPPLIES[tokenName] || 1000000000000;
            const burnedPercent = (burnedAmount / totalSupply) * 100;
            
            setTotalBurnData(prev => ({ ...prev, [tokenName]: { amount: burnedAmount, percent: burnedPercent, burn24h, loading: false } }));
          }
        } catch (e) {
          setTotalBurnData(prev => ({ ...prev, [tokenName]: { amount: 0, percent: 0, burn24h: 0, loading: false } }));
        }
      };
      
      // Fetch data when modal opens or view changes
      useEffect(() => {
        if (!isOpen) return;
        
        // Always fetch for current token
        if (token?.name) {
          fetchHoldersFor(token.name);
          fetchBurnFor(token.name);
        }
        
        // Fetch for other token if showing it
        if (selectedView === otherTokenName || selectedView === 'BOTH') {
          fetchHoldersFor(otherTokenName);
          fetchBurnFor(otherTokenName);
        }
      }, [isOpen, selectedView, token?.name, otherTokenName]);
      
      if (!isOpen) return null;
      
      // Helper functions
      const fmt = (num) => {
        if (num === null || num === undefined || isNaN(num)) return '—';
        return Math.round(num).toLocaleString();
      };
      
      const fmtCompact = (num) => {
        if (num === null || num === undefined || isNaN(num)) return '—';
        if (num >= 1e9) return '$' + (num/1e9).toFixed(2) + 'B';
        if (num >= 1e6) return '$' + (num/1e6).toFixed(2) + 'M';
        if (num >= 1e3) return '$' + (num/1e3).toFixed(2) + 'K';
        return '$' + num.toFixed(2);
      };
      
      const formatPlsRatio = (price) => {
        if (!price || !plsPrice) return '—';
        const ratio = price / plsPrice;
        return ratio.toFixed(2);
      };
      
      const formatPrice = (price) => {
        if (!price || price === 0) return '$0';
        if (price >= 1) return '$' + price.toFixed(2);
        if (price >= 0.01) return '$' + price.toFixed(4);
        if (price >= 0.0001) return '$' + price.toFixed(6);
        const str = price.toFixed(18);
        const match = str.match(/^0\.(0*)([1-9]\d{0,3})/);
        if (match) {
          const zeros = match[1].length;
          const digits = match[2].slice(0, 4);
          return (<span>$0.0<sub style={{fontSize:'60%',opacity:0.7}}>{zeros}</sub>{digits}</span>);
        }
        return '$' + price.toFixed(8);
      };
      
      // Single Token Card Component
      const TokenCard = ({ tokenName, tokenData, isCurrentToken }) => {
        const info = TOKEN_INFO[tokenName];
        const pc = info.theme.primary;
        const pcRgb = pc.startsWith('#') ? `${parseInt(pc.slice(1,3),16)},${parseInt(pc.slice(3,5),16)},${parseInt(pc.slice(5,7),16)}` : '136,136,136';
        const totalSupply = TOKEN_SUPPLIES[tokenName];
        
        // tokenData is the correct data - passed from parent based on which token this is
        const displayData = tokenData;
        // Handle both data structures: Dashboard uses 'vol', fetched uses 'volume'
        const displayVolume = isCurrentToken ? (volumeByPeriod?.daily || 0) : (tokenData?.volume || tokenData?.vol || 0);
        const holders = holdersData[tokenName] || { count: null, change24h: null, loading: true };
        const burnData = totalBurnData[tokenName] || { amount: 0, percent: 0, burn24h: null, loading: true };

        // If not yet tracked, show null/loading indicator
        const burn24h = burnData.burn24h;
        const burn24hUsd = burn24h ? burn24h * (displayData?.price || 0) : null;
        const valueGenerated = displayVolume * info.fee;
        const liqToMcRatio = displayData?.mcap > 0 ? (displayData.liq / displayData.mcap) * 100 : null;
        
        // Sea creature functions
        const getTotalBurnThresholds = () => ({
          POSEIDON: totalSupply * 0.10, WHALE: totalSupply * 0.01, SHARK: totalSupply * 0.001,

        });

        });

          if (amount >= t.WHALE) return '🐋';
          if (amount >= t.SHARK) return '🦈';
          if (amount >= t.DOLPHIN) return '🐬';
          if (amount >= t.SQUID) return '🦑';
          if (amount >= t.TURTLE) return '🐢';
          if (amount >= t.CRAB) return '🦀';
          if (amount >= t.SHRIMP) return '🦐';
          return '🐚';

        const SeaCreatures = ({ amount }) => {
          if (!amount || amount <= 0) return null;
          const t = getTotalBurnThresholds();
          
          let remaining = amount;
          const poseidons = Math.floor(remaining / t.POSEIDON); remaining = remaining % t.POSEIDON;
          const whales = Math.floor(remaining / t.WHALE); remaining = remaining % t.WHALE;
          const sharks = Math.floor(remaining / t.SHARK); remaining = remaining % t.SHARK;
          const dolphins = Math.floor(remaining / t.DOLPHIN); remaining = remaining % t.DOLPHIN;
          const squids = Math.floor(remaining / t.SQUID); remaining = remaining % t.SQUID;
          const turtles = Math.floor(remaining / t.TURTLE);
          
          const creatures = [];
          if (poseidons > 0) creatures.push({ emoji: '🔱', count: poseidons });
          if (whales > 0) creatures.push({ emoji: '🐋', count: whales });
          if (sharks > 0) creatures.push({ emoji: '🦈', count: sharks });
          if (dolphins > 0) creatures.push({ emoji: '🐬', count: dolphins });
          if (squids > 0) creatures.push({ emoji: '🦑', count: squids });
          if (turtles > 0) creatures.push({ emoji: '🐢', count: turtles });
          
          let nextEmoji = '🐢', nextThreshold = t.TURTLE, currentLevel = amount;
          if (amount >= t.POSEIDON) { nextEmoji = '🔱'; nextThreshold = t.POSEIDON; currentLevel = amount % t.POSEIDON; }

          else if (amount >= t.SHARK) { nextEmoji = '🐋'; nextThreshold = t.WHALE; currentLevel = amount % t.WHALE; }

          else if (amount >= t.SQUID) { nextEmoji = '🐬'; nextThreshold = t.DOLPHIN; currentLevel = amount % t.DOLPHIN; }

                  )) : <span className="text-gray-500 text-[10px]">Building to {nextEmoji}</span>}
                </div>
                <span className="text-[10px] text-gray-500">{progress.toFixed(0)}%→{nextEmoji}</span>
              </div>
              <div className="h-1 bg-gray-800 rounded-full overflow-hidden">
                <div className="h-full bg-gradient-to-r from-orange-500 to-orange-400 rounded-full" style={{ width: `${Math.min(progress, 100)}%` }} />
              </div>
            </div>
          );
        };
        
        const LabelBadge = ({ emoji, text }) => (
          <div className="inline-flex items-center gap-1.5 px-2 py-1 rounded-md" style={{ background: `${pc}30` }}>
            <span className="text-xs">{emoji}</span>
            <span className="text-xs font-bold text-gray-200">{text}</span>
          </div>
        );
        
        const Badge = ({ value, isPercent = true }) => {
          if (value === null || value === undefined) return <span className="text-xs text-gray-600">—</span>;
          const up = value >= 0;
          return (
            <span className={`text-xs font-bold ${up ? 'text-green-400' : 'text-red-500'}`}>
              {up ? '▲' : '▼'} {isPercent ? Math.abs(value).toFixed(1) + '%' : Math.abs(value)}
            </span>
          );
        };
        
        const MetricBox = ({ emoji, label, value, change, isPercent = true }) => (
          <div className="p-3 rounded-xl flex flex-col justify-center" style={{ background: `rgba(${pcRgb},0.08)`, border: `1px solid rgba(${pcRgb},0.2)`, minHeight: '90px' }}>
            <div className="flex items-center justify-between mb-2">
              <LabelBadge emoji={emoji} text={label} />
              <Badge value={change} isPercent={isPercent} />
            </div>
            <div className="font-bold text-xl text-white font-space pl-1">{value}</div>
          </div>
        );
        
        const priceChange = tokenData?.change || 0;
        
        return (
          <div 
            className="rounded-2xl overflow-hidden relative flex-1 min-w-[420px]"
            style={{ background: '#0d0d0d', border: `2px solid ${pc}40` }}
          >
            {/* Background glow */}
            <div className="absolute inset-0 overflow-hidden pointer-events-none">
              <div className="absolute -top-20 -left-20 w-80 h-80 rounded-full blur-3xl opacity-20" style={{ background: `radial-gradient(circle, ${pc}, transparent 70%)` }} />
              <div className="absolute -bottom-20 -right-20 w-60 h-60 rounded-full blur-3xl opacity-15" style={{ background: `radial-gradient(circle, ${pc}, transparent 70%)` }} />
            </div>
            
            <div className="relative z-10">
              <div style={{ height: '4px', background: `linear-gradient(90deg, ${pc}, ${pc}60, ${pc})` }} />
              
              {/* Header */}
              <div className="p-4 flex items-center gap-4" style={{ background: `linear-gradient(180deg, ${pc}15, transparent)` }}>
                <div className="relative flex-shrink-0">
                  <div className="absolute inset-[-8px] rounded-3xl blur-xl" style={{ background: pc, opacity: 0.5 }} />
                  <img src={info.logo} alt={tokenName} className="relative w-20 h-20 rounded-2xl object-contain" style={{ border: `3px solid ${pc}60` }} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-orbitron font-black text-2xl" style={{ color: pc }}>{tokenName}</div>
                  <div className="text-gray-500 text-xs font-bold tracking-[0.2em]">KPI REPORT</div>
                  <div className="text-gray-500 text-[9px] font-mono mt-1 break-all leading-tight">{info.contract}</div>
                </div>
                <div className="text-right flex-shrink-0">
                  <div className="text-sm text-gray-400 font-medium">{new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</div>
                  <div className="mt-1.5 flex justify-end">
                    <span className="px-2 py-0.5 rounded text-[10px] font-semibold text-white" style={{ background: `${pc}40` }}>24H</span>
                  </div>
                </div>
              </div>
