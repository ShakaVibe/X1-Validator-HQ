          loadData();
        }
      }, [authenticated]);
      
      // Load vault balance when wallet is set
      useEffect(() => {
        if (vaultWallet && authenticated) {
          loadVaultBalance();
        }
      }, [vaultWallet, authenticated]);
      
      const loadData = async () => {
        setLoading(true);
        try {
          const { data } = await CommissionStorage.read();
          setReferrers(data.referrers || {});
          setArchives(data.archives || {});
          setSettings(data.settings || { commissionRate: 3, autoPay: false, minThreshold: 250 });
          setVaultWallet(data.vaultWallet || '');
          
          // Check if we need to archive last month's data
          const now = new Date();
          const thisMonth = now.toISOString().slice(0, 7); // "2025-01"
          const storedMonth = data.currentMonth || thisMonth;
          
          if (storedMonth !== thisMonth) {
            // Month has changed! Archive the old transactions
            console.log(`Month changed from ${storedMonth} to ${thisMonth}, archiving old data...`);
            const newArchives = { ...data.archives };
            if (data.transactions && data.transactions.length > 0) {
              newArchives[storedMonth] = data.transactions;
            }
            setArchives(newArchives);
            setTransactions([]); // Start fresh for new month
            setCurrentMonth(thisMonth);
            
            // Save the archived data immediately
            await CommissionStorage.write({
              ...data,
              currentMonth: thisMonth,
              transactions: [],
              archives: newArchives
            });
          } else {
            setTransactions(data.transactions || []);
            setCurrentMonth(storedMonth);
          }
          
          // Private key is stored locally only
          const storedKey = localStorage.getItem('commission_vault_key');
          if (storedKey) setVaultPrivateKey(storedKey);
        } catch (e) {
          console.error('Failed to load commission data:', e);
        }
        setLoading(false);
      };
      
      const saveData = async (newData) => {
        setSaving(true);
        const dataToSave = {
          referrers: newData.referrers ?? referrers,
          currentMonth: currentMonth,
          transactions: newData.transactions ?? transactions,
          archives: newData.archives ?? archives,
          settings: newData.settings ?? settings,
          vaultWallet: newData.vaultWallet ?? vaultWallet
        };
        await CommissionStorage.write(dataToSave);
        setSaving(false);
      };
      
      const loadVaultBalance = async () => {
        if (!vaultWallet) return;
        try {
          const response = await fetch('https://rpc.pulsechain.com', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              jsonrpc: '2.0',
              method: 'eth_call',
              params: [{
                to: PTGC_CONTRACT,
                data: '0x70a08231000000000000000000000000' + vaultWallet.slice(2).toLowerCase()
              }, 'latest'],
              id: 1
            })
          });
          const result = await response.json();
          if (result.result) {
            const balance = parseInt(result.result, 16) / 1e18;
            setVaultBalance(balance);
          }
        } catch (e) {
          console.error('Failed to load vault balance:', e);
        }
      };
      
      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError(false);
        const hash = await sha256(password);
        if (hash === PASS_HASH) {
          sessionStorage.setItem('commission_auth', PASS_HASH);
          setAuthenticated(true);
        } else {
          setAuthError(true);
          setPassword('');
        }
      };
      
      const addReferrer = async () => {
        if (!newReferrerName.trim() || !newReferrerWallet.trim()) return;
        const updated = {
          ...referrers,
          [newReferrerName.trim()]: {
            wallet: newReferrerWallet.trim(),
            addedDate: new Date().toISOString()
          }
        };
        setReferrers(updated);
        await saveData({ referrers: updated });
        setNewReferrerName('');
        setNewReferrerWallet('');
        setShowAddReferrer(false);
      };
      
      const removeReferrer = async (name) => {
        if (!confirm(`Remove referrer "${name}"?`)) return;
        const updated = { ...referrers };
        delete updated[name];
        setReferrers(updated);
        await saveData({ referrers: updated });
      };
      
      const addTransaction = async () => {
        if (!newTxReferrer || !newTxBuyer.trim() || !newTxAmount || !newTxUsdValue) return;
        const amount = parseFloat(newTxAmount);
        const usdValue = parseFloat(newTxUsdValue);
        if (isNaN(amount) || amount <= 0 || isNaN(usdValue) || usdValue <= 0) return;
        
        // Check if meets threshold - if not, commission is 0
        const meetsThreshold = usdValue >= (settings.minThreshold || 250);
        const commission = meetsThreshold ? amount * (settings.commissionRate / 100) : 0;
        
        const newTx = {
          id: Date.now().toString(),
          referrerName: newTxReferrer,
          buyerWallet: newTxBuyer.trim(),
          amountPurchased: amount,
          usdValue: usdValue,
          commission: commission,
          meetsThreshold: meetsThreshold,
          thresholdAtTime: settings.minThreshold || 250,
          status: meetsThreshold ? 'unpaid' : 'below_threshold',
          date: new Date().toISOString(),
          paidTxHash: null
        };
        
        const updated = [newTx, ...transactions];
        setTransactions(updated);
        await saveData({ transactions: updated });
        setNewTxReferrer('');
        setNewTxBuyer('');
        setNewTxAmount('');
        setNewTxUsdValue('');
        setShowAddTransaction(false);
      };
      
      const updateCommissionRate = async (rate) => {
        const updated = { ...settings, commissionRate: rate };
        setSettings(updated);
        await saveData({ settings: updated });
      };
      
      const updateMinThreshold = async (threshold) => {
        const updated = { ...settings, minThreshold: threshold };
        setSettings(updated);
        await saveData({ settings: updated });
      };
      
      const updateAutoPay = async (enabled) => {
        const updated = { ...settings, autoPay: enabled };
        setSettings(updated);
        await saveData({ settings: updated });
      };
      
      const saveVaultWallet = async () => {
        await saveData({ vaultWallet });
        if (vaultPrivateKey) {
          localStorage.setItem('commission_vault_key', vaultPrivateKey);
        }
        setShowVaultSettings(false);
        loadVaultBalance();
      };
      
      const toggleSelectTx = (id) => {
        const newSelected = new Set(selectedTxs);
        if (newSelected.has(id)) {
          newSelected.delete(id);
        } else {
          newSelected.add(id);
        }
        setSelectedTxs(newSelected);
      };
      
      const selectAllUnpaid = () => {
        const unpaidIds = transactions.filter(t => t.status === 'unpaid').map(t => t.id);
        setSelectedTxs(new Set(unpaidIds));
      };
      
      const payCommission = async (txId) => {
        const tx = transactions.find(t => t.id === txId);
        if (!tx || tx.status === 'paid') return;
        
        const referrer = referrers[tx.referrerName];
        if (!referrer) {
          alert(`Referrer "${tx.referrerName}" not found!`);
          return;
        }
        
        if (!vaultPrivateKey) {
          alert('Vault private key not set! Go to Vault Settings.');
          return;
        }
        
        setPayingTx(txId);
        setPaymentStatus({ ...paymentStatus, [txId]: 'pending' });
        
        try {
          const provider = new ethers.JsonRpcProvider('https://rpc.pulsechain.com');
          const wallet = new ethers.Wallet(vaultPrivateKey, provider);
          
          // ERC20 transfer
          const erc20Abi = ['function transfer(address to, uint256 amount) returns (bool)'];
          const contract = new ethers.Contract(PTGC_CONTRACT, erc20Abi, wallet);
          
          const amountWei = ethers.parseEther(tx.commission.toString());
          const txResponse = await contract.transfer(referrer.wallet, amountWei);
          
          setPaymentStatus({ ...paymentStatus, [txId]: 'confirming' });
          const receipt = await txResponse.wait();
          
          // Update transaction as paid
          const updated = transactions.map(t => 
            t.id === txId 
              ? { ...t, status: 'paid', paidTxHash: receipt.hash, paidDate: new Date().toISOString() }
              : t
          );
          setTransactions(updated);
          await saveData({ transactions: updated });
          
          setPaymentStatus({ ...paymentStatus, [txId]: 'success' });
          loadVaultBalance(); // Refresh balance
        } catch (e) {
          console.error('Payment failed:', e);
          setPaymentStatus({ ...paymentStatus, [txId]: 'error' });
          alert('Payment failed: ' + e.message);
        }
        
        setPayingTx(null);
      };
      
      const paySelected = async () => {
        if (selectedTxs.size === 0) return;
        if (!confirm(`Pay ${selectedTxs.size} commission(s)?`)) return;
        
        for (const txId of selectedTxs) {
          await payCommission(txId);
        }
        setSelectedTxs(new Set());
      };
      
      const markAsPaid = async (txId, txHash = 'manual') => {
        const updated = transactions.map(t => 
          t.id === txId 
            ? { ...t, status: 'paid', paidTxHash: txHash, paidDate: new Date().toISOString() }
            : t
        );
        setTransactions(updated);
        await saveData({ transactions: updated });
      };
      
      const deleteTransaction = async (txId) => {
        if (!confirm('Delete this transaction?')) return;
        const updated = transactions.filter(t => t.id !== txId);
        setTransactions(updated);
        await saveData({ transactions: updated });
      };
      
      // Format helpers
      const fmt = (num) => {
        if (num === null || num === undefined || isNaN(num)) return '—';
        if (num >= 1e9) return (num/1e9).toFixed(2) + 'B';
        if (num >= 1e6) return (num/1e6).toFixed(2) + 'M';
        if (num >= 1e3) return (num/1e3).toFixed(2) + 'K';
        return num.toFixed(2);
      };
      
      const truncAddr = (addr) => addr ? `${addr.slice(0,6)}...${addr.slice(-4)}` : '';
      
      const filteredTxs = transactions.filter(t => {
        if (filter === 'unpaid') return t.status === 'unpaid';
        if (filter === 'paid') return t.status === 'paid';
        if (filter === 'disqualified') return t.status === 'below_threshold';
        return true;
      });
      
      const totalUnpaid = transactions.filter(t => t.status === 'unpaid').reduce((sum, t) => sum + t.commission, 0);
      const totalPaid = transactions.filter(t => t.status === 'paid').reduce((sum, t) => sum + t.commission, 0);
      const totalDisqualified = transactions.filter(t => t.status === 'below_threshold').length;
      
      // Theme colors
      const pc = '#D9CA5D';
      const pcRgb = '217,202,93';
      
      // Login screen
      if (!authenticated) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-yellow-900/30 via-black to-black flex items-center justify-center p-4">
            <div className="w-full max-w-sm">
              <div className="bg-gradient-to-br from-gray-900/80 to-black/80 border border-[#D9CA5D]/30 rounded-2xl p-8 shadow-2xl">
                <div className="text-center mb-8">
                  <div className="text-4xl mb-3">💰</div>
                  <h1 className="font-orbitron font-bold text-xl text-[#D9CA5D]">Commission Manager</h1>
                  <p className="text-gray-500 text-xs mt-1">PTGC Affiliate Program</p>
                </div>
                
                <form onSubmit={handleLogin}>
                  <div className="mb-4">
                    <input
                      type="password"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="Enter password"
                      className="w-full px-4 py-3 bg-black/50 border border-[#D9CA5D]/30 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-[#D9CA5D]/60 transition-colors"
                      autoFocus
                    />
                  </div>
                  
                  {authError && (
                    <div className="mb-4 text-red-400 text-sm text-center">
                      Incorrect password
                    </div>
                  )}
                  
                  <button
                    type="submit"
                    className="w-full py-3 bg-gradient-to-r from-[#D9CA5D]/80 to-[#D9CA5D] hover:from-[#D9CA5D] hover:to-[#E5D56A] text-black font-semibold rounded-xl transition-all"
                  >
                    Enter
                  </button>
                  
                  <button
                    type="button"
                    onClick={onBack}
                    className="w-full mt-3 py-2 text-gray-500 hover:text-white text-sm transition-colors"
                  >
                    ← Back to Dashboard
                  </button>
                </form>
              </div>
            </div>
          </div>
        );
      }
      
      // Loading screen
      if (loading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-yellow-900/30 via-black to-black flex items-center justify-center">
            <div className="text-center">
              <div className="text-4xl mb-4 animate-pulse">💰</div>
              <div className="text-gray-400">Loading commission data...</div>
            </div>
          </div>
        );
      }
      
      return (
        <div className="min-h-screen bg-gradient-to-br from-yellow-900/30 via-black to-black text-white">
          {/* Header */}
          <header className="border-b border-[#D9CA5D]/20 bg-black/30">
            <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
              <div className="flex items-center gap-4">
                <button onClick={onBack} className="text-gray-400 hover:text-white flex items-center gap-1">
                  <Icon name="chevron-left" size={16}/>
                  <span className="text-sm">Back</span>
                </button>
                <div className="h-8 w-px bg-white/20"/>
                <div className="flex items-center gap-3">
                  <span className="text-3xl">💰</span>
                  <div>
                    <h1 className="font-orbitron font-bold text-xl text-[#D9CA5D]">Commission Manager</h1>
                    <p className="text-gray-500 text-xs">PTGC Affiliate Program</p>
                  </div>
                </div>
              </div>
              
              {saving && (
                <div className="flex items-center gap-2 text-[#D9CA5D] text-sm">
                  <div className="w-4 h-4 border-2 border-[#D9CA5D] border-t-transparent rounded-full animate-spin"/>
                  Saving...
                </div>
              )}
            </div>
          </header>
          
          <main className="max-w-6xl mx-auto px-6 py-6">
            {/* Top Controls */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              {/* Vault Card */}
              <div className="bg-gradient-to-br from-[#D9CA5D]/10 to-black/40 border border-[#D9CA5D]/30 rounded-xl p-4">
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🏦</span>
                    <span className="text-sm font-semibold text-[#D9CA5D]">VAULT</span>
                  </div>
                  <button 
                    onClick={() => setShowVaultSettings(true)}
                    className="text-xs text-gray-400 hover:text-white"
                  >
                    ⚙️ Settings
                  </button>
                </div>
                {vaultWallet ? (
                  <>
                    <div className="text-xs text-gray-500 mb-1">{truncAddr(vaultWallet)}</div>
                    <div className="text-2xl font-bold text-white">{fmt(vaultBalance)} <span className="text-sm text-[#D9CA5D]">PTGC</span></div>
                    <button 
                      onClick={loadVaultBalance}
                      className="text-xs text-gray-500 hover:text-[#D9CA5D] mt-1"
                    >
                      ↻ Refresh
                    </button>
                  </>
                ) : (
                  <div className="text-gray-500 text-sm">No vault configured</div>
                )}
              </div>
              
              {/* Commission Rate Card */}
              <div className="bg-gradient-to-br from-[#D9CA5D]/10 to-black/40 border border-[#D9CA5D]/30 rounded-xl p-4">
                <div className="flex items-center gap-2 mb-3">
                  <span className="text-xl">📊</span>
                  <span className="text-sm font-semibold text-[#D9CA5D]">COMMISSION RATE</span>
                </div>
                <select
                  value={settings.commissionRate}
                  onChange={(e) => updateCommissionRate(parseInt(e.target.value))}
                  className="w-full bg-black/50 border border-[#D9CA5D]/30 rounded-lg px-3 py-2 text-xl font-bold text-white focus:outline-none focus:border-[#D9CA5D]"
                >
                  <option value={1}>1%</option>
                  <option value={2}>2%</option>
                  <option value={3}>3%</option>
                  <option value={4}>4%</option>
                  <option value={5}>5%</option>
                </select>
                <div className="text-xs text-gray-500 mt-2">Applied to new transactions</div>
              </div>
              
              {/* Minimum Threshold Card */}
              <div className="bg-gradient-to-br from-[#D9CA5D]/10 to-black/40 border border-[#D9CA5D]/30 rounded-xl p-4">
                <div className="flex items-center gap-2 mb-3">
                  <span className="text-xl">🎯</span>
                  <span className="text-sm font-semibold text-[#D9CA5D]">MIN THRESHOLD</span>
                </div>
                <select
                  value={settings.minThreshold || 250}
                  onChange={(e) => updateMinThreshold(parseFloat(e.target.value))}
                  className="w-full bg-black/50 border border-[#D9CA5D]/30 rounded-lg px-3 py-2 text-xl font-bold text-white focus:outline-none focus:border-[#D9CA5D]"
                >
                  <option value={100}>$100</option>
                  <option value={250}>$250</option>
                  <option value={500}>$500</option>
                  <option value={1000}>$1,000</option>
                  <option value={2000}>$2,000</option>
                </select>
                <div className="text-xs text-gray-500 mt-2">Min purchase to qualify</div>
              </div>
              
              {/* Auto-Pay Card */}
              <div className="bg-gradient-to-br from-[#D9CA5D]/10 to-black/40 border border-[#D9CA5D]/30 rounded-xl p-4">
                <div className="flex items-center gap-2 mb-3">
                  <span className="text-xl">⚡</span>
                  <span className="text-sm font-semibold text-[#D9CA5D]">AUTO-PAY</span>
                </div>
                <button
                  onClick={() => updateAutoPay(!settings.autoPay)}
                  className={`w-full py-3 rounded-lg font-bold transition-all ${
                    settings.autoPay 
                      ? 'bg-green-500/20 border border-green-500/50 text-green-400' 
                      : 'bg-gray-800 border border-gray-700 text-gray-400'
                  }`}
                >
                  {settings.autoPay ? '✓ ENABLED' : 'DISABLED'}
                </button>
                <div className="text-xs text-gray-500 mt-2">
                  {settings.autoPay ? 'Commissions paid automatically' : 'Manual payment required'}
                </div>
              </div>
            </div>
            
            {/* Summary Stats */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
              <div className="bg-black/30 border border-white/10 rounded-xl p-4 text-center">
                <div className="text-gray-500 text-xs mb-1">Referrers</div>
                <div className="text-2xl font-bold text-white">{Object.keys(referrers).length}</div>
              </div>
              <div className="bg-black/30 border border-white/10 rounded-xl p-4 text-center">
                <div className="text-gray-500 text-xs mb-1">Transactions</div>
                <div className="text-2xl font-bold text-white">{transactions.length}</div>
              </div>
              <div className="bg-black/30 border border-red-500/20 rounded-xl p-4 text-center">
                <div className="text-red-400 text-xs mb-1">Total Owed</div>
                <div className="text-2xl font-bold text-red-400">{fmt(totalUnpaid)}</div>
              </div>
              <div className="bg-black/30 border border-green-500/20 rounded-xl p-4 text-center">
                <div className="text-green-400 text-xs mb-1">Total Paid</div>
                <div className="text-2xl font-bold text-green-400">{fmt(totalPaid)}</div>
              </div>
            </div>
            
            {/* Referrers Section */}
            <div className="bg-black/30 border border-white/10 rounded-xl p-4 mb-6">
              <div className="flex items-center justify-between mb-4">
                <h2 className="font-semibold text-white flex items-center gap-2">
                  <span>👥</span> Referrers Registry
                </h2>
                <button
                  onClick={() => setShowAddReferrer(true)}
                  className="px-3 py-1.5 bg-[#D9CA5D]/20 hover:bg-[#D9CA5D]/30 text-[#D9CA5D] rounded-lg text-sm font-semibold transition-all"
                >
                  + Add Referrer
                </button>
              </div>
              
              {Object.keys(referrers).length === 0 ? (
                <div className="text-center py-8 text-gray-500">
                  No referrers registered yet
                </div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="text-gray-500 border-b border-white/10">
                        <th className="text-left py-2 px-3">Name</th>
                        <th className="text-left py-2 px-3">Wallet</th>
                        <th className="text-left py-2 px-3">Added</th>
                        <th className="text-right py-2 px-3">Earned</th>
                        <th className="text-right py-2 px-3">Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      {Object.entries(referrers).map(([name, data]) => {
                        const earned = transactions
                          .filter(t => t.referrerName === name && t.status === 'paid')
                          .reduce((sum, t) => sum + t.commission, 0);
                        const pending = transactions
                          .filter(t => t.referrerName === name && t.status === 'unpaid')
                          .reduce((sum, t) => sum + t.commission, 0);
                        return (
                          <tr key={name} className="border-b border-white/5 hover:bg-white/5">
                            <td className="py-3 px-3 font-semibold text-[#D9CA5D]">{name}</td>
                            <td className="py-3 px-3">
                              <code className="text-gray-400 text-xs">{truncAddr(data.wallet)}</code>
                            </td>
                            <td className="py-3 px-3 text-gray-500 text-xs">
                              {new Date(data.addedDate).toLocaleDateString()}

                            <td className="py-3 px-3 text-right">
                              <span className="text-green-400">{fmt(earned)}</span>
                              {pending > 0 && (
                                <span className="text-gray-500 ml-1">(+{fmt(pending)} pending)</span>
                              )}
                            </td>
                            <td className="py-3 px-3 text-right">
                              <button
                                onClick={() => removeReferrer(name)}
                                className="text-red-400 hover:text-red-300 text-xs"
                              >
                                Remove
                              </button>
                            </td>

                        );
                      })}

            </div>
            
            {/* Transactions Section - Current Month */}
            <div className="bg-black/30 border border-white/10 rounded-xl p-4">
              <div className="flex items-center justify-between mb-4 flex-wrap gap-3">

                  <span>📋</span> Commission Log
                  <span className="px-2 py-0.5 bg-[#D9CA5D]/20 text-[#D9CA5D] rounded text-xs font-bold">
                    {new Date(currentMonth + '-01').toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}
                  </span>
                </h2>
                <div className="flex items-center gap-2">
                  {/* Filter */}
                  <select
                    value={filter}
                    onChange={(e) => setFilter(e.target.value)}
                    className="bg-black/50 border border-white/20 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none"
                  >
                    <option value="all">All ({transactions.length})</option>
                    <option value="unpaid">Unpaid ({transactions.filter(t => t.status === 'unpaid').length})</option>
                    <option value="paid">Paid ({transactions.filter(t => t.status === 'paid').length})</option>
                    <option value="disqualified">Below Threshold ({transactions.filter(t => t.status === 'below_threshold').length})</option>
                  </select>
                  
                  <button
                    onClick={selectAllUnpaid}
                    className="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-white rounded-lg text-sm transition-all"
                  >
                    Select Unpaid
                  </button>
                  
                  <button

                    disabled={selectedTxs.size === 0 || !vaultPrivateKey}

                    }`}
                  >
                    Pay Selected ({selectedTxs.size})
                  </button>

      const [invData, setInvData] = useState(null);
      const [ufoPrice, setUfoPrice] = useState(null);
      const [ufoTotalBurned, setUfoTotalBurned] = useState({ amount: 0, percent: 0, loading: true });
      const [plsPrice, setPlsPrice] = useState(null);
      const [apyPeriod, setApyPeriod] = useState('lifetime');
      const [rewardsPeriod, setRewardsPeriod] = useState('lifetime');
      const [burnPeriod, setBurnPeriod] = useState('lifetime');
      const [volumePeriod, setVolumePeriod] = useState('daily');
      const [tokenVolume, setTokenVolume] = useState({ daily: 0, weekly: 0, monthly: 0, lifetime: 0 });
      const [lpSortBy, setLpSortBy] = useState('volume'); // 'ratio', 'volume', 'liquidity', 'change'
      const [lpSortDir, setLpSortDir] = useState('desc');
      const [showSmartPicks, setShowSmartPicks] = useState(false);
      const [showArbScanner, setShowArbScanner] = useState(false);
      const [showKPIReport, setShowKPIReport] = useState(false);
      const [showDualKPI, setShowDualKPI] = useState(false);
      const [showForceTriggerModal, setShowForceTriggerModal] = useState(false);
      const [forceTriggerStatus, setForceTriggerStatus] = useState({ loading: false, error: null, success: false });
      const [historicalChanges, setHistoricalChanges] = useState({ mcap: {}, liquidity: {} });
      const [mcapPeriod, setMcapPeriod] = useState('d1'); // d1, d7, d30
      const [liqPeriod, setLiqPeriod] = useState('d1'); // d1, d7, d30
      const theme = token.theme;
      
      // Set data-theme on html element for themed scrollbar
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', token.name.toLowerCase());
        return () => document.documentElement.removeAttribute('data-theme');
      }, [token.name]);
      
      // LP Portfolio tracking (only for XYZ and FLEET)
      const lpWalletAddress = LP_TRACKER_WALLETS[token.name] || null;
      const { 
        positions: lpPositions, 
        loading: lpLoading, 
        error: lpError, 
        lastUpdated: lpLastUpdated, 
        newDepositsFound: lpNewDeposits,
        refetch: refetchLP 
      } = useLPPortfolio(token.name, pairs, lpWalletAddress);
      
      // Arb Scanner
      const { 
        opportunities: arbOpportunities, 
        pairDistances: arbDistances, 
        loading: arbLoading, 
        scan: scanArb,
        bestRoute: arbBestRoute
      } = useArbScanner(pairs, token, plsPrice);
      
      // Contract balance (accumulated fees waiting to be distributed)
      // Only for tokens with rewards tracking (XYZ and FLEET)
      const { 
        balance: contractBalance, 
        usdValue: contractBalanceUsd, 
        loading: contractBalanceLoading,
        refetch: refetchContractBalance 
      } = useContractBalance(
        token.hasRewardsTracking ? token.contract : null, 
        data?.price,
        token.hasRewardsTracking
      );
      
      // Calculate total invested from LP positions (for APY calculation)
      const lpTotalInvested = useMemo(() => {
        if (!lpPositions || lpPositions.length === 0) return 0;
        return lpPositions.reduce((sum, p) => sum + (p.initialValueUsd || 0), 0);
      }, [lpPositions]);
      
      // Get earliest deposit date for APY calculation
      const lpEarliestDate = useMemo(() => {
        if (!lpPositions || lpPositions.length === 0) return null;
        const dates = lpPositions.map(p => p.depositDate).filter(d => d);
        return dates.length > 0 ? Math.min(...dates) : null;
      }, [lpPositions]);
      
      // Fetch historical volume data from GeckoTerminal
      const { historicalData, loading: histLoading } = useHistoricalVolume(pairs, token.name);
      
      // Calculate opportunity scores for Smart Picks
      const { scores: opportunityScores, loading: scoresLoading } = useOpportunityScores(pairs, historicalData, token.name);
      
      // Calculate total volume by period using historical data
      // Note: 24h comes from DexScreener (real-time), 7/30/90d from GeckoTerminal (historical)
      // Historical data may not include today, so we ensure longer periods >= shorter periods
      const volumeByPeriod = useMemo(() => {
        // Always use DexScreener's live 24h volume for daily (more accurate/real-time)
        let daily = 0;
        for (const pair of pairs) {
          daily += pair.volume24h || 0;
        }
        
        if (!historicalData || Object.keys(historicalData).length === 0) {
          return { daily, weekly: daily, monthly: daily, lifetime: daily };
        }
        
        let weekly = 0, monthly = 0, lifetime = 0;
        
        for (const pairAddr of Object.keys(historicalData)) {
          const pairData = historicalData[pairAddr];
          weekly += pairData['7']?.volume || 0;
          monthly += pairData['30']?.volume || 0;
          lifetime += pairData['90']?.volume || 0;
        }
        
        // Ensure logical consistency: longer periods should always be >= shorter periods
        // This handles cases where historical data doesn't include today's volume yet
        weekly = Math.max(weekly, daily);
        monthly = Math.max(monthly, weekly);
        lifetime = Math.max(lifetime, monthly);
        
        return { daily, weekly, monthly, lifetime };
      }, [pairs, historicalData]);
      
      // Get ACTUAL rewards data from blockchain (PLS sent to dev wallet)
      const rewards = useRewardsTracker(
        token.hasRewardsTracking ? token.contract : null, 
        token.devWallet, 
        token.name
      );
      // Get ACTUAL burn data from blockchain
      const burns = useBurnTracker(token.hasRewardsTracking ? token.contract : null, token.devWallet, token.name);
      
      // For UFO card: track burns from XYZ and FLEET specifically
      const xyzBurns = useBurnTracker(
        token.name === 'UFO' ? TOKENS.XYZ.contract : null,
        token.name === 'UFO' ? TOKENS.XYZ.devWallet : null,
        'XYZ'
      );
      const fleetBurns = useBurnTracker(
        token.name === 'UFO' ? TOKENS.FLEET.contract : null,
        token.name === 'UFO' ? TOKENS.FLEET.devWallet : null,
        'FLEET'
      );

      useEffect(() => { setInvData(InvestmentStore.load(token.name)); }, [token.name]);
      const saveInv = (d) => { InvestmentStore.save(token.name, d); setInvData(d); };

      const { highPairs, lowPairs, topThree, treasuryTotal } = useMemo(() => {
        // pairs have liquidity stored as a number directly
        // Include pairs with >= MIN_LIQUIDITY OR pairs from GitHub (user has invested in them)
        const high = pairs.filter(p => (p.liquidity || 0) >= MIN_LIQUIDITY || p._source === 'github' || p._source === 'geckoterminal' || p._source === 'dexscreener-enriched');
        const low = pairs.filter(p => (p.liquidity || 0) < MIN_LIQUIDITY && p._source !== 'github' && p._source !== 'geckoterminal' && p._source !== 'dexscreener-enriched');
        
        // Add ratio to all high pairs and sort by ratio for topThree determination
        const withRatio = high.map(p => {
          const vol = p.volume24h || 0;
          const liq = p.liquidity || 1;
          const change = p.priceChange?.h24 || 0;
          return {...p, ratio: vol/liq, change24h: change};
        });
        
        // TopThree is always by ratio (for the medals)
        const sortedByRatio = [...withRatio].sort((a,b) => b.ratio - a.ratio);
        
        // Sort for display based on user selection
        const sortedForDisplay = [...withRatio].sort((a, b) => {
          let aVal, bVal;
          switch(lpSortBy) {
            case 'volume': aVal = a.volume24h || 0; bVal = b.volume24h || 0; break;
            case 'liquidity': aVal = a.liquidity || 0; bVal = b.liquidity || 0; break;
            case 'change': aVal = a.change24h || 0; bVal = b.change24h || 0; break;
            default: aVal = a.ratio; bVal = b.ratio;
          }
          return lpSortDir === 'desc' ? bVal - aVal : aVal - bVal;
        });
        
        // Calculate treasury total (half of each pool's liquidity = the paired token side)
        const treasury = high.reduce((sum, p) => sum + ((p.liquidity || 0) / 2), 0);
        return { 
          highPairs: sortedForDisplay, 
          lowPairs: low, 
          topThree: sortedByRatio.slice(0,3).map(p => p.pairAddress), 
          treasuryTotal: treasury 
        };
      }, [pairs, lpSortBy, lpSortDir]);

      const fetch_ = async () => {
        if(token.contract==='Coming Soon') { setLoading(false); return; }
        setLoading(true); setError(null);
        try {
          let mainPairData = null;
          if(token.pairAddress) {
            try {
              const pairRes = await fetch(`https://api.dexscreener.com/latest/dex/pairs/pulsechain/${token.pairAddress}`);
              const pairData = await pairRes.json();
              if(pairData.pair) mainPairData = pairData.pair;
            } catch(e) {}
          }

          const [res, wRes] = await Promise.all([
            fetch(`https://api.dexscreener.com/latest/dex/tokens/${token.contract}`),
            fetch('https://api.dexscreener.com/latest/dex/tokens/0xA1077a294dDE1B09bB078844df40758a5D0f9a27')
          ]);
          const [d, wd] = await Promise.all([res.json(), wRes.json()]);
          if(wd.pairs?.length) { 
            const wp=wd.pairs.find(p=>p.chainId==='pulsechain'); 
            if(wp) {
              const price = parseFloat(wp.priceUsd||0);
              setWpls(price);
              setPlsPrice(price);
            }
          }
          
          // Fetch UFO price for burn value calculation
          try {
            const ufoRes = await fetch(`https://api.dexscreener.com/latest/dex/pairs/pulsechain/${UFO_PAIR_ADDRESS}`);
            const ufoData = await ufoRes.json();
            if(ufoData.pair) setUfoPrice(parseFloat(ufoData.pair.priceUsd || 0));
          } catch(e) {}
          
          // Fetch total UFO burned from burn address (only for UFO card)
          if (token.name === 'UFO') {
            try {
              const BURN_ADDRESS = '0x0000000000000000000000000000000000000369';
              const UFO_TOTAL_SUPPLY = 999999999051; // ~1 billion UFO total supply (999,999,999,051)
              
              // Get UFO balance of burn address
              const burnBalanceRes = await fetch(PULSECHAIN_RPC, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  jsonrpc: '2.0',
                  method: 'eth_call',
                  params: [{
                    to: UFO_TOKEN,
                    data: '0x70a08231000000000000000000000000' + BURN_ADDRESS.slice(2).toLowerCase()
                  }, 'latest'],
                  id: 1
                })
              });
              const burnBalanceData = await burnBalanceRes.json();
              if (burnBalanceData.result) {
                const burnedAmount = parseInt(burnBalanceData.result, 16) / 1e18;
                const burnedPercent = (burnedAmount / UFO_TOTAL_SUPPLY) * 100;
                setUfoTotalBurned({ amount: burnedAmount, percent: burnedPercent, loading: false });
              }
            } catch(e) {
              console.error('Failed to fetch UFO burn stats:', e);
              setUfoTotalBurned(prev => ({ ...prev, loading: false }));
            }
          }
          if(d.pairs?.length) {
            const pc = d.pairs.filter(p=>p.chainId==='pulsechain');
            const totLiq = pc.reduce((s,p)=>s+(p.liquidity?.usd||0),0);
            const totVol = pc.reduce((s,p)=>s+(p.volume?.h24||0),0);
            const main = mainPairData || [...pc].sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0))[0];
            
            // Calculate liquidity change from stored value
            let liqChange = 0;
            try {
              const liqKey = `proweb_liq_${token.name}`;
              const stored = localStorage.getItem(liqKey);
              if (stored) {
                const { liq: oldLiq, time } = JSON.parse(stored);
                const hoursSince = (Date.now() - time) / 3600000;
                if (oldLiq > 0) {
                  liqChange = ((totLiq - oldLiq) / oldLiq) * 100;
                }
                // Update stored value every hour
                if (hoursSince >= 1) {
                  localStorage.setItem(liqKey, JSON.stringify({ liq: totLiq, time: Date.now() }));
                }
              } else {
                localStorage.setItem(liqKey, JSON.stringify({ liq: totLiq, time: Date.now() }));
              }
            } catch(e) {}
            
            // Calculate 24h volume change from historical data
            let volChange = 0;
            try {
              const hist = HistoricalDataStore.getHistory(token.name);
              const dates = Object.keys(hist).sort().reverse();
              if (dates.length >= 2) {
                // Yesterday's total volume
                const yesterday = dates[1];
                let yesterdayVol = 0;
                Object.values(hist[yesterday] || {}).forEach(p => { yesterdayVol += p.vol || 0; });
                if (yesterdayVol > 0) {
                  volChange = ((totVol - yesterdayVol) / yesterdayVol) * 100;
                }
              }
            } catch(e) {}
            
            setData({ 
              price: parseFloat(main?.priceUsd||0), 
              change: main?.priceChange?.h24||0, 
              liq: totLiq, 
              liqChange: liqChange,
              mcap: main?.marketCap || main?.fdv || 0, 
              vol: totVol,
              volChange: volChange
            });
            
            // Set volume data for rewards calculations
            // Note: Only 24h is actual, others are estimates
            setTokenVolume({
              daily: totVol,
              weekly: totVol * 7,
              monthly: totVol * 30,
              lifetime: totVol // Just use daily for lifetime estimate
            });
            
            // Store pairs with their liquidity values properly
            // Filter out pairs with missing token symbols, or try to enrich them
            const dexScreenerPairs = pc.map(p=>({
              ...p, 
              volume24h: p.volume?.h24 || 0, 
              liquidity: p.liquidity?.usd || 0,
              _source: 'dexscreener'
            }));
            
            // Separate complete pairs from incomplete ones
            const completePairs = dexScreenerPairs.filter(p => 
              p.baseToken?.symbol && p.baseToken.symbol !== '?' &&
              p.quoteToken?.symbol && p.quoteToken.symbol !== '?'
            );
            const incompletePairs = dexScreenerPairs.filter(p => 
              !p.baseToken?.symbol || p.baseToken.symbol === '?' ||
              !p.quoteToken?.symbol || p.quoteToken.symbol === '?'
            );
            
            // Set complete pairs immediately so UI loads fast
            setPairs(completePairs);
            setHist(HistoricalDataStore.saveSnapshot(token.name, pc));
            
            // Save snapshot and calculate historical changes
            (async () => {
              try {
                const mcap = main?.marketCap || main?.fdv || 0;
                const tokenData = await HistoricalDataStorage.addSnapshot(token.name, mcap, totLiq, parseFloat(main?.priceUsd || 0));
                const changes = HistoricalDataStorage.getChanges(tokenData, mcap, totLiq);
                setHistoricalChanges(changes);
                console.log(`Historical changes for ${token.name}:`, changes);
              } catch (e) {
                console.warn('Failed to save/calculate historical data:', e);
              }
            })();
            
            // Then enrich incomplete pairs and check GitHub for additional pairs (runs async, won't block)
            (async () => {
              try {
                // First, try to enrich incomplete DexScreener pairs with GeckoTerminal data
                if (incompletePairs.length > 0) {
                  console.log(`Enriching ${incompletePairs.length} incomplete pairs from GeckoTerminal...`);
                  const enrichedPairs = [];
                  
                  for (const pair of incompletePairs) {
                    if (!pair.pairAddress) continue;
                    const enriched = await fetchPairFromGeckoTerminal(pair.pairAddress);
                    if (enriched && enriched.baseToken?.symbol !== '?' && enriched.quoteToken?.symbol !== '?') {
                      // Merge: keep DexScreener's liquidity/volume (more reliable), use GeckoTerminal's token info
                      enrichedPairs.push({
                        ...enriched,
                        volume24h: pair.volume24h || enriched.volume24h,
                        liquidity: pair.liquidity || enriched.liquidity,
                        _source: 'dexscreener-enriched'
                      });
                      console.log(`  ✓ Enriched ${enriched.baseToken.symbol}/${enriched.quoteToken.symbol}`);
                    }
                    await new Promise(r => setTimeout(r, 150));
                  }
                  
                  if (enrichedPairs.length > 0) {
                    setPairs(prev => [...prev, ...enrichedPairs]);
                  }
                }
                
                // Then check GitHub for additional pairs
                const { data: githubData } = await GitHubStorage.read();
                const savedPairs = githubData[token.name] || {};
                const savedPairAddresses = Object.keys(savedPairs);
                
                if (savedPairAddresses.length === 0) return;
                
                // Find pairs in GitHub but not in DexScreener (check against ALL dexscreener pairs, both complete and incomplete)
                const allDexAddresses = new Set([...completePairs, ...incompletePairs].map(p => p.pairAddress?.toLowerCase()));
                const missingAddresses = savedPairAddresses.filter(addr => !allDexAddresses.has(addr.toLowerCase()));
                
                if (missingAddresses.length === 0) return;
                
                console.log(`Found ${missingAddresses.length} pairs in GitHub not in DexScreener, fetching from GeckoTerminal...`);
                
                // Fetch missing pairs from GeckoTerminal
                const additionalPairs = [];
                for (const addr of missingAddresses) {
                  const pairData = await fetchPairFromGeckoTerminal(addr);
                  if (pairData) {
                    additionalPairs.push(pairData);
                    console.log(`  ✓ Fetched ${pairData.baseToken.symbol}/${pairData.quoteToken.symbol} from GeckoTerminal`);
                  } else {
                    // If GeckoTerminal fails, create minimal pair from GitHub data
                    const savedPair = savedPairs[addr];
                    if (savedPair && savedPair.deposits?.length > 0) {
                      const deposit = savedPair.deposits[0];
                      additionalPairs.push({
                        pairAddress: addr,
                        chainId: 'pulsechain',
                        url: `https://dexscreener.com/pulsechain/${addr}`,
                        baseToken: { symbol: token.name, address: token.contract },
                        quoteToken: { symbol: deposit.otherSymbol || '?', address: deposit.otherAddr || '' },
                        volume24h: 0,
                        liquidity: 0, // Unknown but still show in lists
                        priceChange: { h24: 0 },
                        _source: 'github'
                      });
                      console.log(`  ⚠ Using GitHub data for ${token.name}/${deposit.otherSymbol} (no live data)`);
                    }
                  }
                  // Small delay to avoid rate limiting
                  await new Promise(r => setTimeout(r, 200));
                }
                
                // Merge additional pairs with existing
                if (additionalPairs.length > 0) {
                  setPairs(prev => {
                    const existing = new Set(prev.map(p => p.pairAddress?.toLowerCase()));
                    const newPairs = additionalPairs.filter(p => !existing.has(p.pairAddress?.toLowerCase()));
                    if (newPairs.length > 0) {
                      console.log(`Added ${newPairs.length} pairs from GitHub/GeckoTerminal`);
                      return [...prev, ...newPairs];
                    }
                    return prev;
                  });
                }
              } catch (e) {
                console.log('Error loading GitHub pairs:', e);
              }
            })();
          } else { setError('No pairs found'); }
          setUpdated(new Date());
        } catch(e) { setError('Failed to fetch data'); }
        finally { setLoading(false); }
      };

      useEffect(() => { fetch_(); const i=setInterval(fetch_,60000); return ()=>clearInterval(i); }, [token.contract]);
      
      // Reset only error and loading state when token changes (keep pairs until new data arrives)
      useEffect(() => {
        setLoading(true);
        setError(null);
      }, [token.name]);

      // Calculate PLS ratio (how many PLS = 1 token)
      const plsRatio = useMemo(() => {
        if (!data?.price || !wpls || wpls <= 0) return null;
        const ratio = data.price / wpls;
        if (ratio >= 1000) return Math.floor(ratio).toLocaleString() + 'x';
        if (ratio >= 1) return ratio.toFixed(1) + 'x';
        return ratio.toFixed(4) + 'x';
      }, [data?.price, wpls]);

      if(token.contract==='Coming Soon') {
        return (
          <div className={`min-h-screen bg-gradient-to-br ${theme.bg} text-white`}>
            <div className="relative z-10">
              <header className="border-b border-white/10 bg-black/30">
                <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between flex-wrap gap-4">
                  <div className="flex items-center gap-4">
                    <button onClick={onBack} className="text-gray-400 hover:text-white flex items-center gap-1"><Icon name="chevron-left" size={16}/><span className="text-sm">Home</span></button>
                    <div className="h-20 w-px bg-white/20"/>
                    <div className="flex items-center gap-4">
                      <div className="w-24 h-24 rounded-xl flex items-center justify-center text-5xl font-bold bg-gray-700 text-gray-300">{token.name[0]}</div>
                      <div>
                        <h1 className={`text-3xl font-bold ${theme.text} font-orbitron`}>{token.name}</h1>
                        <p className="text-gray-500 text-sm">Coming Soon</p>
                      </div>
                    </div>
                  </div>
                  <TokenNav current={token} onSelect={onSelect}/>
                </div>
              </header>
              <main className="max-w-7xl mx-auto px-6 py-6">
                <div className="text-center py-12">
                  <div className="w-32 h-32 mx-auto mb-4 rounded-xl flex items-center justify-center text-5xl font-bold bg-gray-700 text-gray-300">{token.name[0]}</div>
                  <h2 className={`text-3xl font-bold ${theme.text} font-orbitron mb-2`}>{token.name}</h2>
                  <p className="text-gray-500">Contract address coming soon</p>
                </div>
              </main>
            </div>
            <APYModal isOpen={showModal} onClose={()=>setShowModal(false)} token={token} onSave={saveInv} data={invData}/>
          </div>
        );
      }

      // If PTGC and showDAO is true, render the DAO page
      if (token.name === 'PTGC' && showDAO) {
        return <PTGCDAOPage onBack={() => setShowDAO(false)} plsPrice={plsPrice} />;
      }
      
      // If PTGC and showCommissionManager is true, render the Commission Manager
      if (token.name === 'PTGC' && showCommissionManager) {
        return <PTGCAffiliateManager onBack={() => setShowCommissionManager(false)} plsPrice={plsPrice} />;
      }

      return (
        <div className={`min-h-screen bg-gradient-to-br ${theme.bg} text-white`}>
          <div className="relative z-10">
            <header className="border-b border-white/10 bg-black/30">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between flex-wrap gap-3 sm:gap-4">
                <div className="flex items-center gap-2 sm:gap-4">
                  <button onClick={onBack} className="text-gray-400 hover:text-white flex items-center gap-1"><Icon name="chevron-left" size={16}/><span className="text-sm hidden sm:inline">Home</span></button>
                  <div className="h-12 sm:h-20 w-px bg-white/20 hidden sm:block"/>
                  <div className="flex items-center gap-2 sm:gap-4">
                    {/* Token logo - responsive size */}
                    {token.logo ? (
                      <img src={token.logo} alt={token.name} className="w-12 h-12 sm:w-24 sm:h-24 rounded-xl object-contain" onError={e=>{e.target.style.display='none';e.target.nextElementSibling.style.display='flex';}}/>
                    ) : null}
                    <div className={`w-12 h-12 sm:w-24 sm:h-24 rounded-xl items-center justify-center text-2xl sm:text-5xl font-bold ${token.logo?'hidden':'flex'}`} style={{backgroundColor:theme.primary+'30',color:theme.primary}}>{token.name[0]}</div>
                    <div>
                      <h1 className={`text-xl sm:text-3xl font-bold ${theme.text} font-orbitron`}>{token.name}</h1>
                      <div className="flex items-center gap-1 sm:gap-2 flex-wrap">
                        <code className="text-gray-500 text-xs sm:text-sm font-mono">{truncAddr(token.contract)}</code>
                        <CopyBtn text={token.contract}/>
                        {token.launchDate && (
                          <span className={`hidden sm:inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs text-gray-400 bg-white/10`}>
                            <Icon name="calendar" size={10}/>
                            {getTokenAge(token.launchDate)}
                          </span>
                        )}
                        <a href={`https://scan.pulsechain.com/address/${token.contract}`} target="_blank" rel="noopener noreferrer" className={`px-2 py-0.5 rounded text-xs ${theme.text} bg-white/10 hover:bg-white/20 flex items-center gap-1`}>
                          <span className="hidden sm:inline">Explorer</span> <Icon name="external-link" size={10}/>
                        </a>
                        {/* KPI Report button - only for PTGC and UFO */}
                        {(token.name === 'PTGC' || token.name === 'UFO') && (
                          <>
                            <button 
                              onClick={() => setShowKPIReport(true)}
                              className={`px-2 py-0.5 rounded text-xs ${theme.text} bg-white/10 hover:bg-white/20 flex items-center gap-1 ml-1`}
                            >
                              KPI Report
                            </button>
                            <button 
                              onClick={() => setShowDualKPI(true)}
                              className={`px-2 py-0.5 rounded text-xs bg-gradient-to-r from-[#D9CA5D]/80 to-[#7CFC00]/80 text-black font-semibold hover:from-[#D9CA5D] hover:to-[#7CFC00] flex items-center gap-1 ml-1`}
                            >
                              Dual KPI
                            </button>
                          </>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-2 sm:gap-3">
                  {updated && (
                    <span className="text-gray-600 text-xs hidden sm:inline">
                      Updated {updated.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}
                    </span>
                  )}

      // Generate a simple trending line based on change
      const isUp = change >= 0;
      const magnitude = Math.min(Math.abs(change), 20); // Cap at 20%
      
      // Generate 7 points trending in the direction of change
      const points = useMemo(() => {
        const pts = [];
        for (let i = 0; i < 7; i++) {
          const trend = isUp ? (i / 6) * magnitude : (1 - i / 6) * magnitude;
          const noise = (Math.sin(i * 2.5) * 3) + (Math.cos(i * 1.8) * 2);
          pts.push(15 - trend + noise);
        }
        return pts;
      }, [change, isUp, magnitude]);
      
      const pathD = points.map((y, i) => `${i === 0 ? 'M' : 'L'} ${i * 8} ${y}`).join(' ');
      
      return (
