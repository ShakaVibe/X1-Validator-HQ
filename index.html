      const isUp = change >= 0;
      
      return (
        <button onClick={()=>onSelect(token)} className={`group rounded-xl border ${theme.border} ${theme.card} p-4 transition-all hover:scale-[1.02] hover:shadow-lg text-left w-full`}>
          <div className="flex items-center gap-4">
            {/* Large Logo - centered vertically */}
            <div className="flex-shrink-0 flex items-center justify-center">
              {token.logo && !imgErr ? (
                <img src={token.logo} alt={token.name} className="w-20 h-20 sm:w-24 sm:h-24 rounded-xl object-contain" onError={()=>setImgErr(true)}/>
              ) : (
                <div className="w-20 h-20 sm:w-24 sm:h-24 rounded-xl flex items-center justify-center text-3xl sm:text-4xl font-bold" style={{backgroundColor:theme.primary+'20',color:theme.primary}}>
                  {token.name[0]}
                </div>
              )}
            </div>
            
            {/* Token Name and Contract - left side */}
            <div className="flex-1 min-w-0">
              <h4 className={`text-xl sm:text-2xl font-bold font-orbitron ${theme.text} mb-1`}>{token.name}</h4>
              <div className="flex items-center">
                <code className="text-gray-600 text-xs font-mono">{truncAddr(token.contract)}</code>
                <CopyBtn text={token.contract}/>
              </div>
            </div>
            
            {/* Price and Market Cap - right side */}
            {!coming && p ? (
              <div className="flex-shrink-0 text-right">
                <PriceDisplay price={p.price} className={`${theme.text} text-xl sm:text-2xl font-bold font-space`}/>
                <div className="text-sm sm:text-base mb-1 font-medium" style={{color: theme.primary, opacity: 0.6}}>
                  MCap: {fmtCompact(p.mcap)}
                </div>
                <div className="flex items-center justify-end gap-2">
                  <MiniSparkline change={change} color={isUp ? '#4ade80' : '#f87171'}/>
                  <span className={`text-sm font-semibold ${isUp ? 'text-green-400' : 'text-red-400'}`}>
                    {isUp ? '▲' : '▼'} {Math.abs(change).toFixed(2)}%
                  </span>
                </div>
              </div>
            ) : coming ? (
              <div className="flex-shrink-0 text-right">
                <div className="text-gray-500 text-sm">Coming Soon</div>
              </div>
            ) : null}
          </div>
        </button>
      );
    };

    const Home = ({ onSelect }) => {
      const [prices, setPrices] = useState({});
      const [tokenVolumes, setTokenVolumes] = useState({});
      const [lastUpdated, setLastUpdated] = useState(null);
      const [refreshing, setRefreshing] = useState(false);
      const [pulseVolume, setPulseVolume] = useState({
        v1: { daily: 0, weekly: 0, monthly: 0, change: 0 },
        v2: { daily: 0, weekly: 0, monthly: 0, change: 0 },
        total: { daily: 0, weekly: 0, monthly: 0, change: 0 },
        loading: true
      });
      
      // Fetch PulseChain DEX volume from DefiLlama
      const fetchPulseVolume = async () => {
        try {
          // Fetch PulseX V1 and V2 data
          const [v1Res, v2Res] = await Promise.all([
            fetch('https://api.llama.fi/summary/dexs/pulsex-v1'),
            fetch('https://api.llama.fi/summary/dexs/pulsex-v2')
          ]);
          
          const [v1Data, v2Data] = await Promise.all([v1Res.json(), v2Res.json()]);
          
          console.log('DefiLlama V1 data:', v1Data);
          console.log('DefiLlama V2 data:', v2Data);
          
          // Extract volume data with all change periods
          const v1Daily = v1Data.total24h || 0;
          const v1Weekly = v1Data.total7d || 0;
          const v1Monthly = v1Data.total30d || 0;
          const v1Change1d = v1Data.change_1d || 0;
          // Try different field names the API might use
          const v1Change7d = v1Data.change_7d || v1Data.change7d || v1Data.weeklyChange || 0;
          const v1Change1m = v1Data.change_1m || v1Data.change30d || v1Data.monthlyChange || 0;
          
          const v2Daily = v2Data.total24h || 0;
          const v2Weekly = v2Data.total7d || 0;
          const v2Monthly = v2Data.total30d || 0;
          const v2Change1d = v2Data.change_1d || 0;
          const v2Change7d = v2Data.change_7d || v2Data.change7d || v2Data.weeklyChange || 0;
          const v2Change1m = v2Data.change_1m || v2Data.change30d || v2Data.monthlyChange || 0;
          
          // If 7d/30d changes aren't available, estimate from daily average comparison
          // This compares current period's daily average to overall daily average
          const v1Change7dCalc = v1Change7d || (v1Weekly > 0 && v1Daily > 0 
            ? ((v1Daily - (v1Weekly / 7)) / (v1Weekly / 7)) * 100 
            : 0);
          const v1Change1mCalc = v1Change1m || (v1Monthly > 0 && v1Weekly > 0 
            ? ((v1Weekly / 7 - v1Monthly / 30) / (v1Monthly / 30)) * 100 
            : 0);
            
          const v2Change7dCalc = v2Change7d || (v2Weekly > 0 && v2Daily > 0 
            ? ((v2Daily - (v2Weekly / 7)) / (v2Weekly / 7)) * 100 
            : 0);
          const v2Change1mCalc = v2Change1m || (v2Monthly > 0 && v2Weekly > 0 
            ? ((v2Weekly / 7 - v2Monthly / 30) / (v2Monthly / 30)) * 100 
            : 0);
          
          // Calculate totals
          const totalDaily = v1Daily + v2Daily;
          const totalWeekly = v1Weekly + v2Weekly;
          const totalMonthly = v1Monthly + v2Monthly;
          
          // Calculate weighted average changes for each period
          const totalChange1d = totalDaily > 0 
            ? ((v1Daily * v1Change1d) + (v2Daily * v2Change1d)) / totalDaily 
            : 0;
          const totalChange7d = totalWeekly > 0 
            ? ((v1Weekly * v1Change7dCalc) + (v2Weekly * v2Change7dCalc)) / totalWeekly 
            : 0;
          const totalChange1m = totalMonthly > 0 
            ? ((v1Monthly * v1Change1mCalc) + (v2Monthly * v2Change1mCalc)) / totalMonthly 
            : 0;
          
          setPulseVolume({
            v1: { 
              daily: v1Daily, weekly: v1Weekly, monthly: v1Monthly, 
              change1d: v1Change1d, change7d: v1Change7dCalc, change1m: v1Change1mCalc 
            },
            v2: { 
              daily: v2Daily, weekly: v2Weekly, monthly: v2Monthly, 
              change1d: v2Change1d, change7d: v2Change7dCalc, change1m: v2Change1mCalc 
            },
            total: { 
              daily: totalDaily, weekly: totalWeekly, monthly: totalMonthly, 
              change1d: totalChange1d, change7d: totalChange7d, change1m: totalChange1m 
            },
            loading: false
          });
        } catch (e) {
          console.error('Error fetching PulseChain volume:', e);
          setPulseVolume(prev => ({ ...prev, loading: false }));
        }
      };
      
      const load = async () => {
        setRefreshing(true);
        const p = {};
        const vol = {};
        
        // UFO specific pair for accurate market cap (DexScreener pair endpoint has correct mcap)
        const UFO_MAIN_PAIR = '0xbeA0e55b82Eb975280041F3b49C4D0bD937b72d5';
        
        for(const [k,t] of Object.entries(TOKENS)) {
          if(t.contract!=='Coming Soon') {
            try {
              // Fetch all pairs for this token from DexScreener (single API call)
              const r = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${t.contract}`);
              const d = await r.json();
              
              if(d.pairs?.length) {
                // Filter to PulseChain pairs
                const allPairs = d.pairs.filter(x => x.chainId === 'pulsechain');
                
                if(allPairs.length) {
                  // Use highest liquidity pair for price/mcap
                  const mainPair = [...allPairs].sort((a,b) => (b.liquidity?.usd||0) - (a.liquidity?.usd||0))[0];
                  const price = parseFloat(mainPair.priceUsd||0);
                  
                  // Get market cap - prefer marketCap over fdv
                  let mcap = mainPair.marketCap || mainPair.fdv || 0;
                  let change = mainPair.priceChange?.h24 || 0;
                  let tokenPrice = price;
                  
                  // For UFO, the /tokens/ endpoint returns wrong data
                  // Fetch from specific pair endpoint which has correct marketCap and price change
                  if (k === 'UFO') {
                    try {
                      const pairRes = await fetch(`https://api.dexscreener.com/latest/dex/pairs/pulsechain/${t.pairAddress}`);
                      const pairData = await pairRes.json();
                      if (pairData.pair) {
                        mcap = pairData.pair.marketCap || pairData.pair.fdv || mcap;
                        change = pairData.pair.priceChange?.h24 || change;
                        tokenPrice = parseFloat(pairData.pair.priceUsd || tokenPrice);
                      }
                    } catch(e) {
                      console.error('Error fetching UFO pair:', e);
                    }
                  }
                  
                  p[k] = { 
                    price: tokenPrice, 
                    mcap: mcap,
                    change: change
                  };
                  
                  // Sum 24h volume across all pairs (already in DexScreener response - no extra call!)
                  let daily = 0;
                  for (const pair of allPairs) {
                    daily += parseFloat(pair.volume?.h24 || 0);
                  }
                  
                  vol[k] = { daily };
                }
              }
            } catch(e){ console.error('Error fetching', k, e); }
          }
        }
        
        setPrices(p);
        setTokenVolumes(vol);
        setLastUpdated(new Date());
        setRefreshing(false);
      };
      
      useEffect(() => {
        load();
        fetchPulseVolume();
        const i = setInterval(load, 60000);
        const v = setInterval(fetchPulseVolume, 300000); // Refresh volume every 5 mins
        return () => { clearInterval(i); clearInterval(v); };
      }, []);

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-950 via-black to-slate-950 text-white">
          <div className="relative z-10">
            <header className="border-b border-white/10 bg-black/30">
              <div className="max-w-5xl mx-auto px-6 py-3 flex items-center justify-between">
                <Logo/>
                <div className="flex items-center gap-3">
                  {lastUpdated && (
                    <span className="text-gray-600 text-xs">
                      Updated {lastUpdated.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}
                    </span>
                  )}
                  <button 
                    onClick={load} 
                    disabled={refreshing}
                    className="p-2 rounded-lg bg-white/10 hover:bg-white/20 transition-colors disabled:opacity-50"
                    title="Refresh"
                  >
                    <RefreshIcon size={18} className={`text-white ${refreshing ? 'animate-spin' : ''}`}/>
                  </button>
                </div>
              </div>
            </header>

            <main className="max-w-5xl mx-auto px-6 py-10">
              <div className="text-center mb-10">
                <h2 className="text-3xl md:text-4xl font-bold mb-3 font-orbitron">
                  <span className="text-white">Pro</span><span className="text-gray-400">Web</span>
                  <span className="text-gray-500 font-normal"> Token Analytics</span>
                </h2>
                <p className="text-gray-400">Real-time liquidity tracking, volume analysis, and LP performance</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-4xl mx-auto mb-10">
                <TokenCard token={TOKENS.PTGC} onSelect={onSelect} prices={prices}/>
                <TokenCard token={TOKENS.UFO} onSelect={onSelect} prices={prices}/>
                <TokenCard token={TOKENS.FLEET} onSelect={onSelect} prices={prices}/>
                <TokenCard token={TOKENS.XYZ} onSelect={onSelect} prices={prices}/>
              </div>
              
              {/* Volume Box */}
              <div className="max-w-sm mx-auto mb-10">
                <div className="bg-gradient-to-br from-gray-900/80 to-black/80 border border-white/10 rounded-xl px-4 py-3">
                  {/* Header Row */}
                  <div className="flex items-center justify-between mb-3">
                    <h3 className="text-base font-bold text-white">24h Volume</h3>
                  </div>
                  
                  {/* Volume Rows */}
                  <div className="space-y-0">
                    {/* PulseChain Row */}
                    <div className="flex items-center py-2 border-b border-white/5">
                      <div className="flex items-center gap-2 w-28">
                        <img 
                          src="https://dd.dexscreener.com/ds-data/tokens/pulsechain/0xa1077a294dde1b09bb078844df40758a5d0f9a27.png" 
                          alt="PLS" 
                          className="w-5 h-5 rounded-full"
                        />
                        <span className="font-semibold text-sm bg-gradient-to-r from-pink-400 to-cyan-400 bg-clip-text text-transparent">PulseChain</span>
                      </div>
                      <div className="flex-1 flex items-center justify-end gap-2 pr-2">
                        {pulseVolume.loading ? (
                          <span className="text-gray-500 text-sm">...</span>
                        ) : (
                          <>
                            <span className="text-white font-space font-bold text-sm">
                              ${(pulseVolume.total.daily / 1e6).toFixed(2)}M
                            </span>
                            {pulseVolume.total.change1d !== 0 && (
                              <span className={`text-xs font-medium ${pulseVolume.total.change1d >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                {pulseVolume.total.change1d >= 0 ? '▲' : '▼'}{Math.abs(pulseVolume.total.change1d).toFixed(1)}%
                              </span>
                            )}
                          </>
                        )}
                      </div>
                      <a 
                        href="https://defillama.com/chain/PulseChain" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="text-gray-600 hover:text-gray-400 transition-colors w-5 text-center"
                        title="View on DefiLlama"
                      >
                        <Icon name="external-link" size={12} />
                      </a>
                    </div>
                    
                    {/* Token Rows */}
                    {['PTGC', 'UFO', 'FLEET', 'XYZ'].map(tokenKey => {
                      const token = TOKENS[tokenKey];
                      const vol = tokenVolumes[tokenKey];
                      const volume = vol ? vol.daily : 0;
                      
                      const formatVol = (v) => {
                        if (!v) return '...';
                        if (v >= 1e6) return `$${(v / 1e6).toFixed(2)}M`;
                        if (v >= 1e3) return `$${(v / 1e3).toFixed(2)}K`;
                        return `$${v.toFixed(2)}`;
                      };
                      
                      return (
                        <div key={tokenKey} className="flex items-center py-2 border-b border-white/5 last:border-b-0">
                          <div className="flex items-center gap-2 w-28">
                            {token.logo ? (
                              <img 
                                src={token.logo} 
                                alt={token.name} 
                                className="w-5 h-5 rounded-full object-contain"
                              />
                            ) : (
                              <div 
                                className="w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold"
                                style={{backgroundColor: token.theme.primary + '20', color: token.theme.primary}}
                              >
                                {token.name[0]}
                              </div>
                            )}
                            <span className={`font-semibold text-sm font-orbitron ${token.theme.text}`}>{token.name}</span>
                          </div>
                          <div className="flex-1 text-right pr-2">
                            <span className="text-gray-300 font-space font-semibold text-sm">
                              {formatVol(volume)}
                            </span>
                          </div>
                          <a 
                            href={`https://dexscreener.com/pulsechain/${token.contract}`}
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="text-gray-600 hover:text-gray-400 transition-colors w-5 text-center"
                            title="View on DexScreener"
                          >
                            <Icon name="external-link" size={12} />
                          </a>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </main>

            <footer className="border-t border-white/5 mt-10">
              <div className="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
                <Logo/>
                <span className="text-gray-600 text-xs">DexScreener API • Real-time Data</span>
              </div>
            </footer>
          </div>
        </div>
      );
    };

    // Error boundary to catch rendering errors
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, info) {
        console.error('React Error:', error, info);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{padding: '20px', color: 'white', background: '#1a1a1a'}}>
              <h2 style={{color: 'red'}}>Something went wrong</h2>
              <pre style={{color: '#aaa', fontSize: '12px'}}>{this.state.error?.toString()}</pre>
              <button onClick={() => window.location.reload()} style={{marginTop: '10px', padding: '10px', cursor: 'pointer'}}>Reload</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      console.log('App loading...');
      const [sel, setSel] = useState(null);
      const [authenticated, setAuthenticated] = useState(false);
      const [password, setPassword] = useState('');
      const [error, setError] = useState(false);
      const [checking, setChecking] = useState(true);
      
      // Hash of the password (SHA-256 of "SanDiego")
      const PASS_HASH = '3937fe17477ae6bc6f7f72b358671e83a7b07bc2b00c7ec660a93083de047c37';
      
      // SHA-256 hash function
      const sha256 = async (message) => {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      };
      
      // Check sessionStorage on mount
      useEffect(() => {
        const stored = sessionStorage.getItem('proweb_auth');
        if (stored === PASS_HASH) {
          setAuthenticated(true);
        }
        setChecking(false);
      }, []);
      
      // Update scrollbar theme based on selected token
      useEffect(() => {
        const scrollbarClasses = ['scrollbar-ptgc', 'scrollbar-ufo', 'scrollbar-xyz', 'scrollbar-fleet', 'scrollbar-default'];
        scrollbarClasses.forEach(cls => document.documentElement.classList.remove(cls));
        
        if (sel) {
          const tokenName = sel.name?.toLowerCase();
          if (tokenName === 'ptgc') document.documentElement.classList.add('scrollbar-ptgc');
          else if (tokenName === 'ufo') document.documentElement.classList.add('scrollbar-ufo');
          else if (tokenName === 'xyz') document.documentElement.classList.add('scrollbar-xyz');
          else if (tokenName === 'fleet') document.documentElement.classList.add('scrollbar-fleet');
          else document.documentElement.classList.add('scrollbar-default');
        } else {
          document.documentElement.classList.add('scrollbar-default');
        }
      }, [sel]);
      
      // Handle login
      const handleLogin = async (e) => {
        e.preventDefault();
        setError(false);
        const hash = await sha256(password);
        if (hash === PASS_HASH) {
          sessionStorage.setItem('proweb_auth', PASS_HASH);
          setAuthenticated(true);
        } else {
          setError(true);
          setPassword('');
        }
      };
      
      // Show nothing while checking auth
      if (checking) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-950 via-black to-slate-950 flex items-center justify-center">
            <div className="text-gray-500">Loading...</div>
          </div>
        );
      }
      
      // Show login screen if not authenticated
      if (!authenticated) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-950 via-black to-slate-950 flex items-center justify-center p-4">
            <div className="w-full max-w-sm">
              <div className="bg-gradient-to-br from-gray-900/80 to-black/80 border border-white/10 rounded-2xl p-8 shadow-2xl">
                {/* Logo */}
                <div className="text-center mb-8">
                  <div className="inline-flex items-center gap-3">
                    <div className="relative w-12 h-12">
                      <div className="absolute inset-0 rounded-xl bg-gradient-to-br from-gray-400 to-gray-600" />
                      <div className="absolute inset-0.5 rounded-xl bg-black flex items-center justify-center">
                        <span className="font-orbitron font-black text-xl text-gray-300">P</span>
                      </div>
                    </div>
                    <div>
                      <h1 className="font-orbitron font-bold text-2xl text-white">Pro<span className="text-gray-400">Web</span></h1>
                      <p className="text-gray-600 text-xs tracking-widest">TOKEN ANALYTICS</p>
                    </div>
                  </div>
                </div>
                
                {/* Login Form */}
                <form onSubmit={handleLogin}>
                  <div className="mb-4">
                    <input
                      type="password"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="Enter password"
                      className="w-full px-4 py-3 bg-black/50 border border-white/20 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-white/40 transition-colors"
                      autoFocus
                    />
                  </div>
                  
                  {error && (
                    <div className="mb-4 text-red-400 text-sm text-center">
                      Incorrect password
                    </div>
                  )}
                  
                  <button
                    type="submit"
                    className="w-full py-3 bg-gradient-to-r from-gray-700 to-gray-800 hover:from-gray-600 hover:to-gray-700 text-white font-semibold rounded-xl transition-all"
                  >
                    Enter
                  </button>
                </form>
              </div>
            </div>
          </div>
        );
      }
      
      // Show main app if authenticated
      return sel ? <Dashboard token={sel} onBack={()=>setSel(null)} onSelect={setSel}/> : <Home onSelect={setSel}/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
  </script>
</body>
</html>
