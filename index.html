                </div>
              </div>
            </div>
          )}
        </>
      );
    };

    // Standalone KPI Card - Fetches ALL its own data independently
    const StandaloneKPICard = ({ tokenName, plsPrice, onDataLoaded }) => {
      const [loading, setLoading] = useState(true);
      const [burn24hLoading, setBurn24hLoading] = useState(true);
      const [priceData, setPriceData] = useState(null);
      const [holdersData, setHoldersData] = useState({ count: null, change24h: null });
      const [burnData, setBurnData] = useState({ total: 0, percent: 0, burn24h: null });
      const [volumeData, setVolumeData] = useState({ daily: 0, change: null });
      const [liqChange, setLiqChange] = useState(null);
      const [mcapChange, setMcapChange] = useState(null);
      const [valueGenChange, setValueGenChange] = useState(null);
      const [snapshot24hAgo, setSnapshot24hAgo] = useState(null);
      
      const BURN_ADDRESS = '0x0000000000000000000000000000000000000369';
      const PULSECHAIN_RPC = 'https://rpc.pulsechain.com';
      const UFO_PAIR_ADDRESS = '0xbeA0e55b82Eb975280041F3b49C4D0bD937b72d5';
      const KPI_SNAPSHOT_URL = 'https://raw.githubusercontent.com/ShakaVibe/shakavibe.github.io/main/kpi-snapshots.json';
      
      const TOKEN_SUPPLIES = {
        'PTGC': 333333333333,
        'UFO': 999999999051
      };
      
      const TOKEN_INFO = {
        'PTGC': {
          contract: '0x94534EeEe131840b1c0F61847c572228bdfDDE93',
          logo: './06_PTGC_V1_transparent_bg (1).png',
          fee: 0.05,
          theme: { primary: '#D9CA5D' }
        },
        'UFO': {
          contract: '0x456548A9B56eFBbD89Ca0309edd17a9E20b04018',
          logo: './07_Ufo_transparent.png',
          fee: 0.06,
          theme: { primary: '#7CFC00' }
        }
      };
      
      const info = TOKEN_INFO[tokenName];
      const totalSupply = TOKEN_SUPPLIES[tokenName];
      const pc = info.theme.primary;
      const pcRgb = pc.startsWith('#') ? `${parseInt(pc.slice(1,3),16)},${parseInt(pc.slice(3,5),16)},${parseInt(pc.slice(5,7),16)}` : '136,136,136';
      
      // Fetch ALL data on mount
      useEffect(() => {
        const fetchAllData = async () => {
          setLoading(true);
          
          // First, fetch historical snapshot from GitHub for 24h comparison
          let snapshot24h = null;
          try {
            const snapshotRes = await fetch(KPI_SNAPSHOT_URL + '?t=' + Date.now()); // Cache bust
            const snapshotData = await snapshotRes.json();
            
            // Find snapshot from ~24 hours ago
            if (snapshotData.history) {
              const now = new Date();
              const target24hAgo = new Date(now.getTime() - 24 * 60 * 60 * 1000);
              
              // Find closest snapshot to 24h ago
              const historyKeys = Object.keys(snapshotData.history).sort();
              let closestKey = null;
              let closestDiff = Infinity;
              
              for (const key of historyKeys) {
                const keyTime = new Date(key).getTime();
                const diff = Math.abs(keyTime - target24hAgo.getTime());
                if (diff < closestDiff) {
                  closestDiff = diff;
                  closestKey = key;
                }
              }
              
              if (closestKey && closestDiff < 2 * 60 * 60 * 1000) { // Within 2 hours of target
                snapshot24h = snapshotData.history[closestKey]?.[tokenName];
              }
            }
          } catch(e) {
            console.log('Could not fetch KPI snapshot from GitHub:', e.message);
          }
          setSnapshot24hAgo(snapshot24h);
          
          try {
            // 1. Fetch price data from DexScreener
            let mainPairData = null;
            if (tokenName === 'UFO') {
              try {
                const pairRes = await fetch(`https://api.dexscreener.com/latest/dex/pairs/pulsechain/${UFO_PAIR_ADDRESS}`);
                const pairData = await pairRes.json();
                if (pairData.pair) mainPairData = pairData.pair;
              } catch(e) {}
            }
            
            const priceRes = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${info.contract}`);
            const priceResult = await priceRes.json();
            
            if (priceResult.pairs?.length) {
              const pairs = priceResult.pairs.filter(p => p.chainId === 'pulsechain');
              const main = mainPairData || pairs.sort((a,b) => (b.liquidity?.usd || 0) - (a.liquidity?.usd || 0))[0];
              const totLiq = pairs.reduce((s,p) => s + (p.liquidity?.usd || 0), 0);
              const totVol = pairs.reduce((s,p) => s + (p.volume?.h24 || 0), 0);
              const mcap = main?.marketCap || main?.fdv || 0;
              
              setPriceData({
                price: parseFloat(main?.priceUsd || 0),
                change: main?.priceChange?.h24 || 0,
                mcap: mcap,
                liq: totLiq
              });
              
              // Calculate changes from GitHub snapshot (24h ago)
              if (snapshot24h) {
                // Liquidity change
                if (snapshot24h.liquidity > 0) {
                  setLiqChange(((totLiq - snapshot24h.liquidity) / snapshot24h.liquidity) * 100);
                }
                // Market cap change
                if (snapshot24h.mcap > 0) {
                  setMcapChange(((mcap - snapshot24h.mcap) / snapshot24h.mcap) * 100);
                }
                // Volume change
                if (snapshot24h.volume24h > 0) {
                  const volChange = ((totVol - snapshot24h.volume24h) / snapshot24h.volume24h) * 100;
                  setVolumeData({ daily: totVol, change: volChange });
                  setValueGenChange(volChange); // Same % as volume
                } else {
                  setVolumeData({ daily: totVol, change: null });
                }
              } else {
                setVolumeData({ daily: totVol, change: null });
              }
            }
            
            // 2. Fetch holders from PulseScan
            try {
              const holdersRes = await fetch(`https://api.scan.pulsechain.com/api/v2/tokens/${info.contract}`);
              const holdersResult = await holdersRes.json();
              if (holdersResult?.holders) {
                const count = parseInt(holdersResult.holders);
                
                // Calculate holder change from GitHub snapshot
                let change24h = null;
                if (snapshot24h && snapshot24h.holders > 0) {
                  change24h = count - snapshot24h.holders;
                }
                
                setHoldersData({ count, change24h });
              }
            } catch(e) {}
            
            // 3. Fetch total burn from RPC
            try {
              const burnRes = await fetch(PULSECHAIN_RPC, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  jsonrpc: '2.0',
                  method: 'eth_call',
                  params: [{
                    to: info.contract,
                    data: '0x70a08231000000000000000000000000' + BURN_ADDRESS.slice(2).toLowerCase()
                  }, 'latest'],
                  id: 1
                })
              });
              const burnResult = await burnRes.json();
              if (burnResult.result) {
                const totalBurned = parseInt(burnResult.result, 16) / 1e18;
                const burnPercent = (totalBurned / totalSupply) * 100;
                
                // Set total burn immediately so card can show
                setBurnData({ total: totalBurned, percent: burnPercent, burn24h: null });
              }
            } catch(e) {}
            
          } catch(e) {
            console.error('Failed to fetch data for', tokenName, e);
          }
          
          // Card can show now with basic data
          setLoading(false);
          
          // Fetch 24h burn using historical balance (FAST - just 2 RPC calls)
          try {
            // Get current block number
            const blockRes = await fetch(PULSECHAIN_RPC, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ jsonrpc: '2.0', method: 'eth_blockNumber', params: [], id: 1 })
            });
            const blockData = await blockRes.json();
            const currentBlock = parseInt(blockData.result, 16);
            
            // PulseChain ~10 second blocks, so 24h ago = current - (86400/10) = current - 8640 blocks
            const blocksPerDay = 8640;
            const block24hAgo = currentBlock - blocksPerDay;
            
            // Get current burn balance (we already have this, but get fresh)
            const currentBalRes = await fetch(PULSECHAIN_RPC, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                jsonrpc: '2.0',
                method: 'eth_call',
                params: [{
                  to: info.contract,
                  data: '0x70a08231000000000000000000000000' + BURN_ADDRESS.slice(2).toLowerCase()
                }, 'latest'],
                id: 1
              })
            });
            const currentBalData = await currentBalRes.json();
            const currentBurnBalance = parseInt(currentBalData.result, 16) / 1e18;
            
            // Get burn balance 24h ago
            const pastBalRes = await fetch(PULSECHAIN_RPC, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                jsonrpc: '2.0',
                method: 'eth_call',
                params: [{
                  to: info.contract,
                  data: '0x70a08231000000000000000000000000' + BURN_ADDRESS.slice(2).toLowerCase()
                }, '0x' + block24hAgo.toString(16)],
                id: 1
              })
            });
            const pastBalData = await pastBalRes.json();
            const pastBurnBalance = parseInt(pastBalData.result, 16) / 1e18;
            
            // 24h burn = current balance - balance 24h ago
            const burn24h = currentBurnBalance - pastBurnBalance;
            
            setBurnData(prev => ({ ...prev, burn24h: burn24h > 0 ? burn24h : 0 }));
          } catch(e) {
            console.error('Failed to fetch 24h burn:', e);
          }
          setBurn24hLoading(false);
        };
        
        fetchAllData();
      }, [tokenName]);
      
      // Report data back to parent when all data is loaded
      useEffect(() => {
        if (!loading && onDataLoaded) {
          onDataLoaded(tokenName, {
            priceData,
            holdersData,
            burnData,
            volumeData,
            liqChange,
            mcapChange,
            valueGenChange,
            plsPrice
          });
        }
      }, [loading, priceData, holdersData, burnData, volumeData, liqChange, mcapChange, valueGenChange]);
      
      // Helper functions
      const fmt = (num) => {
        if (num === null || num === undefined || isNaN(num)) return '—';
        return Math.round(num).toLocaleString();
      };
      
      const fmtCompact = (num) => {
        if (num === null || num === undefined || isNaN(num)) return '—';
        if (num >= 1e9) return '$' + (num/1e9).toFixed(2) + 'B';
        if (num >= 1e6) return '$' + (num/1e6).toFixed(2) + 'M';
        if (num >= 1e3) return '$' + (num/1e3).toFixed(2) + 'K';
        return '$' + num.toFixed(2);
      };
      
      const formatPrice = (price) => {
        if (!price || price === 0) return '$0';
        if (price >= 1) return '$' + price.toFixed(2);
        if (price >= 0.01) return '$' + price.toFixed(4);
        if (price >= 0.0001) return '$' + price.toFixed(6);
        const str = price.toFixed(18);
        const match = str.match(/^0\.(0*)([1-9]\d{0,3})/);
        if (match) {
          const zeros = match[1].length;
          const digits = match[2].slice(0, 4);
          return (<span>$0.0<sub style={{fontSize:'60%',opacity:0.7}}>{zeros}</sub>{digits}</span>);
        }
        return '$' + price.toFixed(8);
      };
      
      const formatPlsRatio = () => {
        if (!priceData?.price || !plsPrice) return '—';
        return (priceData.price / plsPrice).toFixed(2);
      };
      
      // Calculated values
      const liqToMcRatio = priceData?.mcap > 0 ? (priceData.liq / priceData.mcap) * 100 : null;
      const valueGenerated = (volumeData.daily || 0) * info.fee;
      const burn24hUsd = burnData.burn24h * (priceData?.price || 0);
      
      // Sea creature functions
      const getTotalBurnThresholds = () => ({
        POSEIDON: totalSupply * 0.10, WHALE: totalSupply * 0.01, SHARK: totalSupply * 0.001,
        DOLPHIN: totalSupply * 0.0001, SQUID: totalSupply * 0.00001, TURTLE: totalSupply * 0.000001
      });
      
      const get24hBurnThresholds = () => ({
        ...getTotalBurnThresholds(),
        CRAB: totalSupply * 0.0000001, SHRIMP: totalSupply * 0.00000001, SHELL: totalSupply * 0.000000001
      });
      
      const getSeaCreature = (amount) => {
        if (!amount || amount <= 0) return '🐚';
        const t = get24hBurnThresholds();
        if (amount >= t.POSEIDON) return '🔱';
        if (amount >= t.WHALE) return '🐋';
        if (amount >= t.SHARK) return '🦈';
        if (amount >= t.DOLPHIN) return '🐬';
        if (amount >= t.SQUID) return '🦑';
        if (amount >= t.TURTLE) return '🐢';
        if (amount >= t.CRAB) return '🦀';
        if (amount >= t.SHRIMP) return '🦐';
        return '🐚';
      };
      
      const SeaCreatures = ({ amount }) => {
        if (!amount || amount <= 0) return null;
        const t = getTotalBurnThresholds();
        
        let remaining = amount;
        const poseidons = Math.floor(remaining / t.POSEIDON); remaining = remaining % t.POSEIDON;
        const whales = Math.floor(remaining / t.WHALE); remaining = remaining % t.WHALE;
        const sharks = Math.floor(remaining / t.SHARK); remaining = remaining % t.SHARK;
        const dolphins = Math.floor(remaining / t.DOLPHIN); remaining = remaining % t.DOLPHIN;
        const squids = Math.floor(remaining / t.SQUID); remaining = remaining % t.SQUID;
        const turtles = Math.floor(remaining / t.TURTLE);
        
        const creatures = [];
        if (poseidons > 0) creatures.push({ emoji: '🔱', count: poseidons });
        if (whales > 0) creatures.push({ emoji: '🐋', count: whales });
        if (sharks > 0) creatures.push({ emoji: '🦈', count: sharks });
        if (dolphins > 0) creatures.push({ emoji: '🐬', count: dolphins });
        if (squids > 0) creatures.push({ emoji: '🦑', count: squids });
        if (turtles > 0) creatures.push({ emoji: '🐢', count: turtles });
        
        let nextEmoji = '🐢', nextThreshold = t.TURTLE, currentLevel = amount;
        if (amount >= t.POSEIDON) { nextEmoji = '🔱'; nextThreshold = t.POSEIDON; currentLevel = amount % t.POSEIDON; }
        else if (amount >= t.WHALE) { nextEmoji = '🔱'; nextThreshold = t.POSEIDON; currentLevel = amount; }
        else if (amount >= t.SHARK) { nextEmoji = '🐋'; nextThreshold = t.WHALE; currentLevel = amount % t.WHALE; }
        else if (amount >= t.DOLPHIN) { nextEmoji = '🦈'; nextThreshold = t.SHARK; currentLevel = amount % t.SHARK; }
        else if (amount >= t.SQUID) { nextEmoji = '🐬'; nextThreshold = t.DOLPHIN; currentLevel = amount % t.DOLPHIN; }
        else if (amount >= t.TURTLE) { nextEmoji = '🦑'; nextThreshold = t.SQUID; currentLevel = amount % t.SQUID; }
        
        const progress = (currentLevel / nextThreshold) * 100;
        
        return (
          <div className="mt-3">
            <div className="flex items-center justify-between mb-1.5">
              <div className="flex items-center gap-1.5 flex-wrap">
                {creatures.length > 0 ? creatures.map((c, i) => (
                  <span key={i} className="flex items-center gap-0.5">
                    <span className="text-sm">{c.emoji}</span>
                    <span className="text-white text-[10px] font-bold">x{c.count}</span>
                  </span>
                )) : <span className="text-gray-500 text-[10px]">Building to {nextEmoji}</span>}
              </div>
              <span className="text-[10px] text-gray-500">{progress.toFixed(0)}%→{nextEmoji}</span>
            </div>
            <div className="h-1 bg-gray-800 rounded-full overflow-hidden">
              <div className="h-full bg-gradient-to-r from-orange-500 to-orange-400 rounded-full" style={{ width: `${Math.min(progress, 100)}%` }} />
            </div>
          </div>
        );
      };
      
      const LabelBadge = ({ emoji, text }) => (
        <div className="inline-flex items-center gap-1.5 px-2 py-1 rounded-md" style={{ background: `${pc}30` }}>
          <span className="text-xs">{emoji}</span>
          <span className="text-xs font-bold text-gray-200">{text}</span>
        </div>
      );
      
      const Badge = ({ value, isPercent = true }) => {
        if (value === null || value === undefined) return <span className="text-xs text-gray-600">—</span>;
        const up = value >= 0;
        return (
          <span className={`text-xs font-bold ${up ? 'text-green-400' : 'text-red-500'}`}>
            {up ? '▲' : '▼'} {isPercent ? Math.abs(value).toFixed(1) + '%' : Math.abs(value)}
          </span>
        );
      };
      
      const MetricBox = ({ emoji, label, value, change, isPercent = true }) => (
        <div className="p-3 rounded-xl flex flex-col justify-center" style={{ background: `rgba(${pcRgb},0.08)`, border: `1px solid rgba(${pcRgb},0.2)`, minHeight: '90px' }}>
          <div className="flex items-center justify-between mb-2">
            <LabelBadge emoji={emoji} text={label} />
            <Badge value={change} isPercent={isPercent} />
          </div>
          <div className="font-bold text-xl text-white font-space pl-1">{value}</div>
        </div>
      );
      
      const priceChange = priceData?.change || 0;
      
      if (loading) {
        return (
          <div className="rounded-2xl overflow-hidden relative flex-1 min-w-[420px] h-[700px] flex items-center justify-center" style={{ background: '#0d0d0d', border: `2px solid ${pc}40` }}>
            <div className="text-center">
              <div className="text-4xl mb-4 animate-pulse">{tokenName === 'PTGC' ? '👽' : '🛸'}</div>
              <div className="text-gray-400">Loading {tokenName} data...</div>
            </div>
          </div>
        );
      }
      
      return (
        <div className="rounded-2xl overflow-hidden relative flex-1 min-w-[420px]" style={{ background: '#0d0d0d', border: `2px solid ${pc}40` }}>
          {/* Background glow */}
          <div className="absolute inset-0 overflow-hidden pointer-events-none">
            <div className="absolute -top-20 -left-20 w-80 h-80 rounded-full blur-3xl opacity-20" style={{ background: `radial-gradient(circle, ${pc}, transparent 70%)` }} />
            <div className="absolute -bottom-20 -right-20 w-60 h-60 rounded-full blur-3xl opacity-15" style={{ background: `radial-gradient(circle, ${pc}, transparent 70%)` }} />
          </div>
          
          <div className="relative z-10">
            <div style={{ height: '4px', background: `linear-gradient(90deg, ${pc}, ${pc}60, ${pc})` }} />
            
            {/* Header */}
            <div className="p-4 flex items-center gap-4" style={{ background: `linear-gradient(180deg, ${pc}15, transparent)` }}>
              <div className="relative flex-shrink-0">
                <div className="absolute inset-[-8px] rounded-3xl blur-xl" style={{ background: pc, opacity: 0.5 }} />
                <img src={info.logo} alt={tokenName} className="relative w-20 h-20 rounded-2xl object-contain" style={{ border: `3px solid ${pc}60` }} />
              </div>
              <div className="flex-1 min-w-0">
                <div className="font-orbitron font-black text-2xl" style={{ color: pc }}>{tokenName}</div>
                <div className="text-gray-500 text-xs font-bold tracking-[0.2em]">KPI REPORT</div>
                <div className="text-gray-500 text-[9px] font-mono mt-1 break-all leading-tight">{info.contract}</div>
              </div>
              <div className="text-right flex-shrink-0">
                <div className="text-sm text-gray-400 font-medium">{new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</div>
                <div className="mt-1.5 flex justify-end">
                  <span className="px-2 py-0.5 rounded text-[10px] font-semibold text-white" style={{ background: `${pc}40` }}>24H</span>
                </div>
              </div>
            </div>
            
            {/* Price Card */}
            <div className="mx-4 mb-3 p-4 rounded-xl" style={{ background: `${pc}12`, border: `1px solid ${pc}30` }}>
              <div className="flex items-center justify-between gap-3">
                <div className="flex-1">
                  <LabelBadge emoji="💰" text="PRICE" />
                  <div className="font-space font-black text-3xl mt-2" style={{ color: pc }}>{formatPrice(priceData?.price)}</div>
                </div>
                <div className="flex items-center gap-2">
                  <div className={`px-4 py-2.5 rounded-lg text-center ${priceChange >= 0 ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-500'}`}>
                    <div className="font-bold"><span className="text-base">{priceChange >= 0 ? '▲' : '▼'}</span> <span className="text-2xl">{Math.abs(priceChange).toFixed(2)}%</span></div>
                  </div>
                  <div className="px-3 py-1.5 rounded-lg text-center" style={{ background: `${pc}20`, border: `1px solid ${pc}30` }}>
                    <div className="text-[9px] text-gray-400 font-semibold">PLS RATIO</div>
                    <div className="text-lg font-bold text-white">{formatPlsRatio()}</div>
                  </div>
                </div>
              </div>
            </div>
            
            {/* KPI Grid */}
            <div className="px-4 pb-3 grid grid-cols-2 gap-2.5">
              <MetricBox emoji="📊" label="MARKET CAP" value={`$${fmt(priceData?.mcap)}`} change={mcapChange} />
              <MetricBox emoji="💧" label="LIQUIDITY" value={`$${fmt(priceData?.liq)}`} change={liqChange} />
              <MetricBox emoji="⚖️" label="LIQ/MC RATIO" value={liqToMcRatio ? liqToMcRatio.toFixed(1) + '%' : '—'} change={null} />
              <MetricBox emoji="📈" label="VOLUME" value={`$${fmt(volumeData.daily)}`} change={volumeData.change} />
              <MetricBox emoji="👥" label="HOLDERS" value={holdersData.count ? fmt(holdersData.count) : '—'} change={holdersData.change24h} isPercent={false} />
              <MetricBox emoji="⚡" label="VALUE GENERATED" value={`$${fmt(valueGenerated)}`} change={valueGenChange} />
            </div>
            
            {/* Burn Box */}
            <div className="mx-4 mb-4 p-3 rounded-xl" style={{ background: 'rgba(249,115,22,0.1)', border: '1px solid rgba(249,115,22,0.3)' }}>
              <div className="flex gap-3">
                <div className="flex-1">
                  <div className="flex items-center gap-1.5 mb-1">
                    <span className="text-sm">🔥</span>
                    <span className="text-[10px] font-bold text-orange-400 uppercase">Total Burned</span>
                  </div>
                  <div className="text-lg font-bold text-orange-400 font-space">
                    {fmt(burnData.total)} <span className="text-sm text-orange-400/70">{tokenName}</span>
                  </div>
                  <div className="text-gray-400 text-xs">
                    {fmtCompact(burnData.total * (priceData?.price || 0))}
                    <span className="text-orange-400/60 ml-2">{burnData.percent.toFixed(2)}% of supply</span>
                  </div>
                  <SeaCreatures amount={burnData.total} />
                </div>
                
                <div className="w-28 border-l border-orange-400/20 pl-3 flex flex-col">
                  <div className="flex items-center gap-1 mb-1">
                    <span className="text-xs">🔥</span>
                    <span className="text-[9px] font-bold text-orange-300 uppercase">24h Burn</span>
                  </div>
                  <div className="text-sm font-bold text-orange-300 font-space">
                    {burnData.burn24h !== null ? fmt(burnData.burn24h) : <span className="animate-pulse">...</span>} <span className="text-[10px] text-orange-300/70">{tokenName}</span>
                  </div>
                  <div className="text-green-400 text-xs font-semibold">{burnData.burn24h !== null ? fmtCompact(burn24hUsd) : '...'}</div>
                  <div className="flex-1 flex items-center justify-center mt-2">
                    <span className="text-3xl">{burnData.burn24h !== null ? getSeaCreature(burnData.burn24h) : '⏳'}</span>
                  </div>
                </div>
              </div>
            </div>
            
            {/* Footer */}
            <div className="px-4 py-3 flex items-center justify-between border-t" style={{ borderColor: `${pc}15` }}>
              <div className="flex items-center gap-2">
                <img src="https://dd.dexscreener.com/ds-data/tokens/pulsechain/0xa1077a294dde1b09bb078844df40758a5d0f9a27.png" alt="PLS" className="w-5 h-5 rounded-full" />
                <span className="text-sm text-gray-300 font-semibold">PulseChain</span>
              </div>
              <div className="text-sm font-bold" style={{ color: pc }}>www.GoPTGC.com</div>
            </div>
          </div>
        </div>
      );
    };

    // LP Portfolio Tracker - tracks LP positions for XYZ and FLEET
    // Uses GitHub as permanent storage for deposit history
    const useLPPortfolio = (tokenName, pairs, walletAddress) => {
      const [positions, setPositions] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [newDepositsFound, setNewDepositsFound] = useState(0);
      
      const fetchPositions = async () => {
        if (!walletAddress || !pairs || pairs.length === 0) {
          setLoading(false);
          return;
        }
        
        setLoading(true);
        setError(null);
        setNewDepositsFound(0);
        
        try {
          // 1. Load saved deposits from GitHub
          const { data: githubData, sha: githubSha, failed: githubFailed, fromBackup } = await GitHubStorage.read();
          const savedDeposits = githubData[tokenName] || {};
          let dataChanged = false;
          
          // If GitHub failed and no backup, warn user but don't detect "new" deposits
          if (githubFailed && !fromBackup) {
            console.warn('GitHub read failed - cannot detect new deposits accurately');
            setError('GitHub sync failed - showing cached data only');
          }
          
          // 2. Merge DexScreener pairs with GitHub saved pairs
          // This ensures we check ALL pairs user has ever deposited into
          const pairMap = new Map();
          
          // Add DexScreener pairs first (they have full token info)
          pairs.forEach(p => {
            if (p.pairAddress) {
              pairMap.set(p.pairAddress.toLowerCase(), p);
            }
          });
          
          // Add GitHub saved pairs that aren't in DexScreener
          const savedPairAddresses = Object.keys(savedDeposits);
          console.log(`LP Portfolio: ${savedPairAddresses.length} pairs saved in GitHub for ${tokenName}`);
          
          savedPairAddresses.forEach(savedPairAddr => {
            const addrLower = savedPairAddr.toLowerCase();
            const savedPair = savedDeposits[savedPairAddr];
            const depositCount = savedPair?.deposits?.length || 0;
            const otherSymbol = savedPair?.deposits?.[0]?.otherSymbol || '?';
            
            if (!pairMap.has(addrLower)) {
              // Create minimal pair object from saved data
              if (savedPair && savedPair.deposits && savedPair.deposits.length > 0) {
                const firstDeposit = savedPair.deposits[0];
                pairMap.set(addrLower, {
                  pairAddress: savedPairAddr,
                  baseToken: { symbol: tokenName, address: '' },
                  quoteToken: { symbol: firstDeposit.otherSymbol || '?', address: firstDeposit.otherAddr || '' },
                  liquidity: 0, // Unknown, but we still want to show it
                  volume24h: 0
                });
                console.log(`  Added GitHub-only pair: ${tokenName}/${firstDeposit.otherSymbol} (${depositCount} deposits)`);
              }
            } else {
              console.log(`  Pair ${tokenName}/${otherSymbol} exists in both GitHub (${depositCount} deposits) and DexScreener`);
            }
          });
          
          const allPairs = Array.from(pairMap.values());
          console.log(`LP Portfolio: Checking ${allPairs.length} pairs for ${tokenName}`);
          
          // 3. Scan wallet for all LP transactions
          const transfersRes = await fetch(
            `https://api.scan.pulsechain.com/api?module=account&action=tokentx&address=${walletAddress}&page=1&offset=10000&sort=asc`
          );
          const transfersData = await transfersRes.json();
          
          if (transfersData.status !== '1' || !transfersData.result) {
            setError('Could not fetch wallet transactions');
            setLoading(false);
            return;
          }
          
          const allTransfers = transfersData.result;
          const walletLower = walletAddress.toLowerCase();
          const mainTokenLower = tokenName.toLowerCase();
          const lpPositions = [];
          let newCount = 0;
          
          // 4. Process each pair
          for (const pair of allPairs) {
            if (!pair.pairAddress) {
              // console.log(`Skipping pair with no address`);
              continue;
            }
            const pairAddrLower = pair.pairAddress.toLowerCase();
            
            // Get token info
            const token0Symbol = pair.baseToken?.symbol || '?';
            const token1Symbol = pair.quoteToken?.symbol || '?';
            const token0Addr = (pair.baseToken?.address || '').toLowerCase();
            const token1Addr = (pair.quoteToken?.address || '').toLowerCase();
            
            const isToken0Main = token0Symbol.toLowerCase() === mainTokenLower;
            const mainSymbol = isToken0Main ? token0Symbol : token1Symbol;
            const otherSymbol = isToken0Main ? token1Symbol : token0Symbol;
            let otherAddr = isToken0Main ? token1Addr : token0Addr;
            
            // Ensure WPLS has correct address even if API doesn't return it
            const wplsAddress = '0xa1077a294dde1b09bb078844df40758a5d0f9a27';
            if ((otherSymbol === 'WPLS' || otherSymbol?.toUpperCase() === 'WPLS') && !otherAddr) {
              otherAddr = wplsAddress;
              console.log(`  Fixed empty WPLS address to ${wplsAddress}`);
            }
            
            // Debug: log all pairs being checked
            // console.log(`Checking pair: ${mainSymbol}/${otherSymbol}, pairAddr: ${pairAddrLower.slice(0,10)}...`);
            
            // Find LP token transfers for this pair
            const lpTransfers = allTransfers.filter(
              tx => tx.contractAddress?.toLowerCase() === pairAddrLower
            );
            
            // Get saved deposits for this pair FIRST (before checking LP balance)
            const savedPairData = savedDeposits[pairAddrLower];
            let pairDeposits = savedPairData?.deposits || [];
            const hasSavedDeposits = pairDeposits.length > 0;
            
            if (lpTransfers.length === 0 && !hasSavedDeposits) {
              // console.log(`  -> No LP transfers found and no saved deposits, skipping`);
              continue;
            }
            
            // Track LP balance and deposit tx hashes
            let lpBalance = 0n;
            const depositTxHashes = new Set();
            
            for (const tx of lpTransfers) {
              const value = BigInt(tx.value || '0');
              const isDeposit = tx.to?.toLowerCase() === walletLower;
              if (isDeposit) {
                lpBalance += value;
                depositTxHashes.add(tx.hash.toLowerCase());
              } else {
                lpBalance -= value;
              }
            }
            
            // IMPORTANT: If we have saved deposits from GitHub, include this pair even if LP balance is 0
            // This handles cases where the API fails or returns incomplete data
            if (lpBalance <= 0n && !hasSavedDeposits) {
              // console.log(`  -> LP balance is 0 for ${mainSymbol}/${otherSymbol} and no saved deposits, skipping`);
              continue;
            }
            
            // If we have saved deposits but can't find LP transfers, use saved tx hashes
            if (lpBalance <= 0n && hasSavedDeposits) {
              console.log(`  -> Using saved deposits for ${mainSymbol}/${otherSymbol} (API may be incomplete)`);
              // Assume LP balance exists since we have saved deposits
              lpBalance = 1n; // Non-zero to continue processing
              pairDeposits.forEach(d => {
                if (d.txHash) depositTxHashes.add(d.txHash.toLowerCase());
              });
            }
            
            // console.log(`  -> FOUND: ${mainSymbol}/${otherSymbol} with ${depositTxHashes.size} deposits`);
            
            const savedTxHashes = new Set(pairDeposits.map(d => (d.txHash || '').toLowerCase()).filter(h => h));
            
            // console.log(`Pair ${mainSymbol}/${otherSymbol}: ${pairDeposits.length} saved deposits, ${depositTxHashes.size} wallet deposits`);
            
            // Check if this is a native PLS pair (NOT WPLS - WPLS is an ERC-20 token that has normal transfers)
            // Native PLS auto-wraps to WPLS, but WPLS itself shows up as regular token transfers
            const isNativePLS = otherSymbol === 'PLS' || otherSymbol?.toUpperCase() === 'PLS';
            const isWPLS = otherSymbol === 'WPLS' || otherSymbol?.toUpperCase() === 'WPLS';
            // console.log(`  -> isNativePLS: ${isNativePLS}, isWPLS: ${isWPLS}, otherSymbol: "${otherSymbol}"`);
            
            // Find NEW deposits (tx hashes we haven't saved yet)
            // BUT ONLY if GitHub read was successful (otherwise we'd treat ALL as "new")
            let newDepositHashes = (githubFailed && !fromBackup) 
              ? [] // Don't detect new deposits if GitHub read failed
              : [...depositTxHashes].filter(h => !savedTxHashes.has(h));
            
            // Also re-process any saved deposits that have 0 tokens or 0 value (bad data from previous detection)
            const badDeposits = pairDeposits.filter(d => 
              d.otherTokens === 0 || d.valueUsd === 0
            );
            // Keep bad deposits around in case re-detection fails - we'll update them if successful
            const badDepositsByTxHash = {};
            if (badDeposits.length > 0) {
              console.log(`  -> Found ${badDeposits.length} deposits with 0 values for ${mainSymbol}/${otherSymbol}, will attempt re-processing...`);
              badDeposits.forEach(d => {
                if (d.txHash) {
                  const hashLower = d.txHash.toLowerCase();
                  badDepositsByTxHash[hashLower] = d;
                  // Add to re-process list if not already in the new deposits
                  if (!newDepositHashes.includes(hashLower)) {
                    newDepositHashes.push(hashLower);
                  }
                }
              });
              // Remove duplicates
              newDepositHashes = [...new Set(newDepositHashes)];
            }
            
            console.log(`  -> ${newDepositHashes.length} deposits to process for ${mainSymbol}/${otherSymbol}`);
            
            if (newDepositHashes.length > 0) {
              // Process new deposits
              for (const txHash of newDepositHashes) {
                console.log(`    Processing tx: ${txHash.slice(0,10)}...`);
                
                // Find the other token transfer in this transaction
                // For WPLS, look for WPLS ERC-20 transfers specifically
                const wplsAddress = '0xa1077a294dde1b09bb078844df40758a5d0f9a27';
                const pulsexRouter = '0x165c3410fc91ef562c50559f7d2289febed552d9';
                const searchAddr = isWPLS ? wplsAddress : otherAddr;
                
                // First try: direct transfer to pair
                let otherTransfer = allTransfers.find(tx =>
                  tx.hash?.toLowerCase() === txHash &&
                  tx.contractAddress?.toLowerCase() === searchAddr &&
                  tx.from?.toLowerCase() === walletLower &&
                  tx.to?.toLowerCase() === pairAddrLower
                );
                
                // Debug: log all transfers with this txHash for WPLS
                if (isWPLS && !otherTransfer) {
                  const txTransfers = allTransfers.filter(tx => tx.hash?.toLowerCase() === txHash);
                  console.log(`    DEBUG: Found ${txTransfers.length} transfers in tx ${txHash.slice(0,10)}:`);
                  txTransfers.forEach(tx => {
                    console.log(`      - ${tx.tokenSymbol || 'unknown'}: from ${tx.from?.slice(0,10)} to ${tx.to?.slice(0,10)}, contract: ${tx.contractAddress?.slice(0,10)}`);
                  });
                  console.log(`    DEBUG: Looking for contractAddress=${searchAddr.slice(0,10)}, from=${walletLower.slice(0,10)}, to=${pairAddrLower.slice(0,10)}`);
                }
                
                // Second try for WPLS: transfer to router (router then sends to pair)
                if (!otherTransfer && isWPLS) {
                  otherTransfer = allTransfers.find(tx =>
                    tx.hash?.toLowerCase() === txHash &&
                    tx.contractAddress?.toLowerCase() === wplsAddress &&
                    tx.from?.toLowerCase() === walletLower &&
                    tx.to?.toLowerCase() === pulsexRouter
                  );
                  if (otherTransfer) {
                    console.log(`    Found WPLS transfer via router`);
                  }
                }
                
                // Third try for WPLS: any WPLS transfer from wallet in this tx
                if (!otherTransfer && isWPLS) {
                  otherTransfer = allTransfers.find(tx =>
                    tx.hash?.toLowerCase() === txHash &&
                    tx.contractAddress?.toLowerCase() === wplsAddress &&
                    tx.from?.toLowerCase() === walletLower
                  );
                  if (otherTransfer) {
                    console.log(`    Found WPLS transfer from wallet (any destination): to ${otherTransfer.to?.slice(0,10)}`);
                  }
                }
                
                // Fourth try: Look for any token transfer FROM wallet in this LP tx (might be named differently)
                if (!otherTransfer && (isWPLS || isNativePLS)) {
                  otherTransfer = allTransfers.find(tx =>
                    tx.hash?.toLowerCase() === txHash &&
                    tx.from?.toLowerCase() === walletLower &&
                    tx.contractAddress?.toLowerCase() !== pairAddrLower && // Not the LP token itself
                    (tx.tokenSymbol?.toUpperCase() === 'WPLS' || tx.tokenSymbol?.toUpperCase() === 'PLS')
                  );
                  if (otherTransfer) {
                    console.log(`    Found PLS/WPLS transfer by symbol: ${otherTransfer.tokenSymbol}`);
                  }
                }
                
                // Get timestamp from LP transfer if we don't find other token transfer
                const lpTransfer = allTransfers.find(tx => 
                  tx.hash?.toLowerCase() === txHash && 
                  tx.contractAddress?.toLowerCase() === pairAddrLower
                );
                const timestamp = otherTransfer 
                  ? parseInt(otherTransfer.timeStamp) * 1000 
                  : (lpTransfer ? parseInt(lpTransfer.timeStamp) * 1000 : Date.now());
                
                console.log(`    Processing deposit tx: ${txHash.slice(0,10)}..., otherTransfer found: ${!!otherTransfer}, isNativePLS: ${isNativePLS}, isWPLS: ${isWPLS}`);
                
                // For WPLS pairs: if no WPLS ERC-20 transfer found, the user likely used native PLS which auto-wrapped
                // So we treat WPLS the same as native PLS when no transfer is found
                const shouldTryNativePLS = isNativePLS || (isWPLS && !otherTransfer);
                
                if (otherTransfer || shouldTryNativePLS) {
                  let otherAmount = 0;
                  let otherDecimals = 18;
                  
                  if (otherTransfer) {
                    // Found ERC-20 transfer (works for WPLS and other tokens)
                    otherDecimals = parseInt(otherTransfer.tokenDecimal) || 18;
                    otherAmount = Number(BigInt(otherTransfer.value || '0')) / Math.pow(10, otherDecimals);
                    console.log(`    Found ERC-20 transfer: ${otherAmount} ${otherSymbol}`);
                  } else if (shouldTryNativePLS) {
                    // For native PLS or WPLS pairs with no ERC-20 transfer, get native PLS value
                    console.log(`    No ERC-20 transfer found, trying native PLS value for ${mainSymbol}/${otherSymbol}, tx: ${txHash}`);
                    
                    // Try to fetch the transaction to get the native PLS value
                    try {
                      // Use PulseScan API to get transaction details
                      const txRes = await fetch(
                        `https://api.scan.pulsechain.com/api?module=proxy&action=eth_getTransactionByHash&txhash=${txHash}`
                      );
                      const txData = await txRes.json();
                      console.log(`    TX value (hex): ${txData.result?.value}`);
                      
                      if (txData.result?.value) {
                        const plsValue = parseInt(txData.result.value, 16);
                        otherAmount = plsValue / 1e18;
                        console.log(`    Found native PLS amount from tx.value: ${otherAmount}`);
                      }
                      
                      // If value is 0, try internal transactions (PLS might be in internal tx)
                      if (otherAmount === 0) {
                        console.log('    TX value was 0, trying internal transactions...');
                        const internalRes = await fetch(
                          `https://api.scan.pulsechain.com/api?module=account&action=txlistinternal&txhash=${txHash}`
                        );
                        const internalData = await internalRes.json();
                        console.log(`    Found ${internalData.result?.length || 0} internal transactions`);
                        
                        if (internalData.result && Array.isArray(internalData.result)) {
                          // Find internal tx where PLS was sent to the pair or router
                          for (const itx of internalData.result) {
                            const val = parseFloat(itx.value || 0) / 1e18;
                            console.log(`      Internal tx: ${val} PLS to ${itx.to?.slice(0,10)}`);
                            if (val > 0) {
                              otherAmount = val;
                              console.log(`    Found native PLS from internal tx: ${otherAmount}`);
                              break;
                            }
                          }
                        }
                      }
                    } catch(e) {
                      console.log('    Could not fetch native PLS amount:', e);
                    }
                    
                    // If still 0, log but continue (we might still get price)
                    if (otherAmount === 0) {
                      console.log('    WARNING: Could not determine PLS/WPLS amount');
                    }
                  }
                  
                  // Get price at deposit time
                  // Note: For historical accuracy, we'd need historical price data
                  // For now, we use current price as best approximation
                  let price = 0;
                  const wplsAddress = '0xa1077a294dde1b09bb078844df40758a5d0f9a27';
                  const priceAddr = (isNativePLS || isWPLS) ? wplsAddress : otherAddr;
                  
                  try {
                    // Get current USD price from DexScreener (more reliable than GeckoTerminal)
                    const priceRes = await fetch(
                      `https://api.dexscreener.com/latest/dex/tokens/${priceAddr}`
                    );
                    const priceData = await priceRes.json();
                    
                    if (priceData.pairs && priceData.pairs.length > 0) {
                      // Prefer PulseChain pairs
                      const pulseChainPair = priceData.pairs.find(p => p.chainId === 'pulsechain');
                      price = pulseChainPair 
                        ? parseFloat(pulseChainPair.priceUsd) || 0
                        : parseFloat(priceData.pairs[0].priceUsd) || 0;
                    }
                    console.log(`    Price for ${otherSymbol} (${priceAddr.slice(0,10)}): $${price}`);
                    
                    // Sanity check: price should be reasonable
                    if (price > 1000000) {
                      console.log(`    WARNING: Price seems too high ($${price}), might be an error`);
                    }
                  } catch(e) {
                    console.log('Error fetching price:', e);
                  }
                  
                  // Calculate USD value
                  const valueUsd = otherAmount * price;
                  
                  // Sanity check: reject obviously wrong values
                  if (valueUsd > 10000000) { // $10M cap per deposit
                    console.log(`    WARNING: Calculated value $${valueUsd.toFixed(2)} seems too high, capping investigation`);
                    console.log(`    otherAmount: ${otherAmount}, price: ${price}`);
                  }
                  
                  // Add new deposit
                  pairDeposits.push({
                    txHash,
                    date: new Date(timestamp).toISOString().split('T')[0],
                    timestamp,
                    otherTokens: otherAmount,
                    otherPrice: price,
                    valueUsd: otherAmount * price,
                    otherSymbol,
                    otherAddr: priceAddr, // Store the actual address used for price lookup
                    otherDecimals
                  });
                  
                  console.log(`    Added deposit: ${otherAmount.toFixed(4)} ${otherSymbol} @ $${price.toFixed(6)} = $${(otherAmount * price).toFixed(2)}`);
                  
                  // If this was a bad deposit being re-processed, remove it from badDepositsByTxHash
                  delete badDepositsByTxHash[txHash];
                  
                  newCount++;
                  dataChanged = true;
                } else {
                  // Could not find the token transfer - if this was a bad deposit, keep it
                  console.log(`    WARNING: Could not find token transfer for ${txHash.slice(0,10)}...`);
                  if (badDepositsByTxHash[txHash]) {
                    console.log(`    Keeping original bad deposit (re-detection failed)`);
                    // Don't add to newCount or mark as changed - we're keeping the original
                  }
                }
              }
              
              // Re-add any bad deposits that couldn't be re-processed (so we don't lose them)
              const remainingBadDeposits = Object.values(badDepositsByTxHash);
              if (remainingBadDeposits.length > 0) {
                console.log(`  -> Keeping ${remainingBadDeposits.length} deposits that couldn't be re-detected`);
                remainingBadDeposits.forEach(d => {
                  // Check if it's not already in pairDeposits
                  if (!pairDeposits.some(p => p.txHash?.toLowerCase() === d.txHash?.toLowerCase())) {
                    pairDeposits.push(d);
                  }
                });
              }
              
              // Sort deposits by date
              pairDeposits.sort((a, b) => a.timestamp - b.timestamp);
              
              // Update saved deposits for this pair
              savedDeposits[pairAddrLower] = {
                pairName: `${mainSymbol}/${otherSymbol}`,
                otherSymbol,
                otherAddr,
                deposits: pairDeposits
              };
            }
            
            // Skip if no deposits
            if (pairDeposits.length === 0) {
              // console.log(`  -> No deposits for ${mainSymbol}/${otherSymbol}, skipping`);
              continue;
            }
            
            // console.log(`  -> Processing ${pairDeposits.length} deposits for display`);
            
            // Calculate totals from all deposits
            const totalInitialTokens = pairDeposits.reduce((sum, d) => sum + (d.otherTokens || 0), 0);
            const totalInitialValue = pairDeposits.reduce((sum, d) => sum + (d.valueUsd || 0), 0);
            const firstDepositDate = pairDeposits[0]?.timestamp;
            
            // Use WPLS address for native PLS pairs when fetching price
            const priceAddr = isNativePLS ? '0xa1077a294dde1b09bb078844df40758a5d0f9a27' : otherAddr;
            
            // Get CURRENT values - use same calculation as Treasury (pair.liquidity / 2)
            let currentOtherTokens = 0;
            let currentOtherPrice = 0;
            let currentValueUsd = 0;
            
            try {
              // Get current price from DexScreener (more reliable)
              const priceRes = await fetch(
                `https://api.dexscreener.com/latest/dex/tokens/${priceAddr}`
              );
              const priceData = await priceRes.json();
              
              if (priceData.pairs && priceData.pairs.length > 0) {
                const pulseChainPair = priceData.pairs.find(p => p.chainId === 'pulsechain');
                currentOtherPrice = pulseChainPair 
                  ? parseFloat(pulseChainPair.priceUsd) || 0
                  : parseFloat(priceData.pairs[0].priceUsd) || 0;
              }
              
              // Use DexScreener pair data (same as Treasury) for consistency
              // pair.liquidity is the total pool value, divide by 2 for the other token side
              currentValueUsd = (pair.liquidity || 0) / 2;
              
              // Calculate current tokens from value and price
              if (currentOtherPrice > 0) {
                currentOtherTokens = currentValueUsd / currentOtherPrice;
              }
            } catch(e) {
              console.log('Error fetching current values:', e);
            }
            
            const profitLoss = currentValueUsd - totalInitialValue;
            const profitLossPercent = totalInitialValue > 0 ? ((currentValueUsd / totalInitialValue) - 1) * 100 : 0;
            
            // console.log(`  -> ADDING ${mainSymbol}/${otherSymbol} to lpPositions`);
            
            lpPositions.push({
              pairAddress: pair.pairAddress,
              pairName: `${mainSymbol}/${otherSymbol}`,
              otherSymbol,
              otherAddr,
              deposits: pairDeposits,
              depositCount: pairDeposits.length,
              // Totals (locked in from all deposits)
              initialOtherTokens: totalInitialTokens,
              initialValueUsd: totalInitialValue,
              depositDate: firstDepositDate,
              // Current (refreshed)
              currentOtherTokens,
              currentOtherPrice,
              currentValueUsd,
              // P/L
              profitLoss,
              profitLossPercent,
              dexUrl: pair.url || `https://dexscreener.com/pulsechain/${pair.pairAddress}`
            });
            
            await new Promise(r => setTimeout(r, 150));
          }
          
          // 4. Save to GitHub if we found new deposits
          if (dataChanged) {
            githubData[tokenName] = savedDeposits;
            const result = await GitHubStorage.write(
              githubData, 
              githubSha, 
              `Add ${newCount} new ${tokenName} LP deposit(s)`
            );
            if (result.success) {
              console.log(`Saved ${newCount} new deposits to GitHub`);
            } else {
              console.error('Failed to save to GitHub:', result.error);
            }
          }
          
          setNewDepositsFound(newCount);
          console.log(`LP Portfolio: ${lpPositions.length} positions found`);
          // console.log(`LP Positions:`, lpPositions.map(p => `${p.pairName}: $${p.initialValueUsd?.toFixed(0) || 0}`));
          setPositions(lpPositions);
          setLastUpdated(new Date());
          setLoading(false);
          
        } catch(e) {
          console.error('LP Portfolio fetch error:', e);
          setError('Failed to fetch LP positions');
          setLoading(false);
        }
      };
      
      useEffect(() => {
        if (!walletAddress) {
          setLoading(false);
          return;
        }
        fetchPositions();
      }, [tokenName, walletAddress, pairs?.length]);
      
      return { positions, loading, error, lastUpdated, newDepositsFound, refetch: fetchPositions };
    };

    // LP Portfolio Modal - Expandable List Format
    const LPPortfolioModal = ({ isOpen, onClose, positions, loading, error, lastUpdated, newDepositsFound, onRefresh, theme, tokenName, walletAddress }) => {
      const [expandedPair, setExpandedPair] = useState(null);
      
      if (!isOpen) return null;
      
      // Safety checks
      const safePositions = Array.isArray(positions) ? positions : [];
      const safeTheme = theme || { card: 'bg-gray-900', border: 'border-gray-700', text: 'text-white', primary: '#888888' };
      
      // Generate scrollbar color from theme
      const scrollbarStyle = `
        .investment-scroll::-webkit-scrollbar { width: 10px; }
        .investment-scroll::-webkit-scrollbar-track { background: ${safeTheme.primary}15; border-radius: 5px; }
        .investment-scroll::-webkit-scrollbar-thumb { background: ${safeTheme.primary}50; border-radius: 5px; }
        .investment-scroll::-webkit-scrollbar-thumb:hover { background: ${safeTheme.primary}80; }
        .investment-scroll { scrollbar-width: thin; scrollbar-color: ${safeTheme.primary}50 ${safeTheme.primary}15; }
      `;
      
      // Calculate totals
      let totalInitial = 0;
      let totalCurrent = 0;
      safePositions.forEach(p => {
        totalInitial += p.initialValueUsd || 0;
        totalCurrent += p.currentValueUsd || 0;
      });
      const totalPL = totalCurrent - totalInitial;
      const totalPLPercent = totalInitial > 0 ? ((totalCurrent / totalInitial) - 1) * 100 : 0;
      
      const fmtUsd = (n) => {
        if (!n || isNaN(n)) return '$0';
        if (Math.abs(n) >= 1000) return '$' + (n/1000).toFixed(1) + 'K';
        return '$' + n.toFixed(2);
      };
      
      const fmtTokens = (n) => {
        if (!n || isNaN(n)) return '0';
        const absN = Math.abs(n);
        // Use 2 decimals only if 100 or less, otherwise no decimals
        if (absN <= 100) {
          return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        return Math.round(n).toLocaleString('en-US');
      };
      
      const fmtDate = (ts) => {
        if (!ts) return '—';
        try {
          return new Date(ts).toLocaleDateString('en-US', {month: 'short', day: 'numeric', year: '2-digit'});
        } catch(e) {
          return '—';
        }
      };
      
      return (

          onClick={e => e.stopPropagation()}

        if (!pairs || !scores) return [];
        
        return pairs
          .filter(p => (p.liquidity || 0) >= MIN_LIQUIDITY && scores[p.pairAddress])
          .map(p => {
            const isBaseMain = p.baseToken?.address?.toLowerCase() === mainTokenContract?.toLowerCase();
            const otherToken = isBaseMain ? p.quoteToken : p.baseToken;
            return {
              ...p,
              score: scores[p.pairAddress],
              otherSymbol: otherToken?.symbol || '?',
              otherAddress: otherToken?.address
            };
          })
          .sort((a, b) => (b.score?.totalScore || 0) - (a.score?.totalScore || 0));

      // Early return AFTER hooks
      if (!isOpen) return null;
      
      const getScoreColor = (score) => {

        return 'text-red-400';

      const getTrendArrow = (change) => {

      // Info content for each scoring factor

          ok: 'Middle 50% (score 25-75) - Average volume efficiency compared to other pools',
          bad: 'Bottom 25% (score 0-25) - Other pools are generating more volume relative to their size',
          tip: 'Since this is percentile-based, you\'re always comparing to current alternatives. A high score means this pool outperforms other available options right now.'
        },
        trend: {
          title: 'Paired Token Price Trend',
          description: 'Tracks the price direction of the OTHER token in the pair (not ' + tokenName + '). When you add LP, you hold both tokens 50/50.',
          good: 'Uptrend (green arrows) - The paired token is gaining value, so your LP position grows',
          ok: 'Sideways (gray arrows) - Stable price, your LP value holds steady',
          bad: 'Downtrend (red arrows) - The paired token is losing value, dragging down your LP worth',
          tip: 'Even a great ratio can\'t save you if the paired token dumps 50%. Look for pairs where the other token is stable or rising.'
        },
        dip: {
          title: 'Dip Detection',
          description: 'Compares current price to the 7-day average. A "dip" means the paired token is temporarily below its recent average price. Stablecoins (USDC, DAI, etc.) show STABLE instead since they\'re pegged to $1.',
          good: '5-15% below average - potential buying opportunity if fundamentals are solid',
          ok: 'At or near average - fair entry point',
          bad: '20%+ below average - could be a falling knife, proceed with caution',
          tip: 'A dip combined with a good long-term trend (30d up) suggests a temporary pullback worth considering.'
        },
        liquidity: {
          title: 'Pool Depth / Liquidity (Percentile)',
          description: 'The total value locked in the pool, ranked against other pools. Deeper pools can handle larger trades and LP positions without major price impact.',
          good: 'Top 25% (score 75+) - One of the deepest pools, can safely add significant LP',
          ok: 'Middle 50% (score 25-75) - Average depth compared to other pools',
          bad: 'Bottom 25% (score 0-25) - Thinner than most pools, large trades may cause slippage',
          tip: 'If you\'re adding substantial LP, prefer deeper pools. Small pools with high ratios might not sustain that ratio with more liquidity.'
        }
      };
      
      const InfoBox = ({ type }) => {
        const info = infoContent[type];
        if (!info) return null;
        
        return (
          <div className="mt-3 p-4 rounded-lg bg-black/30 border border-white/10">

              <h4 className="text-white font-semibold text-base">{info.title}</h4>

              <div className="flex gap-2">
                <span className="text-green-400">✓ Good:</span>

              </div>

                <span className="text-red-400">✗ Bad:</span>
                <span className="text-gray-400">{info.bad}</span>

      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={e => e.stopPropagation()}>

    // Rewards Tracker - Tracks PLS received by dev wallet from this specific token contract
    const useRewardsTracker = (tokenContract, devWallet, tokenName) => {
      const [rewards, setRewards] = useState({ daily: 0, weekly: 0, monthly: 0, lifetime: 0, loading: true });
      const cacheKey = `proweb_rewards_${tokenName}_v24`;
      const WPLS = '0xa1077a294dde1b09bb078844df40758a5d0f9a27';
      
      useEffect(() => {
        const fetchActualRewards = async () => {
          if (!tokenContract || !devWallet || tokenContract === 'Coming Soon') {
            setRewards({ daily: 0, weekly: 0, monthly: 0, lifetime: 0, loading: false });
            return;
          }

          // Check cache first (5 min cache)
          try {
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
              const { data, timestamp } = JSON.parse(cached);
              setRewards({ ...data, loading: false });
              if (Date.now() - timestamp < 5 * 60 * 1000) return;
            }
          } catch(e) {}

          try {
            const now = Date.now();
            const dayAgo = now - 86400000;
            const weekAgo = now - 604800000;
            const monthAgo = now - 2592000000;
            
            let daily = 0, weekly = 0, monthly = 0, lifetime = 0;
            const processed = new Set();
            const devWalletLower = devWallet.toLowerCase();
            const tokenContractLower = tokenContract.toLowerCase();
            
            // Get token transactions to build our tx hash set
            const response2 = await fetch(
              `https://api.scan.pulsechain.com/api?module=account&action=tokentx&address=${tokenContract}&page=1&offset=10000&sort=desc`
            );
            const data2 = await response2.json();
            
            const ourTxHashes = new Set();
            if (data2.status === '1' && data2.result) {
              for (const tx of data2.result) {
                if (tx.hash) ourTxHashes.add(tx.hash.toLowerCase());
              }
            }

            // METHOD 1: Check internal transactions TO the dev wallet
            const response1 = await fetch(
              `https://api.scan.pulsechain.com/api?module=account&action=txlistinternal&address=${devWallet}&page=1&offset=10000&sort=desc`
            );
            const data1 = await response1.json();
            
            if (data1.status === '1' && data1.result) {
              for (const tx of data1.result) {
                if (tx.to?.toLowerCase() !== devWalletLower) continue;
                if (parseInt(tx.value) <= 0 || tx.isError === '1') continue;
                
                const txHash = (tx.transactionHash || tx.hash || '').toLowerCase();
                const fromAddr = tx.from?.toLowerCase();
                
                // Match if tx hash is in our token txs OR comes from our contract
                if (!ourTxHashes.has(txHash) && fromAddr !== tokenContractLower) continue;
                
                const txKey = txHash + '-' + (tx.traceId || tx.index || '0');
                if (processed.has(txKey)) continue;
                processed.add(txKey);
                
                const amount = parseFloat(tx.value) / 1e18;
                const time = parseInt(tx.timeStamp) * 1000;
                
                lifetime += amount;
                if (time >= dayAgo) daily += amount;
                if (time >= weekAgo) weekly += amount;
                if (time >= monthAgo) monthly += amount;
              }
            }
            
            // METHOD 2: Check WPLS transfers to dev wallet
            const wplsResponse = await fetch(
              `https://api.scan.pulsechain.com/api?module=account&action=tokentx&address=${devWallet}&contractaddress=${WPLS}&page=1&offset=10000&sort=desc`
            );
            const wplsData = await wplsResponse.json();
            
            if (wplsData.status === '1' && wplsData.result) {
              for (const tx of wplsData.result) {
                if (tx.to?.toLowerCase() !== devWalletLower) continue;
                if (parseInt(tx.value) <= 0) continue;
                
                const txHash = tx.hash?.toLowerCase();
                const fromAddr = tx.from?.toLowerCase();
                
                if (!ourTxHashes.has(txHash) && fromAddr !== tokenContractLower) continue;
                
                const txKey = 'wpls-' + txHash;
                if (processed.has(txKey)) continue;
                processed.add(txKey);
                
                const amount = parseFloat(tx.value) / 1e18;
                const time = parseInt(tx.timeStamp) * 1000;
                
                lifetime += amount;
                if (time >= dayAgo) daily += amount;
                if (time >= weekAgo) weekly += amount;
                if (time >= monthAgo) monthly += amount;
              }
            }
            
            // METHOD 3: Contract internal txs to dev wallet
            const response3 = await fetch(
              `https://api.scan.pulsechain.com/api?module=account&action=txlistinternal&address=${tokenContract}&page=1&offset=10000&sort=desc`
            );
            const data3 = await response3.json();
            
            if (data3.status === '1' && data3.result) {
              for (const tx of data3.result) {
                if (tx.to?.toLowerCase() !== devWalletLower) continue;
                if (parseInt(tx.value) <= 0 || tx.isError === '1') continue;
                
                const txHash = (tx.transactionHash || tx.hash || '').toLowerCase();
                const txKey = 'contract-' + txHash + '-' + (tx.traceId || tx.index || '0');
                
                if (processed.has(txKey)) continue;
                processed.add(txKey);
                
                const amount = parseFloat(tx.value) / 1e18;
                const time = parseInt(tx.timeStamp) * 1000;
                
                lifetime += amount;
                if (time >= dayAgo) daily += amount;
                if (time >= weekAgo) weekly += amount;
                if (time >= monthAgo) monthly += amount;
              }
            }
            
            const result = { daily, weekly, monthly, lifetime };
            try { localStorage.setItem(cacheKey, JSON.stringify({ data: result, timestamp: Date.now() })); } catch(e) {}
            setRewards({ ...result, loading: false });
          } catch (e) {
            console.error(`[${tokenName}] Rewards fetch error:`, e);
            setRewards(prev => ({ ...prev, loading: false }));
          }
        };
        fetchActualRewards();
      }, [tokenContract, devWallet, tokenName]);
      
      return rewards;
    };

            const monthAgo = now - 2592000000;
            
            let daily = 0, weekly = 0, monthly = 0, lifetime = 0;

            for (const burn of data2.result) {

              if (!ourTxHashes.has(burnTxHash)) continue;
              
              const burnKey = burn.hash + '-' + (burn.logIndex || '0');
              if (processed.has(burnKey)) continue;
              processed.add(burnKey);
              
              const amount = parseFloat(burn.value) / 1e18;

              lifetime += amount;
              if (time >= dayAgo) daily += amount;
              if (time >= weekAgo) weekly += amount;
              if (time >= monthAgo) monthly += amount;
            }
            
            const result = { daily, weekly, monthly, lifetime };
            try { localStorage.setItem(cacheKey, JSON.stringify({ data: result, timestamp: Date.now() })); } catch(e) {}
            setBurns({ ...result, loading: false });
          } catch (e) {
            console.error('Burns fetch error:', e);
            setBurns(prev => ({ ...prev, loading: false }));
          }
        };
        fetchActualBurns();
      }, [tokenContract, devWallet, tokenName]);
      
      return burns;
    };

    const ForceTriggerModal = ({ isOpen, onClose, token, status, setStatus, onSuccess }) => {

          setStatus({ loading: false, error: e.message || 'Failed to connect wallet', success: false });
        }
      };
      
      // Execute the force trigger (buy 1 token, then sell 1 token via WPLS pair)
      const executeTrigger = async () => {
        if (!wallet.signer || !token) return;
        
        try {
          setStatus({ loading: true, error: null, success: false });
          setStep('execute');
          
          const routerAddress = '0x165C3410fC91EF562C50559f7d2289fEbed552d9'; // PulseX V2 Router
          const WPLS = '0xA1077a294dDE1B09bB078844df40758a5D0f9a27';
          
          const router = new ethers.Contract(routerAddress, [
            'function swapExactETHForTokensSupportingFeeOnTransferTokens(uint amountOutMin, address[] calldata path, address to, uint deadline) payable',
            'function swapExactTokensForETHSupportingFeeOnTransferTokens(uint amountIn, uint amountOutMin, address[] calldata path, address to, uint deadline)',
            'function getAmountsIn(uint amountOut, address[] calldata path) view returns (uint[] memory amounts)'
          ], wallet.signer);
          
          const tokenContract = new ethers.Contract(token.contract, [
            'function approve(address spender, uint256 amount) returns (bool)',
            'function allowance(address owner, address spender) view returns (uint256)',
            'function balanceOf(address owner) view returns (uint256)',
            'function decimals() view returns (uint8)'
          ], wallet.signer);
          
          // Get token decimals (should be 18 but let's be safe)
          let decimals = 18;
          try {
            decimals = await tokenContract.decimals();
          } catch (e) {
            console.log('Could not get decimals, using 18');
          }
          
          const oneToken = ethers.parseUnits('1', decimals);
          
          // Get how much PLS we need to buy 1 token (accounting for fees, add 20% buffer)
          const buyPath = [WPLS, token.contract];
          let plsNeeded;
          try {
            const amounts = await router.getAmountsIn(oneToken, buyPath);
            // Add 50% buffer because of token fees (2.5% buy + slippage)
            plsNeeded = (amounts[0] * 150n) / 100n;
          } catch (e) {
            // Fallback: estimate based on ~$1 worth = 70000 PLS
            plsNeeded = ethers.parseEther('100000');
          }
          
          // Check user has enough PLS
          const plsBalance = await wallet.provider.getBalance(wallet.address);
          const gasBuffer = ethers.parseEther('20000'); // Extra for gas
          if (plsBalance < plsNeeded + gasBuffer) {
            setStatus({ loading: false, error: `Need ~${Number(ethers.formatEther(plsNeeded + gasBuffer)).toLocaleString()} PLS. You have ${Number(ethers.formatEther(plsBalance)).toLocaleString()} PLS`, success: false });

          setStep('execute');
          const deadline = Math.floor(Date.now() / 1000) + 300; // 5 minutes
          
          // Step 1: Buy tokens with PLS via WPLS pair directly

            0, // Accept any amount (fees will reduce output)

            deadline,
            { value: plsNeeded }
          );
          await buyTx.wait();
          
          // Step 2: Check how many tokens we got
