    const { useState, useEffect, useMemo } = React;

    const CheckIcon = ({ size = 12 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    );

    const UFO_PAIR_ADDRESS = '0xbeA0e55b82Eb975280041F3b49C4D0bD937b72d5';
    const UFO_TOKEN = '0x456548A9B56eFBbD89Ca0309edd17a9E20b04018';
    const BURN_ADDRESS = '0x0000000000000000000000000000000000000369';
    const MIN_LIQUIDITY = 1000;
    
    // LP Portfolio Tracker Wallets
    const LP_TRACKER_WALLETS = {
      FLEET: '0xd09CFcE03762477c9d258d08755006b6b0c7a9d9',
      XYZ: '0x9FaB1EcF7DcED2aeEA960EE79d2036Ab0D28FB7C'
    };
    
    // GitHub Storage Config for LP Deposits
    const GITHUB_CONFIG = {
      owner: 'ShakaVibe',
      repo: 'ProWeb',
      path: 'data/lp-deposits.json',
      token: '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'
    };
    
    // ============================================
    // VOTING VAULT ENCRYPTION & STORAGE
    // ============================================
    const VotingVaultCrypto = {
      // Derive encryption key from password using PBKDF2
      async deriveKey(password, salt) {
        const encoder = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
          'raw',
          encoder.encode(password),
          'PBKDF2',
          false,
          ['deriveKey']
        );
        
        return crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
          },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      },
      
      // Encrypt data with password
      async encrypt(data, password) {
        const encoder = new TextEncoder();
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await this.deriveKey(password, salt);
        
        const encrypted = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv: iv },
          key,
          encoder.encode(JSON.stringify(data))
        );
        
        // Combine salt + iv + encrypted data
        const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
        combined.set(salt, 0);
        combined.set(iv, salt.length);
        combined.set(new Uint8Array(encrypted), salt.length + iv.length);
        
        // Convert to base64
        return btoa(String.fromCharCode(...combined));
      },
      
      // Decrypt data with password
      async decrypt(encryptedBase64, password) {
        try {
          const combined = new Uint8Array(atob(encryptedBase64).split('').map(c => c.charCodeAt(0)));
          
          const salt = combined.slice(0, 16);
          const iv = combined.slice(16, 28);
          const encrypted = combined.slice(28);
          
          const key = await this.deriveKey(password, salt);
          
          const decrypted = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: iv },
            key,
            encrypted
          );
          
          const decoder = new TextDecoder();
          return JSON.parse(decoder.decode(decrypted));
        } catch (e) {
          console.error('Decryption failed:', e);
          return null;
        }
      }
    };
    
    // GitHub storage specifically for the voting vault
    const VotingVaultStorage = {
      path: 'data/voting-vault.json',
      
      async read() {
        try {
          const response = await fetch(
            `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${this.path}`,
            {
              headers: {
                'Authorization': `token ${GITHUB_CONFIG.token}`,
                'Accept': 'application/vnd.github.v3+json'
              }
            }
          );
          
          if (!response.ok) {
            console.log('Voting vault not found on GitHub');
            return { data: null, sha: null };
          }
          
          const result = await response.json();
          const cleanContent = result.content.replace(/\s/g, '');
          const content = atob(cleanContent);
          const data = JSON.parse(content);
          console.log('Voting vault loaded from GitHub');
          return { data, sha: result.sha };
        } catch (e) {
          console.error('Voting vault read error:', e);
          return { data: null, sha: null };
        }
      },
      
      async write(data, sha) {
        try {
          let currentSha = sha;
          if (!currentSha) {
            try {
              const getRes = await fetch(
                `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${this.path}`,
                {
                  headers: {
                    'Authorization': `token ${GITHUB_CONFIG.token}`,
                    'Accept': 'application/vnd.github.v3+json'
                  }
                }
              );
              if (getRes.ok) {
                const fileData = await getRes.json();
                currentSha = fileData.sha;
              }
            } catch (e) {
              console.log('Could not fetch voting vault SHA:', e);
            }
          }
          
          const encoder = new TextEncoder();
          const bytes = encoder.encode(JSON.stringify(data, null, 2));
          const content = btoa(String.fromCharCode(...bytes));
          
          const body = {
            message: 'Update voting vault',
            content,
            branch: 'main'
          };
          
          if (currentSha) {
            body.sha = currentSha;
          }
          
          const response = await fetch(
            `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${this.path}`,
            {
              method: 'PUT',
              headers: {
                'Authorization': `token ${GITHUB_CONFIG.token}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(body)
            }
          );
          
          if (!response.ok) {
            throw new Error(`GitHub write failed: ${response.status}`);
          }
          
          const result = await response.json();
          console.log('Voting vault saved to GitHub');
          return { success: true, sha: result.content.sha };
        } catch (e) {
          console.error('Voting vault write error:', e);
          return { success: false, error: e.message };
        }
      }
    };
    
    // ============================================
    // ARB VAULT CONFIGURATION
    // ============================================
    const VAULT_CONFIG = {
      address: '0x64875f64ddb4a9739F2f7b0dfB570265eC0d0a2F', // V2 vault with buyToken + batchRebalance
      deployedBlock: 25395500
    };
    
    // Vault ABI (only the functions we need)
    const VAULT_ABI = [
      // Read functions
      'function owner() view returns (address)',
      'function getPLSBalance() view returns (uint256)',
      'function getTokenBalance(address token) view returns (uint256)',
      'function quoteSell(address token, uint256 amount) view returns (uint256 plsOut)',
      'function quoteBuy(address token, uint256 plsAmount) view returns (uint256 tokensOut)',
      'function getStats() view returns (uint256 trades, uint256 profitPLS, uint256 volumePLS)',
      'function getAllBalances() view returns (address[] tokens, uint256[] balances, string[] symbols)',
      // Write functions - V2 signatures
      'function deposit() payable',  // Deposit PLS via function
      'function depositToken(address token, uint256 amount)',  // Deposit ERC20
      'function withdraw(uint256 amount)',  // Withdraw PLS
      'function withdrawAll()',  // Withdraw all PLS
      'function withdrawToken(address token, uint256 amount)',  // Withdraw specific token amount
      'function withdrawAllToken(address token)',  // Withdraw all of a token
      'function executeArb(address[] path, uint256 amountIn, uint256 minProfit, bool usePLSForMissing, bool convertEndToPLS)',
      'function rebalance(address token, uint256 amount, uint256 minPLSOut)',  // Sell token for PLS
      'function buyToken(address token, uint256 plsAmount, uint256 minTokensOut)',  // Buy token with PLS
      'function batchRebalance(address[] tokensToSell, uint256[] amountsToSell, address[] tokensToBuy, uint256[] plsAmountsForBuys)',
      'function emergencyWithdraw(address token)',
      // Events
      'event ArbExecuted(address[] path, uint256 amountIn, uint256 amountOut, int256 profit)'
    ];
    
    // Vault utility functions
    const VaultUtil = {
      // Get vault contract instance
      getContract: (signerOrProvider) => {
        if (typeof ethers === 'undefined') return null;
        return new ethers.Contract(VAULT_CONFIG.address, VAULT_ABI, signerOrProvider);
      },
      
      // Check if connected wallet is vault owner
      isOwner: async (provider, walletAddress) => {
        try {
          const vault = VaultUtil.getContract(provider);
          const owner = await vault.owner();
          return owner.toLowerCase() === walletAddress.toLowerCase();
        } catch (e) {
          console.error('Error checking vault owner:', e);
          return false;
        }
      },
      
      // Get vault PLS balance
      getPLSBalance: async (provider) => {
        try {
          const vault = VaultUtil.getContract(provider);
          const balance = await vault.getPLSBalance();
          return {
            raw: balance,
            formatted: Number(ethers.formatEther(balance))
          };
        } catch (e) {
          console.error('Error getting vault PLS balance:', e);
          return { raw: 0n, formatted: 0 };
        }
      },
      
      // Get vault token balance
      getTokenBalance: async (provider, tokenAddress) => {
        try {
          const vault = VaultUtil.getContract(provider);
          const balance = await vault.getTokenBalance(tokenAddress);
          return balance;
        } catch (e) {
          console.error('Error getting vault token balance:', e);
          return 0n;
        }
      },
      
      // Get all vault balances
      getAllBalances: async (provider) => {
        try {
          const vault = VaultUtil.getContract(provider);
          const [tokens, balances, symbols] = await vault.getAllBalances();
          console.log('Raw vault balances:', { tokens, balances, symbols });
          
          // Token decimals lookup
          const decimalsMap = {
            'PLS': 18,
            'HEX': 8,
            'eHEX': 8,
            'WBTC': 8,
            'USDC': 6,
            'USDT': 6,
          };
          
          return tokens.map((token, i) => {
            const symbol = symbols[i];
            const decimals = decimalsMap[symbol] || 18;
            const formatted = Number(ethers.formatUnits(balances[i], decimals));
            console.log(`Token ${symbol}: raw=${balances[i]}, decimals=${decimals}, formatted=${formatted}`);
            return {
              address: token,
              balance: balances[i],
              symbol: symbol,
              formatted: formatted
            };
          });
        } catch (e) {
          console.error('Error getting vault balances:', e);
          return [];
        }
      },
      
      // Get vault stats
      getStats: async (provider) => {
        try {
          const vault = VaultUtil.getContract(provider);
          const [trades, profitPLS, volumePLS] = await vault.getStats();
          return {
            trades: Number(trades),
            profitPLS: Number(ethers.formatEther(profitPLS)),
            volumePLS: Number(ethers.formatEther(volumePLS))
          };
        } catch (e) {
          console.error('Error getting vault stats:', e);
          return { trades: 0, profitPLS: 0, volumePLS: 0 };
        }
      },
      
      // Deposit PLS to vault (V2 uses receive() function)
      depositPLS: async (signer, amountPLS) => {
        try {
          // V2 vault has receive() function - send PLS directly
          const tx = await signer.sendTransaction({
            to: VAULT_CONFIG.address,
            value: ethers.parseEther(amountPLS.toString())
          });
          return tx;
        } catch (e) {
          console.error('Error depositing PLS:', e);
          throw e;
        }
      },
      
      // Withdraw PLS from vault (V2 uses withdraw(amount))
      withdrawPLS: async (signer, amountPLS) => {
        try {
          const vault = VaultUtil.getContract(signer);
          const tx = await vault.withdraw(ethers.parseEther(amountPLS.toString()));
          return tx;
        } catch (e) {
          console.error('Error withdrawing PLS:', e);
          throw e;
        }
      },
      
      // Deposit ERC20 token to vault (requires approval first)
      depositToken: async (signer, tokenAddress, amount, decimals = 18) => {
        try {
          const vault = VaultUtil.getContract(signer);
          const token = new ethers.Contract(tokenAddress, ERC20_ABI, signer);
          
          // Parse amount with correct decimals
          const parsedAmount = ethers.parseUnits(amount.toString(), decimals);
          
          // First approve vault to spend tokens
          const approveTx = await token.approve(VAULT_CONFIG.address, parsedAmount);
          await approveTx.wait();
          
          // Then deposit (V2 uses depositToken)
          const depositTx = await vault.depositToken(tokenAddress, parsedAmount);
          return depositTx;
        } catch (e) {
          console.error('Error depositing token:', e);
          throw e;
        }
      },
      
      // Withdraw ERC20 token from vault (V2 uses withdrawToken)
      withdrawToken: async (signer, tokenAddress, amount, decimals = 18) => {
        try {
          const vault = VaultUtil.getContract(signer);
          const parsedAmount = ethers.parseUnits(amount.toString(), decimals);
          const tx = await vault.withdrawToken(tokenAddress, parsedAmount);
          return tx;
        } catch (e) {
          console.error('Error withdrawing token:', e);
          throw e;
        }
      },
      
      // Execute atomic arb (V2 uses executeArb with flags)
      executeArbPLS: async (signer, path, amountInPLS, minProfitPLS = 0, gasBoost = true) => {
        try {
          const vault = VaultUtil.getContract(signer);
          
          // Get gas settings - boost by default for speed
          let gasOptions = {};
          if (gasBoost) {
            const feeData = await signer.provider.getFeeData();
            const boostedGasPrice = (feeData.gasPrice * 150n) / 100n; // 1.5x gas price
            gasOptions = { gasPrice: boostedGasPrice };
          }
          
          // V2 executeArb: path, amountIn, minProfit, usePLSForMissing, convertEndToPLS
          const tx = await vault.executeArb(
            path,
            ethers.parseEther(amountInPLS.toString()),
            ethers.parseEther(minProfitPLS.toString()),
            true,   // usePLSForMissing - start from PLS
            true,   // convertEndToPLS - end with PLS
            gasOptions
          );
          return tx;
        } catch (e) {
          console.error('Error executing arb:', e);
          throw e;
        }
      },
      
      // Get quote for a path (may not exist in V2)
      getQuote: async (provider, path, amountIn) => {
        try {
          // V2 may not have getQuote - return 0
          console.log('getQuote not available in V2');
          return 0n;
        } catch (e) {
          console.error('Error getting quote:', e);
          return 0n;
        }
      }
    };

    // Fetch pair data from GeckoTerminal (for pairs not in DexScreener)
    const fetchPairFromGeckoTerminal = async (pairAddress) => {
      try {
        const res = await fetch(`https://api.geckoterminal.com/api/v2/networks/pulsechain/pools/${pairAddress}?include=base_token,quote_token`);
        if (!res.ok) return null;
        const data = await res.json();
        const pool = data?.data;
        if (!pool) return null;
        
        const attrs = pool.attributes || {};
        
        // Parse token symbols from the "name" field (format: "TOKEN1 / TOKEN2")
        let baseSymbol = '?', quoteSymbol = '?';
        let baseAddress = '', quoteAddress = '';

      // Calculate changes over different time periods
      getChanges(tokenData, currentMcap, currentLiquidity) {
        if (!tokenData || !tokenData.snapshots || tokenData.snapshots.length === 0) {
          return { mcap: {}, liquidity: {} };
        }
        
        const snapshots = tokenData.snapshots.sort((a, b) => new Date(b.date) - new Date(a.date));
        const today = new Date();
        
        const findSnapshotDaysAgo = (days) => {
          const targetDate = new Date(today);
          targetDate.setDate(targetDate.getDate() - days);
          const targetStr = targetDate.toISOString().split('T')[0];
          
          // Find closest snapshot to target date (within 2 days tolerance)
          return snapshots.find(s => {
            const snapDate = new Date(s.date);
            const diffDays = Math.abs((today - snapDate) / (1000 * 60 * 60 * 24));
            return diffDays >= days - 1 && diffDays <= days + 1;
          });
        };
        
        const calcChange = (current, historical) => {
          if (!historical || historical === 0) return null;
          return ((current - historical) / historical) * 100;
        };
        
        const snap1d = findSnapshotDaysAgo(1);
        const snap7d = findSnapshotDaysAgo(7);
        const snap30d = findSnapshotDaysAgo(30);
        
        return {
          mcap: {
            d1: snap1d ? calcChange(currentMcap, snap1d.mcap) : null,
            d7: snap7d ? calcChange(currentMcap, snap7d.mcap) : null,
            d30: snap30d ? calcChange(currentMcap, snap30d.mcap) : null
          },
          liquidity: {
            d1: snap1d ? calcChange(currentLiquidity, snap1d.liquidity) : null,
            d7: snap7d ? calcChange(currentLiquidity, snap7d.liquidity) : null,
            d30: snap30d ? calcChange(currentLiquidity, snap30d.liquidity) : null
          }
        };

          const response = await fetch(PULSECHAIN_RPC, {

    const GeckoTerminalAPI = {
      // Fetch daily OHLCV for a pool (up to 6 months) with retry logic
      fetchPoolOHLCV: async (poolAddress, retries = 2) => {
        const url = `https://api.geckoterminal.com/api/v2/networks/pulsechain/pools/${poolAddress}/ohlcv/day?limit=90`;
        
        for (let attempt = 0; attempt < retries; attempt++) {
          try {
            const res = await fetch(url);
            
            // If rate limited (429), wait and retry
            if (res.status === 429) {
              const waitTime = Math.pow(2, attempt + 1) * 1000;
              await new Promise(r => setTimeout(r, waitTime));
              continue;
            }
            
            if (!res.ok) return null;
            const data = await res.json();
            return data?.data?.attributes?.ohlcv_list || [];
          } catch (e) {
            if (attempt < retries - 1) {
              await new Promise(r => setTimeout(r, 1000));
              continue;
            }
            return null;
          }
        }
        return null;

          return { '7': 0, '30': 0, '90': 0, actualDays: 0 };
        }
        
        const now = Date.now() / 1000;
        let vol7 = 0, vol30 = 0, vol90 = 0;
        let daysWithVolume = 0; // Count days with actual volume
        const cutoff7 = now - (7 * 86400);
        const cutoff30 = now - (30 * 86400);
        const cutoff90 = now - (90 * 86400);
        
        ohlcvList.forEach(candle => {
          const ts = candle[0];
          const vol = candle[5] || 0;
          if (vol > 0) daysWithVolume++; // Only count days with volume
          if (ts >= cutoff7) vol7 += vol;
          if (ts >= cutoff30) vol30 += vol;
          if (ts >= cutoff90) vol90 += vol;
        });

          '7': vol7, 
          '30': vol30, 
          '90': vol90, 
          actualDays: daysWithVolume // Use actual trading days, not array length
        };
      },
      
      // Calculate volume with period-over-period changes
      // Returns current period volume AND previous period volume for comparison
      calculateVolumesWithChanges: (ohlcvList) => {
        if (!ohlcvList || !ohlcvList.length) {
          return { 
            vol1: 0, vol7: 0, vol30: 0,
            prevVol1: 0, prevVol7: 0, prevVol30: 0,
            actualDays: 0 
          };
        }
        
        const now = Date.now() / 1000;
        let vol1 = 0, vol7 = 0, vol30 = 0;
        let prevVol1 = 0, prevVol7 = 0, prevVol30 = 0;
        let daysWithVolume = 0;
        
        // Current periods
        const cutoff1 = now - (1 * 86400);
        const cutoff7 = now - (7 * 86400);
        const cutoff30 = now - (30 * 86400);
        
        // Previous periods (for comparison)
        const cutoff1prev = now - (2 * 86400);   // 1-2 days ago
        const cutoff7prev = now - (14 * 86400);  // 7-14 days ago
        const cutoff30prev = now - (60 * 86400); // 30-60 days ago
        
        ohlcvList.forEach(candle => {
          const ts = candle[0];
          const vol = candle[5] || 0;
          if (vol > 0) daysWithVolume++;
          
          // Current periods
          if (ts >= cutoff1) vol1 += vol;
          if (ts >= cutoff7) vol7 += vol;
          if (ts >= cutoff30) vol30 += vol;
          
          // Previous periods (for change calculation)
          if (ts >= cutoff1prev && ts < cutoff1) prevVol1 += vol;
          if (ts >= cutoff7prev && ts < cutoff7) prevVol7 += vol;
          if (ts >= cutoff30prev && ts < cutoff30) prevVol30 += vol;
        });
        
        return { 
          vol1, vol7, vol30,
          prevVol1, prevVol7, prevVol30,
          actualDays: daysWithVolume
        };
      },
      
      // Calculate price trends from OHLCV data
      // Returns: { change7d, change30d, avg7d, currentPrice, isDip }
      calculatePriceTrends: (ohlcvList) => {
        if (!ohlcvList || ohlcvList.length < 2) {
          return { change7d: 0, change30d: 0, avg7d: 0, currentPrice: 0, isDip: false, dipPercent: 0 };
        }
        
        // OHLCV sorted newest first: [timestamp, open, high, low, close, volume]
        const sorted = [...ohlcvList].sort((a, b) => b[0] - a[0]);
        const currentPrice = sorted[0]?.[4] || 0; // Most recent close
        
        // Find price ~7 days ago and ~30 days ago
        const now = Date.now() / 1000;
        const cutoff7 = now - (7 * 86400);
        const cutoff30 = now - (30 * 86400);
        
        let price7dAgo = currentPrice;
        let price30dAgo = currentPrice;
        let sum7d = 0, count7d = 0;
        
        for (const candle of sorted) {
          const ts = candle[0];
          const close = candle[4] || 0;
          
          // Calculate 7-day average
          if (ts >= cutoff7) {
            sum7d += close;
            count7d++;
          }
          
          // Find closest price to 7 days ago
          if (ts <= cutoff7 && price7dAgo === currentPrice) {
            price7dAgo = close;
          }
          
          // Find closest price to 30 days ago
          if (ts <= cutoff30 && price30dAgo === currentPrice) {
            price30dAgo = close;
          }
        }
        
        const avg7d = count7d > 0 ? sum7d / count7d : currentPrice;
        const change7d = price7dAgo > 0 ? ((currentPrice - price7dAgo) / price7dAgo) * 100 : 0;
        const change30d = price30dAgo > 0 ? ((currentPrice - price30dAgo) / price30dAgo) * 100 : 0;
        const dipPercent = avg7d > 0 ? ((currentPrice - avg7d) / avg7d) * 100 : 0;
        const isDip = dipPercent < -3; // More than 3% below 7-day average
        
        return { change7d, change30d, avg7d, currentPrice, isDip, dipPercent };
      },
      
      // Check if a token symbol is a stablecoin
      // Note: On PulseChain, forked tokens like pDAI are NOT stablecoins (they're not pegged)
      // Only include actually pegged stablecoins
      isStablecoin: (symbol) => {
        const stablecoins = ['USDC', 'USDT', 'BUSD', 'TUSD', 'USDP', 'FRAX', 'LUSD', 'GUSD', 'SUSD', 'MIM', 'DOLA', 'USDD', 'PYUSD', 'EUSD', 'CRVUSD'];
        return stablecoins.includes(symbol?.toUpperCase());
      }
    };

    // Historical data store with efficient caching
    const HistoricalDataStore = {
      // Cache OHLCV results per pool (not per pool+days)
      poolCache: {},
      cacheKey: 'proweb_ohlcv_v4_actual', // Changed to use actual trading days
      
      // Load from localStorage
      loadCache: () => {
        try {
          const cached = localStorage.getItem(HistoricalDataStore.cacheKey);
          if (cached) {
            const { data, timestamp } = JSON.parse(cached);
            // Cache valid for 1 hour (reduced from 4 to get fresher data)
            if (Date.now() - timestamp < 3600000) {
              HistoricalDataStore.poolCache = data;
              return true;
            }
          }
        } catch(e) {}
        return false;
      },
      
      // Save to localStorage
      saveCache: () => {
        try {
          localStorage.setItem(HistoricalDataStore.cacheKey, JSON.stringify({
            data: HistoricalDataStore.poolCache,
            timestamp: Date.now()
          }));
        } catch(e) {}
      },
      
      // Get all historical volumes for a pool (one fetch, all periods)
      getPoolVolumes: async (poolAddress, vol24h) => {
        // Check cache first
        if (HistoricalDataStore.poolCache[poolAddress]) {
          return HistoricalDataStore.poolCache[poolAddress];
        }
        
        // Fetch from GeckoTerminal (single call for all periods)
        const ohlcv = await GeckoTerminalAPI.fetchPoolOHLCV(poolAddress);
        
        if (ohlcv && ohlcv.length > 0) {
          const volumes = GeckoTerminalAPI.calculateVolumes(ohlcv);
          const actualDays = volumes.actualDays; // Days with actual trading volume
          
          // For periods longer than our actual data, use the same total volume
          // This prevents fake scaling - if we have 4 days, all periods show 4-day total
          const result = {
            '1': { volume: vol24h, actualDays: 1 },
            '7': { volume: volumes['7'], actualDays: Math.min(7, actualDays) },
            '30': { volume: volumes['30'], actualDays: Math.min(30, actualDays) },
            '90': { volume: volumes['90'], actualDays: Math.min(90, actualDays) }
          };
          
          // Ensure at least 24h volume (historical might not include today)
          if (result['7'].volume < vol24h) result['7'].volume = vol24h;
          if (result['30'].volume < vol24h) result['30'].volume = vol24h;
          if (result['90'].volume < vol24h) result['90'].volume = vol24h;
          
          // console.log(`OHLCV for ${poolAddress.slice(0,8)}: ${actualDays} days, vol7=${volumes['7'].toFixed(0)}, vol30=${volumes['30'].toFixed(0)}, vol90=${volumes['90'].toFixed(0)}`);
          
          HistoricalDataStore.poolCache[poolAddress] = result;
          return result;
        }
        
        // Fallback: NO estimation - only use actual 24h data
        const noHistoricalData = {
          '1': { volume: vol24h, actualDays: 1 },
          '7': { volume: vol24h, actualDays: 1 },
          '30': { volume: vol24h, actualDays: 1 },
          '90': { volume: vol24h, actualDays: 1 }
        };
        HistoricalDataStore.poolCache[poolAddress] = noHistoricalData;
        return noHistoricalData;
      },
      
      // Legacy - keep for compatibility
      getKey: (t) => `proweb_hist_${t}`,
      getHistory: (t) => { try { const s = localStorage.getItem(HistoricalDataStore.getKey(t)); return s ? JSON.parse(s) : {}; } catch(e){ return {}; } },
      saveSnapshot: (t, pairs) => {
        const key = HistoricalDataStore.getKey(t);
        const today = new Date().toISOString().split('T')[0];
        let history = {};
        try { const s = localStorage.getItem(key); if(s) history = JSON.parse(s); } catch(e){}
        if(!history[today]) {
          const snap = {};
          pairs.forEach(p => { if(p.pairAddress) snap[p.pairAddress] = { vol: p.volume?.h24||0, liq: p.liquidity?.usd||0 }; });
          history[today] = snap;
          const dates = Object.keys(history).sort();
          if(dates.length > 90) dates.slice(0, dates.length-90).forEach(d => delete history[d]);
          try { localStorage.setItem(key, JSON.stringify(history)); } catch(e){}
        }
        return history;
      }
    };

    // Hook to fetch historical data for all pairs of a token - OPTIMIZED
    const useHistoricalVolume = (pairs, tokenName) => {
      const [historicalData, setHistoricalData] = useState({});
      const [loading, setLoading] = useState(true);
      const fetchedTokenRef = React.useRef('');
      const abortRef = React.useRef(false);
      
      useEffect(() => {
        // Load cache on mount
        HistoricalDataStore.loadCache();
      }, []);
      
      useEffect(() => {
        // If token changed, don't clear data immediately
        if (fetchedTokenRef.current !== tokenName) {
          setLoading(true);
          fetchedTokenRef.current = tokenName;
        }
        
        // Skip if no pairs yet
        if (!pairs || pairs.length === 0) {
          setLoading(false);
          return;
        }
        
        abortRef.current = false;
        
        const fetchAllHistory = async () => {
          const qualifyingPairs = pairs.filter(p => (p.liquidity || 0) >= MIN_LIQUIDITY);
          if (qualifyingPairs.length === 0) {
            setLoading(false);
            return;
          }
          
          const results = {};
          let fetchCount = 0;
          const maxConcurrent = 3; // Fetch up to 3 at a time
          
          // First pass: use cache for immediate display
          for (const pair of qualifyingPairs) {
            if (!pair.pairAddress) continue;
            const cached = HistoricalDataStore.poolCache[pair.pairAddress];
            if (cached) {
              results[pair.pairAddress] = cached;
            } else {
              // Set initial data while fetching - NO estimation, just use 24h as placeholder
              const vol24h = pair.volume24h || 0;
              results[pair.pairAddress] = {
                '1': { volume: vol24h, actualDays: 1 },
                '7': { volume: vol24h, actualDays: 1 },  // Will be replaced with actual data
                '30': { volume: vol24h, actualDays: 1 }, // Will be replaced with actual data
                '90': { volume: vol24h, actualDays: 1 }  // Will be replaced with actual data
              };
            }
          }
          
          // Show cached/estimated data immediately
          if (!abortRef.current) {
            setHistoricalData({...results});
          }
          
          // Second pass: fetch uncached pairs (one fetch per pair for all periods)
          const uncachedPairs = qualifyingPairs.filter(p => 
            p.pairAddress && !HistoricalDataStore.poolCache[p.pairAddress]
          );
          
          // Process in batches
          for (let i = 0; i < uncachedPairs.length; i += maxConcurrent) {
            if (abortRef.current) return;
            
            const batch = uncachedPairs.slice(i, i + maxConcurrent);
            
            // Fetch batch in parallel
            await Promise.all(batch.map(async (pair) => {
              if (abortRef.current) return;
              
              try {
                const vol24h = pair.volume24h || 0;
                const data = await HistoricalDataStore.getPoolVolumes(pair.pairAddress, vol24h);
                results[pair.pairAddress] = data;
                fetchCount++;
                
                // Update progressively every few fetches
                if (fetchCount % 2 === 0 && !abortRef.current) {
                  setHistoricalData({...results});
                }
              } catch(e) {
                // Keep estimated data on error
              }
            }));
            
            // Small delay between batches to respect rate limits
            if (i + maxConcurrent < uncachedPairs.length) {
              await new Promise(r => setTimeout(r, 300));
            }
          }
          
          // Save cache after all fetches
          HistoricalDataStore.saveCache();
          
          // Final update
          if (!abortRef.current) {
            setHistoricalData({...results});
            setLoading(false);
          }
        };
        
        fetchAllHistory();
        
        return () => { abortRef.current = true; };
      }, [tokenName, pairs]);
      
      return { historicalData, loading };
    };

    const fmtDollar = (n) => (n==null||isNaN(n)) ? '—' : '$'+Math.floor(n).toLocaleString('en-US');
    const fmtNum = (n) => (n==null||isNaN(n)) ? '—' : Math.floor(n).toLocaleString('en-US');
    const fmtNumDecimal = (n, d=2) => (n==null||isNaN(n)) ? '—' : n.toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
    const fmtPrice = (p) => {
      if(p==null||isNaN(p)) return '—';
      if(p < 0.00000001) return p.toExponential(4);
      if(p < 0.0001) return p.toFixed(10);
      if(p < 1) return p.toFixed(6);
      return p.toFixed(4);
    };
    
    // Price display with subscript notation for many zeros (like DexScreener)
    // e.g., 0.0000061070 → 0.0₅6107
    const PriceDisplay = ({ price, className = '' }) => {
      if (price == null || isNaN(price)) return <span className={className}>—</span>;
      
      // For prices >= 0.001, just show normally
      if (price >= 0.001) {
        const formatted = price >= 1 ? price.toFixed(4) : price.toFixed(6);
        return <span className={className}>${formatted}</span>;
      }
      
      // Count zeros after decimal point
      const priceStr = price.toFixed(20);
      const afterDecimal = priceStr.split('.')[1] || '';
      let zeroCount = 0;
      for (let i = 0; i < afterDecimal.length; i++) {
        if (afterDecimal[i] === '0') zeroCount++;
        else break;
      }
      
      // If 4 or more zeros, use subscript notation
      if (zeroCount >= 4) {
        // Get significant digits (4-5 digits after the zeros)
        const significantPart = afterDecimal.slice(zeroCount, zeroCount + 4);
        return (
          <span className={className}>
            $0.0<sub className="text-[0.65em] opacity-70">{zeroCount}</sub>{significantPart}
          </span>
        );
      }
      
      // Otherwise show normally
      return <span className={className}>${price.toFixed(8)}</span>;
    };
    
    // Format DEX ID nicely
    const formatDexId = (dexId) => {
      if (!dexId) return 'DEX';
      const mapping = {
        'pulsex': 'PulseX V2',  // Default to V2 since most active pairs are V2
        'pulsex-v1': 'PulseX V1',
        'pulsex-v2': 'PulseX V2',
        'pulsexv2': 'PulseX V2',
        'pulsex_v2': 'PulseX V2',
        '9inch': '9inch',
        '9mm': '9mm',
        'uniswap': 'Uniswap'
      };
      return mapping[dexId.toLowerCase()] || dexId;
    };
    
    // Fetch pair reserves from blockchain
    const fetchPairReserves = async (pairAddress) => {
      const RPC_URL = 'https://rpc.pulsechain.com';
      
      try {
        // getReserves() selector: 0x0902f1ac
        const reservesCall = await fetch(RPC_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            jsonrpc: '2.0',
            method: 'eth_call',
            params: [{ to: pairAddress, data: '0x0902f1ac' }, 'latest'],
            id: 1
          })
        });
        const reservesData = await reservesCall.json();
        
        // token0() selector: 0x0dfe1681
        const token0Call = await fetch(RPC_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            jsonrpc: '2.0',
            method: 'eth_call',
            params: [{ to: pairAddress, data: '0x0dfe1681' }, 'latest'],
            id: 2
          })
        });
        const token0Data = await token0Call.json();
        
        // token1() selector: 0xd21220a7
        const token1Call = await fetch(RPC_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            jsonrpc: '2.0',
            method: 'eth_call',
            params: [{ to: pairAddress, data: '0xd21220a7' }, 'latest'],
            id: 3
          })
        });
        const token1Data = await token1Call.json();
        
        if (reservesData.result && token0Data.result && token1Data.result) {
          // Parse reserves (each is 112 bits = 28 hex chars, padded to 32 bytes)
          const result = reservesData.result.slice(2); // remove 0x
          const reserve0Hex = result.slice(0, 64);
          const reserve1Hex = result.slice(64, 128);
          
          const reserve0 = BigInt('0x' + reserve0Hex);
          const reserve1 = BigInt('0x' + reserve1Hex);
          
          const token0Addr = '0x' + token0Data.result.slice(26);
          const token1Addr = '0x' + token1Data.result.slice(26);
          
          return { reserve0, reserve1, token0: token0Addr, token1: token1Addr };
        }
      } catch (e) {
        console.error('Error fetching reserves:', e);
      }
      return null;
    };
    
    // Pair Details Modal
    const PairDetailsModal = ({ isOpen, onClose, pair, theme }) => {
      const [reserves, setReserves] = useState(null);
      const [loading, setLoading] = useState(false);
      const [logoErrors, setLogoErrors] = useState({});
      
      useEffect(() => {
        if (isOpen && pair?.pairAddress) {
          setLoading(true);
          setLogoErrors({});
          fetchPairReserves(pair.pairAddress).then(data => {
            setReserves(data);
            setLoading(false);
          });
        }
      }, [isOpen, pair?.pairAddress]);
      
      if (!isOpen) return null;
      
      const baseToken = pair?.baseToken;
      const quoteToken = pair?.quoteToken;
      
      // Get token logos - use shared getLogoUrl for bridged token fallbacks
      const baseLogoUrl = baseToken?.address ? getLogoUrl(baseToken.address) : null;
      const quoteLogoUrl = quoteToken?.address ? getLogoUrl(quoteToken.address) : null;
      
      // Known token decimals (most are 18, but some differ)
      const knownDecimals = {
        '0x2b591e99afe9f32eaa6214f7b7629768c40eeb39': 8,  // HEX
        '0x57fde0a71132198bbec939b98976993d8d89d225': 8,  // eHEX (Ethereum HEX on PulseChain)
        '0x2260fac5e5542a773aa44fbcfedf7c193bc2c599': 8,  // WBTC
        '0xb17d901469b9208b17d916112988a3fed19b5ca1': 8,  // pWBTC
        '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48': 6,  // USDC
        '0x15d38573d2feeb82e7ad5187ab8c1d52810b1f07': 6,  // pUSDC
        '0xdac17f958d2ee523a2206206994597c13d831ec7': 6,  // USDT
        '0x0cb6f5a34ad42ec934882a05265a7d5f59b51a2f': 6,  // pUSDT
      };
      
      const getDecimals = (addr) => {
        if (!addr) return 18;
        return knownDecimals[addr.toLowerCase()] || 18;
      };
      
      const baseDecimals = getDecimals(baseToken?.address);
      const quoteDecimals = getDecimals(quoteToken?.address);
      
      // Match reserves to tokens
      let baseReserve = null, quoteReserve = null;
      if (reserves && baseToken && quoteToken) {
        const token0Lower = reserves.token0.toLowerCase();
        const baseAddrLower = baseToken.address?.toLowerCase();
        
        if (token0Lower === baseAddrLower) {
          baseReserve = reserves.reserve0;
          quoteReserve = reserves.reserve1;
        } else {
          baseReserve = reserves.reserve1;
          quoteReserve = reserves.reserve0;
        }
      }
      
      // Format large numbers with decimals
      const formatTokenAmount = (amount, decimals = 18) => {
        if (amount === null) return { formatted: '—', raw: 0 };
        const divisor = BigInt(10 ** decimals);
        const whole = amount / divisor;
        const remainder = amount % divisor;
        const decimal = remainder.toString().padStart(decimals, '0').slice(0, 2);
        const raw = Number(whole) + Number(remainder) / (10 ** decimals);
        return { 
          formatted: Number(whole).toLocaleString() + '.' + decimal,
          raw: raw
        };
      };
      
      // Calculate USD values
      // Base token price can be derived from priceUsd and priceNative
      const basePrice = parseFloat(pair?.priceUsd) || 0;
      const quotePrice = pair?.priceNative ? (basePrice / parseFloat(pair.priceNative)) : 0;
      
      const baseAmount = formatTokenAmount(baseReserve, baseDecimals);
      const quoteAmount = formatTokenAmount(quoteReserve, quoteDecimals);
      
      const baseUsdValue = baseAmount.raw * basePrice;
      const quoteUsdValue = quoteAmount.raw * quotePrice;
      const totalPoolValue = pair?.liquidity || pair?.liquidity?.usd || (baseUsdValue + quoteUsdValue);
      
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay bg-black/70" onClick={e => e.stopPropagation()}>
          <div className={`${theme.card} border ${theme.border} rounded-xl p-6 max-w-md w-full mx-4 shadow-2xl`}>
            <div className="flex justify-between items-center mb-4">
              <h3 className={`font-orbitron font-bold text-2xl ${theme.text}`}>Pool Details</h3>
              <button 
                onClick={onClose} 
                className="text-gray-400 hover:text-white text-2xl leading-none px-2 transition-colors"
              >
                &times;
              </button>
            </div>
            
            <div className="space-y-4">
              {/* Pair Header with Logos */}
              <div className="bg-black/30 rounded-lg p-4">
                <div className="flex items-center justify-center gap-3 mb-2">
                  {/* Base Token Logo */}
                  {!logoErrors.base && baseLogoUrl ? (
                    <img 
                      src={baseLogoUrl} 
                      alt={baseToken?.symbol} 
                      className="w-14 h-14 rounded-full bg-black/50"
                      onError={() => setLogoErrors(prev => ({...prev, base: true}))}
                    />
                  ) : (
                    <div className="w-14 h-14 rounded-full bg-gray-700 flex items-center justify-center text-xl font-bold text-gray-400">
                      {baseToken?.symbol?.[0] || '?'}
                    </div>
                  )}
                  
                  <span className="text-gray-500 text-3xl">+</span>
                  
                  {/* Quote Token Logo */}
                  {!logoErrors.quote && quoteLogoUrl ? (
                    <img 
                      src={quoteLogoUrl} 
                      alt={quoteToken?.symbol} 
                      className="w-14 h-14 rounded-full bg-black/50"
                      onError={() => setLogoErrors(prev => ({...prev, quote: true}))}
                    />
                  ) : (
                    <div className="w-14 h-14 rounded-full bg-gray-700 flex items-center justify-center text-xl font-bold text-gray-400">
                      {quoteToken?.symbol?.[0] || '?'}
                    </div>
                  )}
                </div>
                <div className={`font-bold text-2xl text-center ${theme.text}`}>{baseToken?.symbol}/{quoteToken?.symbol}</div>
                <div className="text-gray-500 text-base text-center">{formatDexId(pair?.dexId)}</div>
              </div>
              
              {/* Total Pool Value */}
              <div className="bg-black/30 rounded-lg p-4 text-center">
                <div className="text-gray-400 text-base mb-1">Total Pool Value</div>
                <div className={`font-bold text-3xl ${theme.text}`}>{fmtDollar(totalPoolValue)}</div>
              </div>
              
              {/* Reserves with USD Values */}
              <div className="bg-black/30 rounded-lg p-4">
                <div className="text-gray-400 text-base mb-3">Pool Reserves</div>
                {loading ? (
                  <div className="text-gray-500 text-center py-4 text-base">Loading reserves...</div>
                ) : reserves ? (
                  <div className="space-y-4">
                    {/* Base Token */}
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        {!logoErrors.base && baseLogoUrl ? (
                          <img src={baseLogoUrl} alt="" className="w-9 h-9 rounded-full bg-black/50" onError={() => setLogoErrors(prev => ({...prev, base: true}))} />
                        ) : (
                          <div className="w-9 h-9 rounded-full bg-gray-700 flex items-center justify-center text-sm font-bold text-gray-400">{baseToken?.symbol?.[0]}</div>
                        )}
                        <span className="text-white font-medium text-lg">{baseToken?.symbol}</span>
                      </div>
                      <div className="text-right">
                        <div className="text-white font-mono text-lg">{baseAmount.formatted}</div>
                        <div className="text-gray-500 text-base">{fmtDollar(baseUsdValue)}</div>
                      </div>
                    </div>
                    
                    {/* Quote Token */}
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        {!logoErrors.quote && quoteLogoUrl ? (
                          <img src={quoteLogoUrl} alt="" className="w-9 h-9 rounded-full bg-black/50" onError={() => setLogoErrors(prev => ({...prev, quote: true}))} />
                        ) : (
                          <div className="w-9 h-9 rounded-full bg-gray-700 flex items-center justify-center text-sm font-bold text-gray-400">{quoteToken?.symbol?.[0]}</div>
                        )}
                        <span className="text-white font-medium text-lg">{quoteToken?.symbol}</span>
                      </div>
                      <div className="text-right">
                        <div className="text-white font-mono text-lg">{quoteAmount.formatted}</div>

              {/* Additional Stats */}
              <div className="grid grid-cols-2 gap-3">

                </div>
                <div className="bg-black/30 rounded-lg p-3">
                  <div className="text-gray-400 text-sm">Vol/Liq Ratio</div>
                  <div className="text-white font-bold text-lg">{((pair?.volume24h || pair?.volume?.h24 || 0) / (pair?.liquidity || pair?.liquidity?.usd || 1)).toFixed(3)}x</div>
                </div>
                <div className="bg-black/30 rounded-lg p-3">
                  <div className="text-gray-400 text-sm">24h Buys</div>
                  <div className="text-green-400 font-bold text-lg">{pair?.txns?.h24?.buys || 0}</div>
                </div>
                <div className="bg-black/30 rounded-lg p-3">
                  <div className="text-gray-400 text-sm">24h Sells</div>
                  <div className="text-red-400 font-bold text-lg">{pair?.txns?.h24?.sells || 0}</div>

              {/* Contract Address */}
              <div className="bg-black/30 rounded-lg p-3">

    };
    
    // Treasury Modal - Shows all paired tokens aggregated
    const TreasuryModal = ({ isOpen, onClose, pairs, theme, tokenName, tokenContract, tokenLogo }) => {
      const [treasuryData, setTreasuryData] = useState([]);
      const [loading, setLoading] = useState(false);
      const [totalValue, setTotalValue] = useState(0);
      const [logoErrors, setLogoErrors] = useState({});
      const fetchedRef = React.useRef(false);
      
      // Safe theme with primary color
      const safeTheme = theme || { primary: '#22c55e' };
      
      // Get logo URL for main token
      const mainLogoUrl = tokenLogo || (tokenContract ? getLogoUrl(tokenContract) : null);
      
      // Generate theme-colored scrollbar style
      const scrollbarStyle = `
        .treasury-theme-scroll::-webkit-scrollbar { width: 10px; }
        .treasury-theme-scroll::-webkit-scrollbar-track { background: ${safeTheme.primary}15; border-radius: 5px; }
        .treasury-theme-scroll::-webkit-scrollbar-thumb { background: ${safeTheme.primary}50; border-radius: 5px; }
        .treasury-theme-scroll::-webkit-scrollbar-thumb:hover { background: ${safeTheme.primary}80; }
        .treasury-theme-scroll { scrollbar-width: thin; scrollbar-color: ${safeTheme.primary}50 ${safeTheme.primary}15; }
      `;
      
      // Create stable key to detect real changes
      const pairsKey = useMemo(() => {
        if (!pairs || pairs.length === 0) return '';
        // Include pairs >= $1K liquidity OR from GitHub (user invested)
        return pairs.filter(p => (p.liquidity || 0) >= 1000 || p._source === 'github' || p._source === 'geckoterminal' || p._source === 'dexscreener-enriched')
          .map(p => p.pairAddress)
          .filter(Boolean)
          .sort()
          .join(',');
      }, [pairs]);
      
      useEffect(() => {
        if (!isOpen || !pairs || pairs.length === 0 || !pairsKey) return;
        
        // Skip if we already fetched for this combination
        if (fetchedRef.current === pairsKey) return;
        fetchedRef.current = pairsKey;
        
        const fetchTreasury = async () => {
          setLoading(true);
          const tokenTotals = {};
          let grandTotal = 0;
          
          // Filter pairs with liquidity >= $1K OR from GitHub (user invested)
          const qualifyingPairs = pairs.filter(p => (p.liquidity || 0) >= 1000 || p._source === 'github' || p._source === 'geckoterminal' || p._source === 'dexscreener-enriched');
          
          for (const pair of qualifyingPairs) {
            if (!pair.pairAddress) continue;
            
            try {
              const baseToken = pair.baseToken;
              const quoteToken = pair.quoteToken;
              
              // Determine which is our token and which is the paired token
              // Check by address first, fall back to symbol comparison
              const isBaseOurs = baseToken?.address?.toLowerCase() === tokenContract?.toLowerCase() 
                || (!baseToken?.address && baseToken?.symbol?.toUpperCase() === tokenName?.toUpperCase());
              const pairedToken = isBaseOurs ? quoteToken : baseToken;
              
              if (!pairedToken?.symbol) continue;
              
              // Calculate USD value - half of pool liquidity for the paired side
              const pairedValue = (pair.liquidity || 0) / 2;
              
              // Calculate paired token price from pair data
              // priceUsd = base token price, priceNative = base/quote ratio
              let pairedTokenPrice = 0;
              const priceUsd = parseFloat(pair.priceUsd) || 0;
              const priceNative = parseFloat(pair.priceNative) || 0;
              
              if (isBaseOurs && priceNative > 0) {
                // Our token is base, paired is quote
                // priceNative = how many quote tokens per 1 base token
                // So quote price = base price / priceNative
                pairedTokenPrice = priceUsd / priceNative;
              } else if (!isBaseOurs && priceUsd > 0) {
                // Our token is quote, paired is base
                // priceUsd is already the base (paired) token price
                pairedTokenPrice = priceUsd;
              }
              
              // Calculate quantity from USD value and price
              const reserveNum = pairedTokenPrice > 0 ? pairedValue / pairedTokenPrice : 0;
              
              const key = pairedToken.symbol;
              if (!tokenTotals[key]) {
                tokenTotals[key] = {
                  symbol: pairedToken.symbol,
                  address: pairedToken.address,
                  totalQty: 0,
                  totalValue: 0,
                  pairCount: 0
                };
              }
              
              tokenTotals[key].totalQty += reserveNum;
              tokenTotals[key].totalValue += pairedValue;
              tokenTotals[key].pairCount += 1;
              grandTotal += pairedValue;
              
            } catch (e) {
              console.error('Error processing pair', pair.pairAddress, e);
            }
          }
          
          // Sort by value descending
          const sorted = Object.values(tokenTotals).sort((a, b) => b.totalValue - a.totalValue);
          setTreasuryData(sorted);
          setTotalValue(grandTotal);
          setLoading(false);
        };
        
        fetchTreasury();
      }, [isOpen, pairsKey, tokenContract]);
      
      // Reset fetchedRef when modal closes
      useEffect(() => {
        if (!isOpen) {
          fetchedRef.current = false;
        }
      }, [isOpen]);
      
      if (!isOpen) return null;
      
      // Format quantity - show decimals for small amounts
      const formatQty = (n) => {
        if (n == null || isNaN(n)) return '—';
        if (n < 1000) {
          return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        return Math.floor(n).toLocaleString('en-US');
      };
      
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay bg-black/70" onClick={e => e.stopPropagation()}>
          <style>{scrollbarStyle}</style>
          <div className={`${theme.card} border ${theme.border} rounded-xl p-6 max-w-2xl w-full mx-4 shadow-2xl max-h-[80vh] overflow-hidden flex flex-col`}>
            <div className="flex justify-between items-center mb-4">
              <div className="flex items-center gap-3">
                {mainLogoUrl ? (
                  <img 
                    src={mainLogoUrl} 
                    alt={tokenName}
                    className="w-10 h-10 rounded-full bg-black/50"
                    onError={(e) => e.target.style.display = 'none'}
                  />
                ) : (
                  <div className="w-10 h-10 rounded-full bg-gray-700 flex items-center justify-center text-lg font-bold text-gray-400">
                    {tokenName?.[0] || '?'}
                  </div>
                )}
                <div>
                  <h3 className={`font-orbitron font-bold text-2xl ${theme.text}`}>{tokenName} Treasury</h3>
                  <p className="text-gray-500 text-sm">Assets paired with {tokenName}</p>
                </div>
              </div>
              <button 
                onClick={onClose} 
                className="text-gray-400 hover:text-white text-2xl leading-none px-2 transition-colors"
              >
                &times;
              </button>
            </div>
            
            {/* Total Value - Hero Section */}
            <div className="relative rounded-xl py-3 px-4 mb-4 overflow-hidden flex items-center justify-center" style={{background: 'linear-gradient(135deg, rgba(34, 197, 94, 0.15) 0%, rgba(16, 185, 129, 0.25) 50%, rgba(34, 197, 94, 0.15) 100%)'}}>
              <div className="absolute inset-0 rounded-xl border border-green-500/30"></div>
              <div className="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-gradient-to-r from-transparent via-green-400 to-transparent"></div>
              <div className="relative text-center">
                <div className="text-green-400/80 text-xs font-medium uppercase tracking-wider">Total Paired Value</div>
                <div className="font-space font-bold text-3xl text-green-400" style={{textShadow: '0 0 20px rgba(34, 197, 94, 0.4)'}}>{fmtDollar(totalValue)}</div>
              </div>
            </div>
            
            {/* Pie Chart */}
            {!loading && treasuryData.length > 0 && (
              <div className="mb-2 p-3 bg-black/20 rounded-xl">
                <div className="flex items-center justify-center gap-6">
                  {/* SVG Pie Chart - Separated Slices */}
                  <svg viewBox="0 0 100 100" className="w-48 h-48 flex-shrink-0">
                    {(() => {
                      const colors = ['#22c55e', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4', '#f97316', '#84cc16', '#ef4444', '#14b8a6', '#a855f7', '#eab308'];
                      const gapAngle = 0.04; // Small gap between slices
                      let cumulative = 0;
                      
                      return treasuryData.map((token, i) => {
                        const pct = totalValue > 0 ? (token.totalValue / totalValue) : 0;
                        if (pct < 0.01) {
                          cumulative += pct;
                          return null;
                        }
                        
                        const startAngle = cumulative * 2 * Math.PI + gapAngle;
                        cumulative += pct;
                        const endAngle = cumulative * 2 * Math.PI - gapAngle;
                        
                        if (endAngle <= startAngle) return null;
                        
                        // Calculate arc path
                        const x1 = 50 + 40 * Math.sin(startAngle);
                        const y1 = 50 - 40 * Math.cos(startAngle);
                        const x2 = 50 + 40 * Math.sin(endAngle);
                        const y2 = 50 - 40 * Math.cos(endAngle);
                        const largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
                        
                        return (
                          <path
                            key={i}
                            d={`M 50 50 L ${x1} ${y1} A 40 40 0 ${largeArc} 1 ${x2} ${y2} Z`}
                            fill={colors[i % colors.length]}
                          />
                        );
                      });
                    })()}
                    {/* Center circle */}
                    <circle cx="50" cy="50" r="18" fill="#0a0a0a"/>
                  </svg>
                  
                  {/* Legend */}
                  <div className="grid grid-cols-1 gap-y-1.5 max-h-60 overflow-y-auto treasury-theme-scroll">
                    {treasuryData.map((token, i) => {
                      const colors = ['#22c55e', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4', '#f97316', '#84cc16', '#ef4444', '#14b8a6', '#a855f7', '#eab308'];
                      const pct = totalValue > 0 ? ((token.totalValue / totalValue) * 100).toFixed(1) : 0;
                      return (
                        <div key={i} className="flex items-center gap-2">
                          <div className="w-4 h-4 rounded flex-shrink-0" style={{backgroundColor: colors[i % colors.length]}}></div>
                          <span className="text-white font-medium text-sm w-[60px]">{token.symbol}</span>
                          <span className="text-gray-400 text-sm w-[45px] text-right">{pct}%</span>
                          <span className="text-green-400 text-sm font-medium w-[60px] text-right">{fmtCompact(token.totalValue)}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}
            
            {/* Token List */}
            <div className="flex-1 overflow-y-auto treasury-theme-scroll pr-2">
              {loading ? (
                <div className="text-gray-500 text-center py-8 text-lg">Loading treasury data...</div>
              ) : treasuryData.length > 0 ? (
                <div className="space-y-0.5">
                  {/* Header */}
                  <div className="grid grid-cols-12 gap-2 px-3 py-1 text-gray-500 text-xs uppercase border-b border-white/10">
                    <div className="col-span-5">Token</div>
                    <div className="col-span-4 text-right">Quantity</div>
                    <div className="col-span-3 text-right">Value USD</div>
                  </div>
                  
                  {treasuryData.map((token, i) => {
                    const logoUrl = getLogoUrl(token.address, token.symbol);
                    
                    return (
                      <div key={i} className="grid grid-cols-12 gap-2 items-center bg-black/20 rounded px-3 py-1.5 hover:bg-black/30 transition-colors">
                        <div className="col-span-5 flex items-center gap-2">
                          {!logoErrors[token.symbol] && logoUrl ? (
                            <img 
                              src={logoUrl} 
                              alt={token.symbol}
                              className="w-6 h-6 rounded-full bg-black/50"
                              onError={() => setLogoErrors(prev => ({...prev, [token.symbol]: true}))}
                            />
                          ) : (
                            <div className="w-6 h-6 rounded-full bg-gray-700 flex items-center justify-center text-xs font-bold text-gray-400">
                              {token.symbol?.[0] || '?'}
                            </div>
                          )}
                          <div className="text-white font-medium text-sm">{token.symbol}</div>
                        </div>
                        <div className="col-span-4 text-right">
                          <div className="text-gray-300 font-mono text-sm">{formatQty(token.totalQty)}</div>
                        </div>
                        <div className="col-span-3 text-right">
                          <div className="font-bold text-base text-green-400">{fmtDollar(token.totalValue)}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div className="text-gray-500 text-center py-8 text-lg">No treasury data available</div>
              )}
            </div>
          </div>
        </div>
      );
    };
    
    const fmtCompact = (n) => {
      if(n==null||isNaN(n)) return '—';
      if(n >= 1e9) return '$'+(n/1e9).toFixed(2)+'B';
      if(n >= 1e6) return '$'+(n/1e6).toFixed(2)+'M';
      if(n >= 1e3) return '$'+(n/1e3).toFixed(2)+'K';
      return '$'+n.toFixed(2);
    };
    
    // Sea creature progress display for UFO burns
    const SeaCreatureProgress = ({ burnAmount, color = 'lime' }) => {
      if (!burnAmount || burnAmount <= 0) return null;
      
      let remaining = burnAmount;
      const SQUID = 9145068;
      const DOLPHIN = 91450679;
      const SHARK = 914506790;
      const WHALE = 9145067902;
      const POSEIDON = 91450679019;
      
      const poseidons = Math.floor(remaining / POSEIDON);
      remaining = remaining % POSEIDON;
      const whales = Math.floor(remaining / WHALE);
      remaining = remaining % WHALE;
      const sharks = Math.floor(remaining / SHARK);
      remaining = remaining % SHARK;
      const dolphins = Math.floor(remaining / DOLPHIN);
      remaining = remaining % DOLPHIN;
      const squids = Math.floor(remaining / SQUID);
      remaining = remaining % SQUID;
      
      const creatures = [];
      if (poseidons > 0) creatures.push({ emoji: '🔱', count: poseidons });
      if (whales > 0) creatures.push({ emoji: '🐋', count: whales });
      if (sharks > 0) creatures.push({ emoji: '🦈', count: sharks });
      if (dolphins > 0) creatures.push({ emoji: '🐬', count: dolphins });
      if (squids > 0) creatures.push({ emoji: '🦑', count: squids });
      
      let nextEmoji = '🦑';
      let nextThreshold = SQUID;
      
      if (burnAmount < SQUID) {
        nextEmoji = '🦑'; nextThreshold = SQUID;
      } else if (burnAmount < DOLPHIN) {
        nextEmoji = '🐬'; nextThreshold = DOLPHIN;
      } else if (burnAmount < SHARK) {
        nextEmoji = '🦈'; nextThreshold = SHARK;
      } else if (burnAmount < WHALE) {
        nextEmoji = '🐋'; nextThreshold = WHALE;
      } else {
        nextEmoji = '🔱'; nextThreshold = POSEIDON;
      }
      
      const progressToNext = (burnAmount % nextThreshold) / nextThreshold;
      
      const gradientColors = {
        lime: 'from-lime-500 to-lime-400',
        amber: 'from-amber-500 to-amber-400',
        orange: 'from-orange-500 to-orange-400',
        gray: 'from-gray-500 to-gray-400'
      };
      
      return (
        <div className="mt-2 pt-2 border-t border-white/10">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-1.5 flex-wrap">
              {creatures.length > 0 ? (
                creatures.map((c, i) => (
                  <span key={i} className="flex items-center">
                    {c.emoji}<span className="text-white text-xs font-bold">x{c.count}</span>
                  </span>
                ))
              ) : (
                <span className="text-gray-500 text-xs">Building to {nextEmoji}</span>
              )}
            </div>
            <div className="text-xs text-gray-500 whitespace-nowrap">
              {(progressToNext * 100).toFixed(0)}%→{nextEmoji}
            </div>
          </div>
          <div className="mt-1 h-1 bg-gray-700 rounded-full overflow-hidden">
            <div 
              className={`h-full bg-gradient-to-r ${gradientColors[color] || gradientColors.lime} rounded-full`}
              style={{ width: `${progressToNext * 100}%` }}
            />
          </div>
        </div>
      );
    };
    
    // Compact format for token quantities (no $ symbol)
    const fmtTokens = (n) => {
      if(n==null||isNaN(n)) return '—';
      if(n >= 1e9) return (n/1e9).toFixed(2)+'B';
      if(n >= 1e6) return (n/1e6).toFixed(2)+'M';
      if(n >= 1e3) return (n/1e3).toFixed(2)+'K';
      return n.toFixed(2);
    };

    // Calculate token age from launch date
    const getTokenAge = (launchDate) => {
      if (!launchDate) return null;
      const launch = new Date(launchDate);
      const now = new Date();
      const diffMs = now - launch;
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      
      if (diffDays < 0) return null;
      if (diffDays === 0) return 'Launched Today';
      if (diffDays === 1) return '1 Day Old';
      if (diffDays < 365) return `${diffDays} Days Old`;
      
      const years = Math.floor(diffDays / 365);
      const remainingDays = diffDays % 365;
      
      if (remainingDays === 0) {
        return years === 1 ? '1 Year Old' : `${years} Years Old`;
      }
      return years === 1 
        ? `1 Year + ${remainingDays} Days` 
        : `${years} Years + ${remainingDays} Days`;
    };

    const truncAddr = (a) => (!a||a==='Coming Soon') ? a : `${a.slice(0,6)}...${a.slice(-4)}`;

    const CopyBtn = ({ text }) => {
      const [copied, setCopied] = useState(false);
      const copy = async (e) => {
        e.stopPropagation();
        e.preventDefault();
        if(!text || text==='Coming Soon') return;
        try { 
          await navigator.clipboard.writeText(text); 
          setCopied(true); 
          setTimeout(()=>setCopied(false), 2000); 
        } catch(e){ console.log('copy failed', e); }
      };
      if(!text || text==='Coming Soon') return null;
      return (
        <button 
          onClick={copy} 
          className={`ml-1.5 p-1 rounded transition-all inline-flex items-center justify-center ${copied ? 'text-green-400' : 'text-gray-500 hover:text-gray-300'}`} 
          title="Copy address"
        >
          {copied ? <CheckIcon size={11} /> : <CopyIcon size={11} />}
        </button>
      );
    };

    const StatCard = ({ icon, label, value, change, theme }) => {
      const hasChange = change !== null && change !== undefined && !isNaN(change);
      const isUp = change > 0.5;
      const isDown = change < -0.5;
      const changeColor = isUp ? 'text-green-400' : isDown ? 'text-red-400' : 'text-gray-500';
      const arrow = isUp ? '▲' : isDown ? '▼' : '•';
      
      return (
        <div className={`${theme.card} ${theme.border} border rounded-xl p-4 flex flex-col`}>
          <div className="flex items-center gap-2 mb-2">
            <Icon name={icon} className={theme.text} size={16} />
            <span className="text-white text-sm font-semibold uppercase tracking-wide">{label}</span>
          </div>
          <div className={`text-xl font-bold ${theme.text} font-space`}>{value}</div>
          <div className={`text-sm mt-1 ${changeColor} font-medium`}>
            {hasChange ? `${arrow} ${Math.abs(change).toFixed(2)}%` : '—'}
          </div>
        </div>
      );
    };

    const LPPairRow = ({ pair, index, theme, topThree, mainTokenContract }) => {
      const liq = pair.liquidity || 0;
      const vol = pair.volume24h || 0;
      const ratio = liq > 0 ? vol/liq : 0;
      
      // Get buy/sell counts and price change from pair data
      const buys = pair.txns?.h24?.buys || 0;
      const sells = pair.txns?.h24?.sells || 0;
      const priceChange = pair.priceChange?.h24 || 0;
      const isUp = priceChange >= 0;
      
      // Determine the "other" token (not our main token)
      const isBaseMain = pair.baseToken?.address?.toLowerCase() === mainTokenContract?.toLowerCase();
      const otherToken = isBaseMain ? pair.quoteToken : pair.baseToken;
      const mainToken = isBaseMain ? pair.baseToken : pair.quoteToken;
      
      // Try other token logo first, then main token as fallback
      const logoUrl1 = otherToken?.address ? getLogoUrl(otherToken.address) : null;
      const logoUrl2 = mainToken?.address ? getLogoUrl(mainToken.address) : null;
      
      const [logoError, setLogoError] = useState(false);
      const [logo2Error, setLogo2Error] = useState(false);
      const [showDetails, setShowDetails] = useState(false);
      
      // Get first letter of other token for fallback
      const fallbackLetter = otherToken?.symbol?.[0] || '?';
      
      return (
        <>
          <div className={`${theme.card} ${theme.border} border rounded-lg p-3 sm:p-4 transition-all hover:border-opacity-60`}>
            {/* Mobile layout */}
            <div className="sm:hidden">
              <div className="flex items-center gap-3 mb-2">
                {!logoError && logoUrl1 ? (
                  <img src={logoUrl1} alt={otherToken?.symbol || ''} className="w-8 h-8 rounded-full bg-black/50" onError={() => setLogoError(true)}/>
                ) : !logo2Error && logoUrl2 ? (
                  <img src={logoUrl2} alt={mainToken?.symbol || ''} className="w-8 h-8 rounded-full bg-black/50" onError={() => setLogo2Error(true)}/>
                ) : (
                  <div className="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-xs font-bold text-gray-400">{fallbackLetter}</div>
                )}
                <div className="flex-1">
                  <div className={`font-semibold ${theme.text} text-sm flex items-center gap-1`}>
                    {pair.baseToken?.symbol||'—'}/{pair.quoteToken?.symbol||'—'}
                    {(pair._source === 'github' || pair._source === 'geckoterminal' || pair._source === 'dexscreener-enriched') && (pair.liquidity || 0) < MIN_LIQUIDITY && (
                      <span className="text-[10px] px-1 py-0.5 rounded bg-yellow-500/20 text-yellow-400 font-normal">LP</span>
                    )}
                  </div>
                  <div className="text-gray-500 text-xs">{formatDexId(pair.dexId)}</div>
                </div>
                <div className={`text-sm font-semibold ${isUp ? 'text-green-400' : 'text-red-400'}`}>
                  {isUp ? '▲' : '▼'} {Math.abs(priceChange).toFixed(1)}%
                </div>

    const BestRatios = ({ pairs, period, icon, label, theme, tokenName, historicalData, histLoading }) => {
      const days = period==='1d'?1:period==='7d'?7:period==='30d'?30:90;
      
      const sorted = useMemo(() => {

    // Smart Picks - Opportunity Scoring Algorithm
    // Weights: Ratio (40%), Trend (40%), Dip (15%), Liquidity (5%)
    // Ratio uses percentile scoring (relative to other pools)
    const calculateOpportunityScore = (pair, historicalData, ratioPercentile, liqPercentile, mainTokenSymbol) => {
      const liq = pair.liquidity || 0;
      const vol24h = pair.volume24h || 0;
      const ratio = liq > 0 ? vol24h / liq : 0;
      const change24h = pair.priceChange?.h24 || 0;
      
      // Get the other token symbol (not the main token)
      const baseSymbol = pair.baseToken?.symbol?.toUpperCase();
      const quoteSymbol = pair.quoteToken?.symbol?.toUpperCase();
      const otherTokenSymbol = baseSymbol === mainTokenSymbol?.toUpperCase() ? quoteSymbol : baseSymbol;
      const isOtherTokenStablecoin = GeckoTerminalAPI.isStablecoin(otherTokenSymbol);
      
      // Get historical data for this pair
      const histData = historicalData?.[pair.pairAddress];
      const priceTrends = histData?.priceTrends || { change7d: 0, change30d: 0, dipPercent: 0, isDip: false };
      
      // 1. RATIO SCORE (40%) - Percentile based (relative to all pools)
      // Top 25% = 100, Median = 50, Bottom 25% = 0
      const ratioScore = Math.max(0, Math.min(100, ratioPercentile));
      
      // 2. TREND SCORE (40%) - Positive trends are good
      // For stablecoins, trend is always neutral (50)
      let trendScore;
      if (isOtherTokenStablecoin) {
        trendScore = 50; // Neutral for stablecoins
      } else {
        // Weight: 24h (20%), 7d (50%), 30d (30%)
        const trend24hScore = Math.max(0, Math.min(100, 50 + change24h * 2));
        const trend7dScore = Math.max(0, Math.min(100, 50 + (priceTrends.change7d || 0) * 1.5));
        const trend30dScore = Math.max(0, Math.min(100, 50 + (priceTrends.change30d || 0)));
        trendScore = (trend24hScore * 0.2) + (trend7dScore * 0.5) + (trend30dScore * 0.3);
      }
      
      // 3. DIP SCORE (15%) - Below 7-day average = buying opportunity
      // For stablecoins, dip is always neutral (50) - they don't really "dip"
      // -10% below avg = 100, at avg = 50, +10% above = 0
      const dipPercent = isOtherTokenStablecoin ? 0 : (priceTrends.dipPercent || 0);
      const dipScore = isOtherTokenStablecoin ? 50 : Math.max(0, Math.min(100, 50 - dipPercent * 5));
      const isDip = isOtherTokenStablecoin ? false : (priceTrends.isDip || false);
      
      // 4. LIQUIDITY SCORE (5%) - Percentile based
      const liqScore = Math.max(0, Math.min(100, liqPercentile));
      
      // Combined score with new weights
      const totalScore = (ratioScore * 0.40) + (trendScore * 0.40) + (dipScore * 0.15) + (liqScore * 0.05);
      
      // Determine recommendation
      let recommendation = 'neutral';
      let emoji = '⚪';
      if (totalScore >= 70 && trendScore >= 50) {
        recommendation = 'strong';
        emoji = '🟢';
      } else if (totalScore >= 55 && trendScore >= 40) {
        recommendation = 'good';
        emoji = '🟡';
      } else if (trendScore < 35) {
        recommendation = 'caution';
        emoji = '🔴';
      }
      
      return {
        totalScore: Math.round(totalScore),
        ratioScore: Math.round(ratioScore),
        trendScore: Math.round(trendScore),
        dipScore: Math.round(dipScore),
        liqScore: Math.round(liqScore),
        ratioPercentile: Math.round(ratioPercentile),
        recommendation,
        emoji,
        ratio,
        change24h,
        change7d: isOtherTokenStablecoin ? 0 : (priceTrends.change7d || 0),
        change30d: isOtherTokenStablecoin ? 0 : (priceTrends.change30d || 0),
        dipPercent,
        isDip,
        isStablecoin: isOtherTokenStablecoin,
        liquidity: liq
      };
    };
    
    // Calculate percentile rank (0-100)
    const calculatePercentile = (value, allValues) => {
      if (!allValues || allValues.length === 0) return 50;
      const sorted = [...allValues].sort((a, b) => a - b);
      const rank = sorted.filter(v => v < value).length;
      return (rank / sorted.length) * 100;
    };

    // Hook to fetch accumulated fees in token contract
    const useContractBalance = (tokenContract, tokenPrice, enabled = true) => {
      const [balance, setBalance] = useState(null);
      const [loading, setLoading] = useState(false);

      // Fetch on mount and when contract changes
      useEffect(() => {

      // Calculate USD value
      const usdValue = balance !== null && tokenPrice ? balance * tokenPrice : null;
