name: Sync Validator Locations

on:
  schedule:
    # Run every hour at 15 minutes past
    - cron: '15 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download latest geo data from X1-Validator-HQ
        run: |
          echo "Fetching latest validator-locations.json..."
          
          # Try to download and show what we get
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o validator-locations.json https://raw.githubusercontent.com/ShakaVibe/X1-Validator-HQ/main/validator-locations.json)
          
          echo "HTTP response code: $HTTP_CODE"
          echo "File size: $(wc -c < validator-locations.json) bytes"
          echo "First 200 chars:"
          head -c 200 validator-locations.json
          echo ""
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to download file (HTTP $HTTP_CODE)"
            exit 1
          fi
          
          # Verify it's valid JSON
          if jq empty validator-locations.json 2>/dev/null; then
            TOTAL=$(jq -r '.totalLocations // .totalNodes // "unknown"' validator-locations.json)
            UPDATED=$(jq -r '.lastUpdated // "unknown"' validator-locations.json)
            echo "Valid JSON: $TOTAL locations, last updated: $UPDATED"
          else
            echo "Downloaded file is not valid JSON"
            exit 1
          fi
      
      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          git add validator-locations.json
          
          if git diff --staged --quiet; then
            echo "No changes to validator locations"
          else
            TOTAL=$(jq -r '.totalLocations // .totalNodes // "?"' validator-locations.json)
            git commit -m "Sync validator locations ($TOTAL nodes)"
            git push
            echo "Updated validator-locations.json with $TOTAL locations"
          fi
