name: Update Validator Geo Data
on:
  schedule:
    - cron: '21 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-geo
  cancel-in-progress: false

jobs:
  update-geo:
    runs-on: ubuntu-latest
    
    steps:
      # Audit 2026-11-17 #22: Node 20 is end-of-life. This bot is the first to move to Node 22 and to
      # actions pinned by commit (checkout v7.0.1, setup-node v7.1.0, looked up 2026-11-18); the other
      # bots follow once a run of this one has pushed its commit with them.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      
      - name: Run geo update script
        run: node generate-geo.js
      
      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add validator-locations.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update validator locations $(date -u +'%Y-%m-%d %H:%M:%S') UTC [skip ci]"
          # The scores (:07) and terminal (:37) bots also push to main; scheduled
          # runs are often delayed, so rebase and retry instead of failing on a
          # non-fast-forward push.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $i failed; retrying in 10s"
            sleep 10
          done
          echo "Could not push after 5 attempts" >&2
          exit 1

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TITLE="[bot] ${{ github.workflow }} is failing"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Run failed at $(date -u +'%Y-%m-%d %H:%M UTC'): $RUN_URL"
          # One open issue per workflow: comment if it exists, else create it.
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY" || true
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" --label bot-failure || \
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" || true
          fi
          # Optional Telegram ping (set TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in repo secrets).
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" -d text="⚠️ $TITLE — $RUN_URL" > /dev/null || true
          fi

      # Audit 2026-11-17 #14: the failure issue used to stay open, and collect comments, for
      # weeks after a one-off push race. A green run now closes it; a later failure opens a new one.
      - name: Close the failure issue once green again
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "[bot] ${{ github.workflow }} is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Exact title match (the search is fuzzy), so nothing else is ever closed.
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title \
            | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number' \
            | while read -r N; do
                gh issue close "$N" --repo "$GITHUB_REPOSITORY" \
                  --comment "Recovered: this workflow succeeded at $(date -u +'%Y-%m-%d %H:%M UTC') ($RUN_URL). Closed automatically; a new failure opens a new issue." || true
              done
