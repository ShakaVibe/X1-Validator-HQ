name: Update canonical validator scores

on:
  schedule:
    # Every hour at minute 7 (offset avoids the top-of-hour cron rush,
    # which can delay scheduled GitHub Actions runs significantly)
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compute scores
        run: node scripts/compute-scores.js
        env:
          X1_RPC_URL: https://rpc.mainnet.x1.xyz

      - name: Commit updated data
        run: |
          git config user.name "x1hq-score-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scores.json data/history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update canonical scores [skip ci]"
            # Rebase in case another push landed while we ran; retry a few times
            # (the geo and terminal bots push to main too).
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              echo "push attempt $i failed; retrying in 10s"
              sleep 10
            done
            echo "Could not push after 5 attempts" >&2
            exit 1
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TITLE="[bot] ${{ github.workflow }} is failing"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Run failed at $(date -u +'%Y-%m-%d %H:%M UTC'): $RUN_URL"
          # One open issue per workflow: comment if it exists, else create it.
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY" || true
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" --label bot-failure || \
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" || true
          fi
          # Optional Telegram ping (set TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in repo secrets).
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" -d text="⚠️ $TITLE — $RUN_URL" > /dev/null || true
          fi
