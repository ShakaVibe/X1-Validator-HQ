name: Update canonical validator scores

on:
  schedule:
    # Every hour at minute 7 (offset avoids the top-of-hour cron rush,
    # which can delay scheduled GitHub Actions runs significantly)
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Node 22 and actions pinned by commit (checkout v7.0.1, setup-node v7.1.0, looked up 2026-11-18;
      # audit #22). The geo bot ran this way first: two runs pushed their commits on 2026-11-18.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Compute scores
        run: node scripts/compute-scores.js
        env:
          X1_RPC_URL: https://rpc.mainnet.x1.xyz

      # Audit 2026-11-17 #7 part 2: look at the numbers before they are published
      # (scripts/check-published-data.js). A file that fails is put back to the published
      # version, so the commit step below publishes only the files that are fine; the run is
      # then failed after the commit, which opens the usual issue with the reasons in it.
      # Switch rules off without a code change: repository variable DATA_GATE_OFF.
      - name: Check the new data
        id: gate
        continue-on-error: true
        run: node scripts/check-published-data.js scores
        env:
          DATA_GATE_OFF: ${{ vars.DATA_GATE_OFF }}
          GATE_REPORT: ${{ runner.temp }}/data-check.md

      - name: Commit updated data
        run: |
          git config user.name "x1hq-score-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scores.json data/history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update canonical scores [skip ci]"
            # Rebase in case another push landed while we ran; retry a few times
            # (the geo and terminal bots push to main too).
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              echo "push attempt $i failed; retrying in 10s"
              sleep 10
            done
            echo "Could not push after 5 attempts" >&2
            exit 1
          fi

      - name: Fail the run if the data check held a file back
        if: steps.gate.outcome == 'failure'
        run: |
          echo "The data check held back at least one file (or could not run); see the step 'Check the new data'." >&2
          exit 1

      - name: Alert on failure
        if: failure()
        env:
          GATE_REPORT: ${{ runner.temp }}/data-check.md
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TITLE="[bot] ${{ github.workflow }} is failing"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Run failed at $(date -u +'%Y-%m-%d %H:%M UTC'): $RUN_URL"
          # What the data check found, if it ran (numbers and rule names only)
          if [ -s "$GATE_REPORT" ]; then BODY="$BODY

          $(head -c 3000 "$GATE_REPORT")"; fi
          # One open issue per workflow: comment if it exists, else create it.
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY" || true
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" --label bot-failure || \
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" || true
          fi
          # Optional Telegram ping (set TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in repo secrets).
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" -d text="⚠️ $TITLE — $RUN_URL" > /dev/null || true
          fi

      # Audit 2026-11-17 #14: the failure issue used to stay open, and collect comments, for
      # weeks after a one-off push race. A green run now closes it; a later failure opens a new one.
      - name: Close the failure issue once green again
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "[bot] ${{ github.workflow }} is failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Exact title match (the search is fuzzy), so nothing else is ever closed.
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title \
            | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number' \
            | while read -r N; do
                gh issue close "$N" --repo "$GITHUB_REPOSITORY" \
                  --comment "Recovered: this workflow succeeded at $(date -u +'%Y-%m-%d %H:%M UTC') ($RUN_URL). Closed automatically; a new failure opens a new issue." || true
              done
